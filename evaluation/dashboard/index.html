<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAG Evaluation Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
/* Built on the WSM RAG Evaluation Visualizer (visualization_tool/index.html): same container, header, upload box, centered metric cards,
   roomy table cells with mono numbers, and the expandable detail rows. Additions: light/dark switch, two metric layers, question groups,
   a right-hand metric guide, reference lists. Dark is the default, like the original. */
:root {
  --bg-color: #0f172a;
  --text-color: #e2e8f0;
  --primary-color: #3b82f6;
  --secondary-color: #1e293b;
  --accent-color: #60a5fa;
  --success-color: #22c55e;
  --warning-color: #f59e0b;
  --danger-color: #ef4444;
  --border-color: #334155;
  --muted: #94a3b8;
  --th-bg: #1e293b;
  --row-hover: #2d3748;
  --details-bg: #1a202c;
  --text-box: #2d3748;
  --hl: rgba(96, 165, 250, .16);
  --banner-bg: rgba(59, 130, 246, .14);
  --on-primary: #ffffff;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  --font-text: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Roboto Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Noto Sans TC", "Microsoft JhengHei", monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg-color: #f1f5f9; --text-color: #0f172a; --primary-color: #2563eb; --secondary-color: #ffffff; --accent-color: #1d4ed8;
    --success-color: #15803d; --warning-color: #b45309; --danger-color: #b91c1c; --border-color: #cbd5e1; --muted: #475569;
    --th-bg: #e8eef6; --row-hover: #eef3fa; --details-bg: #f8fafc; --text-box: #eef2f7; --hl: rgba(37, 99, 235, .10);
    --banner-bg: rgba(37, 99, 235, .08); --shadow: 0 10px 30px rgba(15, 23, 42, .18); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg-color: #f1f5f9; --text-color: #0f172a; --primary-color: #2563eb; --secondary-color: #ffffff; --accent-color: #1d4ed8;
  --success-color: #15803d; --warning-color: #b45309; --danger-color: #b91c1c; --border-color: #cbd5e1; --muted: #475569;
  --th-bg: #e8eef6; --row-hover: #eef3fa; --details-bg: #f8fafc; --text-box: #eef2f7; --hl: rgba(37, 99, 235, .10);
  --banner-bg: rgba(37, 99, 235, .08); --shadow: 0 10px 30px rgba(15, 23, 42, .18); color-scheme: light;
}
* { box-sizing: border-box; }
body {
  font-family: var(--font-text); background-color: var(--bg-color); color: var(--text-color); margin: 0; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; }
.container { max-width: 1200px; margin: 0 auto; padding: 2rem 0; }

header { margin-bottom: 2rem; text-align: center; position: relative; }
h1 {
  font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; margin-top: 0;
  background: linear-gradient(to right, var(--primary-color), var(--accent-color)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.subtitle { margin: 0; color: var(--muted); }
.header-tools { display: flex; justify-content: center; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
.seg { display: inline-flex; border: 1px solid var(--border-color); border-radius: 0.5rem; overflow: hidden; }
.seg button { background: var(--secondary-color); border: 0; padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.85rem; border-right: 1px solid var(--border-color); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--primary-color); color: var(--on-primary); font-weight: 600; }
.btn { background: var(--secondary-color); border: 1px solid var(--border-color); border-radius: 0.5rem; padding: 0.4rem 0.9rem; cursor: pointer; font-size: 0.85rem; }
.btn:hover { border-color: var(--primary-color); }
.help-btn { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 600; }
.help-btn .q { display: inline-grid; place-items: center; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--primary-color); color: var(--on-primary); font-size: 0.75rem; }

.upload-section {
  background-color: var(--secondary-color); border: 2px dashed var(--border-color); border-radius: 1rem; padding: 2rem; text-align: center; margin-bottom: 2rem; transition: border-color 0.3s ease;
}
.upload-section:hover { border-color: var(--primary-color); }
input[type="file"] { display: none; }
.custom-file-upload {
  display: inline-block; padding: 0.75rem 1.5rem; cursor: pointer; background-color: var(--primary-color); color: var(--on-primary); border-radius: 0.5rem; font-weight: 600; transition: background-color 0.3s ease;
}
.custom-file-upload:hover { background-color: var(--accent-color); }
#file-name { margin: 1rem 0 0; color: var(--muted); overflow-wrap: anywhere; }
.banner { background: var(--banner-bg); border: 1px solid var(--primary-color); border-radius: 0.5rem; padding: 0.35rem 0.9rem; margin: -1rem 0 1.5rem; font-size: 0.85rem; text-align: center; }

.metrics-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.metric-card { background-color: var(--secondary-color); padding: 1.5rem; border-radius: 0.75rem; text-align: center; border: 1px solid var(--border-color); cursor: pointer; font: inherit; color: inherit; min-width: 0; }
.metric-card:hover { border-color: var(--primary-color); }
.metric-value { font-size: 2rem; font-weight: 700; color: var(--accent-color); font-variant-numeric: tabular-nums; }
.baseline-value { font-size: 0.875rem; font-weight: 600; color: var(--primary-color); opacity: 0; }
.metric-label { font-size: 0.875rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.metric-n { font-size: 0.75rem; color: var(--muted); }
.adv-block { display: none; }
body.show-adv .adv-block { display: block; }
.section-note { margin: 1.5rem 0 0.75rem; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin: 2rem 0 0.75rem; }
.toolbar .note { color: var(--muted); font-size: 0.85rem; }

.table-scroll { overflow-x: auto; border-radius: 0.75rem; border: 1px solid var(--border-color); background-color: var(--secondary-color); }
table { width: 100%; border-collapse: collapse; background-color: var(--secondary-color); }
th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
th { background-color: var(--th-bg); font-weight: 600; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { color: var(--text-color); }
thead tr.groups th { cursor: default; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 0.6rem; padding-bottom: 0.3rem; border-bottom: 1px dashed var(--border-color); }
thead tr.groups th:hover { color: var(--muted); }
tr.qrow { cursor: pointer; }
tr.qrow:hover { background-color: var(--row-hover); }
.score-cell { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
.score-cell.na { color: var(--muted); font-weight: 400; }
.expand-btn { background: none; border: none; color: var(--accent-color); cursor: pointer; font-size: 1.2rem; padding: 0; width: 100%; }
td.qcell { white-space: nowrap; }
.qid { font-weight: 700; margin-right: 0.5rem; }
tr.group-row td { background-color: var(--th-bg); color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.6rem 1rem; }
.score-high { color: var(--success-color); }
.score-med { color: var(--warning-color); }
.score-low { color: var(--danger-color); }
td.hl, th.hl { background-color: var(--hl); }
.adv { display: none; }
body.show-adv .adv { display: table-cell; }
tr:last-child > td { border-bottom: 0; }

.details-row { display: none; background-color: var(--details-bg); }
.details-row.open { display: table-row; }
.details-content { padding: 1.5rem; }
.detail-section { margin-bottom: 1.5rem; }
.detail-title { font-weight: 600; color: var(--muted); margin-bottom: 0.5rem; font-size: 0.9rem; }
.detail-text { background-color: var(--text-box); padding: 1rem; border-radius: 0.5rem; white-space: pre-wrap; font-family: var(--font-mono); font-size: 0.9rem; overflow-wrap: anywhere; }
.detail-line { font-family: var(--font-text); }
.references-list { list-style-type: disc; padding-left: 1.5rem; margin: 0; }
.references-list li { margin-bottom: 0.5rem; overflow-wrap: anywhere; }
.routing { display: flex; gap: 1.5rem; flex-wrap: wrap; color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
.routing b { color: var(--text-color); }
.routing b.diff { color: var(--warning-color); }
.mini-scroll { overflow-x: auto; background: var(--text-box); border-radius: 0.5rem; }
.mini { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: transparent; }
.mini th { background: transparent; cursor: default; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.7rem; padding: 0.5rem 0.75rem; }
.mini td { padding: 0.5rem 0.75rem; vertical-align: top; overflow-wrap: anywhere; }
.mini td:first-child { white-space: nowrap; }
.chip { display: inline-block; padding: 0.05rem 0.55rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; white-space: nowrap; border: 1px solid currentColor; }
.chip.relevant, .chip.supported { color: var(--success-color); }
.chip.wrong, .chip.unsupported { color: var(--danger-color); }
.chip.irrelevant, .chip.not_applicable { color: var(--warning-color); }
.tag { display: inline-block; margin-left: 0.4rem; padding: 0 0.45rem; border-radius: 0.3rem; font-size: 0.7rem; color: var(--muted); border: 1px solid var(--border-color); font-family: var(--font-text); white-space: nowrap; }
.ids { color: var(--text-color); }
.ids span { color: var(--muted); }
.kp-line { margin: 0 0 0.9rem; overflow-wrap: anywhere; }
.kp-line .kid { font-weight: 700; margin-right: 0.5rem; }
.alts { color: var(--accent-color); }
.gt-tag { display: inline-block; margin-left: 0.4rem; padding: 0 0.45rem; border-radius: 0.3rem; font-size: 0.72rem; font-family: var(--font-text); white-space: nowrap; border: 1px solid var(--border-color); color: var(--text-color); background: none; line-height: 1.5; vertical-align: baseline; }
.gt-tag.rep { color: var(--accent-color); border-color: var(--accent-color); cursor: pointer; }
.gt-tag.legend { cursor: default; }
.gt-rep { color: var(--accent-color); }
.gt-opt { color: var(--muted); font-size: 0.8rem; }
.gt-forms { display: block; margin: 0.4rem 0 0.4rem 1.2rem; padding: 0.5rem 0.8rem; border-left: 2px solid var(--accent-color); background: var(--details-bg); font-family: var(--font-text); white-space: normal; }
.gt-forms[hidden] { display: none; }
.gt-rule { display: block; margin-top: 0.3rem; font-size: 0.8rem; color: var(--muted); }
.gt-legend { margin-bottom: 0.6rem; font-size: 0.8rem; color: var(--muted); }

details > summary { cursor: pointer; color: var(--accent-color); font-size: 0.8rem; margin-top: 0.25rem; }
details.ref-item { background: var(--text-box); border-radius: 0.5rem; padding: 0.6rem 1rem; margin-bottom: 0.5rem; }
details.ref-item > summary { margin: 0; color: var(--text-color); font-size: 0.9rem; }
details.ref-item .detail-text { margin-top: 0.75rem; background: var(--details-bg); max-height: 22rem; overflow: auto; }
.mark { font-weight: 700; margin-right: 0.4rem; }
.mark.ok { color: var(--success-color); } .mark.missing { color: var(--danger-color); }
.meta { display: block; color: var(--muted); font-size: 0.8rem; font-family: var(--font-text); }
.empty { padding: 3rem 1rem; text-align: center; color: var(--muted); background: var(--secondary-color); border: 2px dashed var(--border-color); border-radius: 1rem; }
.empty code { font-family: var(--font-mono); background: var(--text-box); padding: 0.1rem 0.4rem; border-radius: 0.3rem; }

/* metric guide: right-hand drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100vw); background: var(--secondary-color); border-left: 1px solid var(--border-color); box-shadow: var(--shadow); z-index: 50;
  transform: translateX(104%); transition: transform .22s ease; display: flex; flex-direction: column; visibility: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.open { transform: none; visibility: visible; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-color); }
.drawer-head h2 { margin: 0; font-size: 1.1rem; }
.x { border: 1px solid var(--border-color); background: transparent; border-radius: 0.5rem; width: 2rem; height: 2rem; cursor: pointer; font-size: 1rem; line-height: 1; }
.x:hover { border-color: var(--primary-color); }
.pages { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border-color); }
.pagebtn { background: transparent; border: 1px solid var(--border-color); border-radius: 999px; padding: 0.15rem 0.7rem; font-size: 0.8rem; cursor: pointer; }
.pagebtn[aria-current="true"] { background: var(--primary-color); border-color: var(--primary-color); color: var(--on-primary); font-weight: 600; }
.drawer-body { padding: 1.25rem; overflow-y: auto; flex: 1; min-height: 0; }
.drawer-body h3 { margin: 0 0 0.25rem; font-size: 1.15rem; }
.drawer-body .what { margin: 0 0 1rem; color: var(--muted); }
.drawer-body h5 { margin: 1.25rem 0 0.4rem; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.drawer-body p { margin: 0 0 0.5rem; }
.formula { font-family: var(--font-mono); font-size: 0.85rem; background: var(--text-box); border-radius: 0.5rem; padding: 0.6rem 0.8rem; overflow-x: auto; white-space: pre; }
.ex { background: var(--text-box); border-radius: 0.5rem; padding: 0.75rem 1rem; font-size: 0.85rem; }
.ex .exh { font-weight: 600; margin-bottom: 0.4rem; }
.ex ul { margin: 0.4rem 0; padding-left: 1.2rem; }
.ex li { margin: 0.15rem 0; }
.calc { font-family: var(--font-mono); margin-top: 0.4rem; }
.trap { border-left: 3px solid var(--warning-color); padding: 0.1rem 0 0.1rem 0.75rem; }
.note { color: var(--muted); }

@media (max-width: 640px) { h1 { font-size: 1.8rem; } th, td { padding: 0.7rem; } .details-content { padding: 1rem; } }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>RAG Evaluation Dashboard</h1>
    <p class="subtitle">NCCU academic affairs QA &middot; one row per question &middot; scores of one run</p>
    <div class="header-tools">
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="dark">Dark</button>
        <button type="button" data-theme-choice="light">Light</button>
        <button type="button" data-theme-choice="system">System</button>
      </div>
      <button class="btn help-btn" id="help-open" type="button" aria-controls="drawer"><span class="q" aria-hidden="true">?</span> Metric guide</button>
    </div>
  </header>

  <div class="upload-section">
    <label for="file-upload" class="custom-file-upload">Choose File</label>
    <input id="file-upload" type="file" accept=".jsonl,.json,.txt">
    <p id="file-name">Load a .jsonl score file written by export_scores.py</p>
  </div>
  <div class="banner" id="banner" hidden>Preview build &mdash; sample data</div>

  <div id="app"></div>
</div>

<aside class="drawer" id="drawer" role="dialog" aria-label="Metric guide" aria-hidden="true">
  <div class="drawer-head"><h2>Metric guide</h2><button class="x" id="help-close" type="button" aria-label="Close metric guide">&#x2715;</button></div>
  <nav class="pages" id="pages" aria-label="Metrics"></nav>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script id="initial-data" type="text/plain"></script>
<script>
(function () {
  'use strict';

  /* ---------- theme (Dark default, remembered) ---------- */
  var root = document.documentElement;
  function storedTheme() { try { return localStorage.getItem('rag-dashboard-theme'); } catch (e) { return null; } }
  function applyTheme(choice) {
    if (choice === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', choice);
    Array.prototype.forEach.call(document.querySelectorAll('[data-theme-choice]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-theme-choice') === choice)); });
    try { localStorage.setItem('rag-dashboard-theme', choice); } catch (e) {}
  }
  var st = storedTheme();
  applyTheme(st === 'light' || st === 'system' || st === 'dark' ? st : (root.getAttribute('data-theme') || 'dark'));
  document.querySelector('.seg').addEventListener('click', function (e) { var b = e.target.closest('[data-theme-choice]'); if (b) applyTheme(b.getAttribute('data-theme-choice')); });

  /* ---------- metric columns (layer 1 core, layer 2 advanced) ---------- */
  function f3(x) { return x == null ? '—' : Number(x).toFixed(3); }
  function f1(p, r) { return (p == null || r == null) ? null : ((p + r) > 0 ? 2 * p * r / (p + r) : 0); }
  function kpCounts(r) {
    var ks = r.responses && r.responses.keypoints; if (!ks) return null;
    var c = { rel: 0, wrong: 0, irr: 0, na: 0, total: 0 };
    ks.forEach(function (k) { if (k.verdict === 'relevant') c.rel++; else if (k.verdict === 'wrong') c.wrong++; else if (k.verdict === 'irrelevant') c.irr++; else if (k.verdict === 'not_applicable') c.na++; });
    c.total = c.rel + c.wrong + c.irr; return c;
  }
  var COLS = [
    { id: 'kp_p',  page: 'kp',    group: 'Keypoint', label: 'P',  get: function (r) { return r.keypoint ? r.keypoint.precision : null; }, tip: function (r) { var c = kpCounts(r); return c ? c.rel + ' / (' + c.rel + ' + ' + c.wrong + ') keypoints' : ''; } },
    { id: 'kp_r',  page: 'kp',    group: 'Keypoint', label: 'R',  get: function (r) { return r.keypoint ? r.keypoint.recall : null; }, tip: function (r) { var c = kpCounts(r); return c ? c.rel + ' / ' + c.total + ' keypoints (= Completeness)' : '= Completeness'; } },
    { id: 'kp_f',  page: 'kp',    group: 'Keypoint', label: 'F1', get: function (r) { return r.keypoint ? r.keypoint.f1 : null; } },
    { id: 'hall',  page: 'cir',   group: 'Keypoint outcome', label: 'Hallu', low: true, get: function (r) { return r.hallucination; }, tip: function (r) { var c = kpCounts(r); return c ? c.wrong + ' / ' + c.total + ' keypoints stated wrongly' : ''; } },
    { id: 'irr',   page: 'cir',   group: 'Keypoint outcome', label: 'Irrel', low: true, get: function (r) { return r.irrelevance; }, tip: function (r) { var c = kpCounts(r); return c ? c.irr + ' / ' + c.total + ' keypoints not stated' : ''; } },
    { id: 'cl_p',  page: 'claim', group: 'Claim', label: 'P',  get: function (r) { return r.claim ? r.claim.precision : null; }, tip: function (r) { return r.claim ? r.claim.correct + ' / ' + r.claim.claims + ' claims' : ''; } },
    { id: 'cl_r',  page: 'claim', group: 'Claim', label: 'R',  get: function (r) { return r.claim ? r.claim.recall : null; } },
    { id: 'cl_f',  page: 'claim', group: 'Claim', label: 'F1', get: function (r) { return r.claim ? r.claim.f1 : null; } },
    { id: 'evid',  page: 'evid',  group: 'Evidence', label: 'Support', get: function (r) { return r.evidence ? r.evidence.rate : null; }, tip: function (r) { return r.evidence ? r.evidence.supported + ' / ' + r.evidence.claims + ' claims supported' : ''; } },
    { id: 'acc',   page: 'acc',   group: 'Rule-based', label: 'Accuracy', frac: true, get: function (r) { return r.accuracy ? r.accuracy.value : null; },
      tip: function (r) { if (!r.accuracy) return ''; var n = r.ground_truth && r.ground_truth.keypoints ? r.ground_truth.keypoints.length : null; return r.accuracy.hit + ' of ' + r.accuracy.total + ' hard facts matched' + (n ? ' (' + r.accuracy.total + ' of ' + n + ' keypoints are hard facts)' : ''); } },
    { id: 'rouge', page: 'rouge', group: 'Surface', label: 'ROUGE-L', adv: true, get: function (r) { return r.ROUGELScore; }, tip: function (r) { return r.rouge ? 'P ' + f3(r.rouge.p) + ' / R ' + f3(r.rouge.r) + ' / F ' + f3(r.rouge.f) : ''; } },
    { id: 's_p',   page: 'retr',  group: 'Retrieval: sentences', label: 'P',  adv: true, get: function (r) { return r.Sentences_Precision; } },
    { id: 's_r',   page: 'retr',  group: 'Retrieval: sentences', label: 'R',  adv: true, get: function (r) { return r.Sentences_Recall; } },
    { id: 's_f',   page: 'retr',  group: 'Retrieval: sentences', label: 'F1', adv: true, get: function (r) { return f1(r.Sentences_Precision, r.Sentences_Recall); } },
    { id: 'w_p',   page: 'retr',  group: 'Retrieval: words', label: 'P',  adv: true, get: function (r) { return r.Words_Precision; } },
    { id: 'w_r',   page: 'retr',  group: 'Retrieval: words', label: 'R',  adv: true, get: function (r) { return r.Words_Recall; } },
    { id: 'w_f',   page: 'retr',  group: 'Retrieval: words', label: 'F1', adv: true, get: function (r) { return f1(r.Words_Precision, r.Words_Recall); } }
  ];
  var CARD_ROWS = [

      what: 'Of the gold keypoints, what share did the answer state wrongly, and what share did it not state at all?',
      formula: 'Hallucination = wrong / keypoints\nIrrelevance = not stated / keypoints\nCompleteness = relevant / keypoints\n    (the same number as Keypoint R)',
      example: '<div class="exh">' + EX.question + '</div><p><b>' + A.name + '</b>: ' + ca.relevant + ' relevant, ' + ca.wrong + ' wrong, ' + ca.irrelevant + ' not stated &rarr; Completeness / Hallucination / Irrelevance = <span class="calc">0.714 / 0.286 / 0.000</span></p><p><b>' + B.name + '</b>: ' + cb.relevant + ' relevant, ' + cb.wrong + ' wrong, ' + cb.irrelevant + ' not stated &rarr; <span class="calc">0.286 / 0.000 / 0.714</span></p>',
      read: 'The three add up to 1 (conditional keypoints that do not apply are left out). For Hallucination and Irrelevance lower is better.',
      trap: 'One mistake can turn several keypoints wrong at once, so Hallucination can be larger than the number of errors you would count by eye.',
      src: 'Claude Code judges each keypoint (stage 3).' },
    { key: 'claim', title: 'Claim P / R / F1', short: 'Claim P/R/F1',
      what: 'Of everything the answer says, how much correctly states a gold fact? This measures focus, not only correctness.',
      formula: 'P = claims that correctly state a keypoint / all claims\nR = relevant keypoints / all keypoints (same as Keypoint R)\nF1 = 2PR / (P + R)',
      example: '<div class="exh">' + EX.question + ' &mdash; ' + A.name + '</div>' + claimList(A) + '<div class="calc">9 claims: 6 correct, 2 wrong, 1 extra<br>P = 6 / 9 = 0.667<br>R = 5 / 7 = 0.714<br>F1 = 0.690</div>',
      read: 'Low P means the answer carries claims that do not map to a correct gold fact: wrong ones or extra ones.',
      trap: 'Extra but true information (c9) also lowers P. It is a focus measure. Whether c9 is supported by evidence is the job of Evidence Support.',
      src: 'Claude Code links claims to keypoints (stage 3), using the isolated trace.' },
    { key: 'evid', title: 'Evidence Support', short: 'Evidence Support',
      what: 'For each statement in the answer, is there text the system actually read that supports it?',
      formula: 'Evidence Support = supported claims / all claims',
      example: '<div class="exh">' + EX.question + ' &mdash; ' + A.name + '</div>' + claimList(A) + '<div class="calc">c1 (24) and c5 (30) have no support in what the system read<br>7 / 9 = 0.778</div>',
      read: 'High means the answer stays within what the system read. It is the only metric that also checks statements the gold does not list.',
      trap: 'A short answer can be fully supported and still incomplete: ' + B.name + ' scores 2 / 2 = 1.000 here but Keypoint R 0.286. Read it together with Keypoint R.',
      src: 'An isolated subagent traces every claim to a quote (stage 3); a program verifies that each quote is in the evidence.' },
    { key: 'acc', title: 'Accuracy (rule-based, hard facts only)', short: 'Accuracy',
      what: 'Of the exact values the answer must contain (numbers, links, extensions, floors), how many does it contain correctly? This is a recall over the hard facts, checked by a program, not by Claude.',
      formula: 'Accuracy = hard facts matched / hard facts',
      example: '<div class="exh">' + EX.question + ' &mdash; ' + A.name + '</div>Hard facts (a value the answer must contain): K1, K2, K3, K6, K7 = 5 of the 7 keypoints. K4 and K5 are worded facts, so the rule does not count them.<ul><li>K1 wants 25, answer says 24 &rarr; miss</li><li>K2 wants 31, answer says 31 &rarr; hit</li><li>K3 wants 28, answer says 30 &rarr; miss</li><li>K6 wants 12, answer says 12 &rarr; hit</li><li>K7 wants 10, answer says 10 &rarr; hit</li></ul><div class="calc">3 / 5 = 0.600   (Keypoint R is 5 / 7: it also counts K4 and K5)</div>',
      read: 'High means the exact values are present and not contradicted. It is a cheap cross-check of Keypoint R: on the hard facts, Claude and the rule should agree.',
      trap: 'Only hard facts count (5 of 7 keypoints here, 4 of 21 in some questions). A wrong value and a missing value are both a miss. It can be fooled when the right string appears somewhere else: "輔系上限 25 學分" contains 25學分, so K1 looks matched.',
      src: 'Rule program, no LLM. Available right after the run (stage 2).' },
    { key: 'rouge', title: 'Surface Similarity (ROUGE-L)', short: 'ROUGE-L',
      what: 'How similar is the wording of the answer to the gold answer text?',
      formula: 'ROUGE-L = F-score of the longest common subsequence\n(Chinese text cut into words with jieba)',
      example: '<div class="exh">' + EX.question + '</div><p><b>' + A.name + '</b> (two wrong numbers): P 0.509, R 0.773, F <span class="calc">0.614</span></p><p><b>' + B.name + '</b> (two right facts only): P 0.800, R 0.213, F <span class="calc">0.337</span></p>',
      read: 'A rough check that the answer is in the same shape as the gold. It never tells right from wrong.',
      trap: 'The answer with wrong numbers (0.614) scores higher than the short correct one (0.337). Do not read it as quality.',
      src: 'Program, no LLM. Available right after the run (stage 2).' },
    { key: 'retr', title: 'Retrieval (Context Sentence / Words P / R / F1)', short: 'Retrieval',
      what: 'Did the text the system read contain the source passages the gold answer needs?',
      formula: 'R = gold source sentences (words) found in the read text / all gold source sentences (words)\nP = the share of the read text that is gold source\nF1 = 2PR / (P + R)',
      example: '<div class="exh">' + EX.question + '</div><p>Sentences: R <span class="calc">1.000</span>, P 0.014, F1 0.028</p><p>Words: R <span class="calc">0.985</span>, P 0.028, F1 0.055</p><p>Both answers read the same pages, so these numbers are the same for ' + A.name + ' and ' + B.name + '. Open a question and look at its Ground Truth References: every &#x2717; is a gold passage the system did not read.</p>',
      read: 'R is the one to look at: low R means the system never read what it needed (a retrieval failure, not a writing failure).',
      trap: '<b>P and F1 are always small</b>: the system reads whole pages and only a few sentences are gold. They get the same colors as the rest but only mean something when you compare runs (for example BM25 only vs grep only).',
      src: 'Program, no LLM. Available right after the run (stage 2).' }
  ];
  function pageHtml(p) {
    return '<h3>' + esc(p.title) + '</h3><p class="what">' + p.what + '</p><h5>Formula</h5><div class="formula">' + esc(p.formula) + '</div><h5>Worked example</h5><div class="ex">' + p.example + '</div>' +
      '<h5>How to read it</h5><p>' + p.read + '</p><h5>Common trap</h5><div class="trap">' + p.trap + '</div><h5>Where it comes from</h5><p>' + p.src + '</p>';
  }
  var drawer = document.getElementById('drawer'), pagesEl = document.getElementById('pages'), lastFocus = null;
  pagesEl.innerHTML = PAGES.map(function (p) { return '<button type="button" class="pagebtn" data-page-key="' + p.key + '">' + esc(p.short) + '</button>'; }).join('');
  function markColumns() {                                         // highlight the matching table columns without redrawing the table
    Array.prototype.forEach.call(document.querySelectorAll('#results-table [data-page]'), function (el) { el.classList.toggle('hl', activePage != null && el.getAttribute('data-page') === activePage); });
    Array.prototype.forEach.call(pagesEl.children, function (b) { if (b.getAttribute('data-page-key') === activePage) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
  }
  function openHelp(key) {
    var p = PAGES.filter(function (x) { return x.key === key; })[0] || PAGES[0], wasOpen = drawer.classList.contains('open');
    activePage = p.key;
    var body = document.getElementById('drawer-body'); body.innerHTML = pageHtml(p); body.scrollTop = 0;
    if (!wasOpen) { lastFocus = document.activeElement; drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false'); document.getElementById('help-close').focus({ preventScroll: true }); }
    markColumns();
  }
  function closeHelp() {
    drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); activePage = null; markColumns();
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
  }
  document.getElementById('help-open').addEventListener('click', function () { openHelp(activePage || 'kp'); });
  document.getElementById('help-close').addEventListener('click', closeHelp);
  pagesEl.addEventListener('click', function (e) { var b = e.target.closest('[data-page-key]'); if (b) openHelp(b.getAttribute('data-page-key')); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drawer.classList.contains('open')) closeHelp(); });
  document.addEventListener('click', function (e) {              // click outside the guide closes it; the table stays usable
    if (!drawer.classList.contains('open')) return;
    var path = e.composedPath ? e.composedPath() : [];
    if (path.indexOf(drawer) >= 0 || path.indexOf(document.getElementById('help-open')) >= 0) return;
    if (e.target.closest && (e.target.closest('[data-card-page]') || e.target.closest('#app') || e.target.closest('.seg'))) return;
    closeHelp();
  });

  /* ---------- start ---------- */
  var initial = parseJsonl(document.getElementById('initial-data').textContent);
  if (initial.length) setRows(initial, 'Embedded sample (' + initial.length + ' questions)'); else render();
})();
</script>
</body>
</html>
