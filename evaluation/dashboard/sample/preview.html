:root {
  --bg-color: #0f172a;
  --text-color: #e2e8f0;
  --primary-color: #3b82f6;
  --secondary-color: #1e293b;
  --accent-color: #60a5fa;
  --success-color: #22c55e;
  --warning-color: #f59e0b;
  --danger-color: #ef4444;
  --border-color: #334155;
  --muted: #94a3b8;
  --th-bg: #1e293b;
  --row-hover: #2d3748;
  --details-bg: #1a202c;
  --text-box: #2d3748;
  --hl: rgba(96, 165, 250, .16);
  --banner-bg: rgba(59, 130, 246, .14);
  --on-primary: #ffffff;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  --font-text: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Roboto Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Noto Sans TC", "Microsoft JhengHei", monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg-color: #f1f5f9; --text-color: #0f172a; --primary-color: #2563eb; --secondary-color: #ffffff; --accent-color: #1d4ed8;
    --success-color: #15803d; --warning-color: #b45309; --danger-color: #b91c1c; --border-color: #cbd5e1; --muted: #475569;
    --th-bg: #e8eef6; --row-hover: #eef3fa; --details-bg: #f8fafc; --text-box: #eef2f7; --hl: rgba(37, 99, 235, .10);
    --banner-bg: rgba(37, 99, 235, .08); --shadow: 0 10px 30px rgba(15, 23, 42, .18); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg-color: #f1f5f9; --text-color: #0f172a; --primary-color: #2563eb; --secondary-color: #ffffff; --accent-color: #1d4ed8;
  --success-color: #15803d; --warning-color: #b45309; --danger-color: #b91c1c; --border-color: #cbd5e1; --muted: #475569;
  --th-bg: #e8eef6; --row-hover: #eef3fa; --details-bg: #f8fafc; --text-box: #eef2f7; --hl: rgba(37, 99, 235, .10);
  --banner-bg: rgba(37, 99, 235, .08); --shadow: 0 10px 30px rgba(15, 23, 42, .18); color-scheme: light;
}
* { box-sizing: border-box; }
body {
  font-family: var(--font-text); background-color: var(--bg-color); color: var(--text-color); margin: 0; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; }
.container { max-width: 1200px; margin: 0 auto; padding: 2rem 0; }

header { margin-bottom: 2rem; text-align: center; position: relative; }
h1 {
  font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; margin-top: 0;
  background: linear-gradient(to right, var(--primary-color), var(--accent-color)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.subtitle { margin: 0; color: var(--muted); }
.header-tools { display: flex; justify-content: center; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
.seg { display: inline-flex; border: 1px solid var(--border-color); border-radius: 0.5rem; overflow: hidden; }
.seg button { background: var(--secondary-color); border: 0; padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.85rem; border-right: 1px solid var(--border-color); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--primary-color); color: var(--on-primary); font-weight: 600; }
.btn { background: var(--secondary-color); border: 1px solid var(--border-color); border-radius: 0.5rem; padding: 0.4rem 0.9rem; cursor: pointer; font-size: 0.85rem; }
.btn:hover { border-color: var(--primary-color); }
.help-btn { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 600; }
.help-btn .q { display: inline-grid; place-items: center; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--primary-color); color: var(--on-primary); font-size: 0.75rem; }

.upload-section {
  background-color: var(--secondary-color); border: 2px dashed var(--border-color); border-radius: 1rem; padding: 2rem; text-align: center; margin-bottom: 2rem; transition: border-color 0.3s ease;
}
.upload-section:hover { border-color: var(--primary-color); }
input[type="file"] { display: none; }
.custom-file-upload {
  display: inline-block; padding: 0.75rem 1.5rem; cursor: pointer; background-color: var(--primary-color); color: var(--on-primary); border-radius: 0.5rem; font-weight: 600; transition: background-color 0.3s ease;
}
.custom-file-upload:hover { background-color: var(--accent-color); }
#file-name { margin: 1rem 0 0; color: var(--muted); overflow-wrap: anywhere; }
.banner { background: var(--banner-bg); border: 1px solid var(--primary-color); border-radius: 0.5rem; padding: 0.35rem 0.9rem; margin: -1rem 0 1.5rem; font-size: 0.85rem; text-align: center; }

.metrics-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.metric-card { background-color: var(--secondary-color); padding: 1.5rem; border-radius: 0.75rem; text-align: center; border: 1px solid var(--border-color); cursor: pointer; font: inherit; color: inherit; min-width: 0; }
.metric-card:hover { border-color: var(--primary-color); }
.metric-value { font-size: 2rem; font-weight: 700; color: var(--accent-color); font-variant-numeric: tabular-nums; }
.baseline-value { font-size: 0.875rem; font-weight: 600; color: var(--primary-color); opacity: 0; }
.metric-label { font-size: 0.875rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.metric-n { font-size: 0.75rem; color: var(--muted); }
.adv-block { display: none; }
body.show-adv .adv-block { display: block; }
.section-note { margin: 1.5rem 0 0.75rem; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin: 2rem 0 0.75rem; }
.toolbar .note { color: var(--muted); font-size: 0.85rem; }

.table-scroll { overflow-x: auto; border-radius: 0.75rem; border: 1px solid var(--border-color); background-color: var(--secondary-color); }
table { width: 100%; border-collapse: collapse; background-color: var(--secondary-color); }
th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
th { background-color: var(--th-bg); font-weight: 600; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { color: var(--text-color); }
thead tr.groups th { cursor: default; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 0.6rem; padding-bottom: 0.3rem; border-bottom: 1px dashed var(--border-color); }
thead tr.groups th:hover { color: var(--muted); }
tr.qrow { cursor: pointer; }
tr.qrow:hover { background-color: var(--row-hover); }
.score-cell { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
.score-cell.na { color: var(--muted); font-weight: 400; }
.expand-btn { background: none; border: none; color: var(--accent-color); cursor: pointer; font-size: 1.2rem; padding: 0; width: 100%; }
td.qcell { white-space: nowrap; }
.qid { font-weight: 700; margin-right: 0.5rem; }
tr.group-row td { background-color: var(--th-bg); color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.6rem 1rem; }
.score-high { color: var(--success-color); }
.score-med { color: var(--warning-color); }
.score-low { color: var(--danger-color); }
td.hl, th.hl { background-color: var(--hl); }
.adv { display: none; }
body.show-adv .adv { display: table-cell; }
tr:last-child > td { border-bottom: 0; }

.details-row { display: none; background-color: var(--details-bg); }
.details-row.open { display: table-row; }
.details-content { padding: 1.5rem; }
.detail-section { margin-bottom: 1.5rem; }
.detail-title { font-weight: 600; color: var(--muted); margin-bottom: 0.5rem; font-size: 0.9rem; }
.detail-text { background-color: var(--text-box); padding: 1rem; border-radius: 0.5rem; white-space: pre-wrap; font-family: var(--font-mono); font-size: 0.9rem; overflow-wrap: anywhere; }
.detail-line { font-family: var(--font-text); }
.references-list { list-style-type: disc; padding-left: 1.5rem; margin: 0; }
.references-list li { margin-bottom: 0.5rem; overflow-wrap: anywhere; }
.routing { display: flex; gap: 1.5rem; flex-wrap: wrap; color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
.routing b { color: var(--text-color); }
.routing b.diff { color: var(--warning-color); }
.mini-scroll { overflow-x: auto; background: var(--text-box); border-radius: 0.5rem; }
.mini { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: transparent; }
.mini th { background: transparent; cursor: default; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.7rem; padding: 0.5rem 0.75rem; }
.mini td { padding: 0.5rem 0.75rem; vertical-align: top; overflow-wrap: anywhere; }
.mini td:first-child { white-space: nowrap; }
.chip { display: inline-block; padding: 0.05rem 0.55rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; white-space: nowrap; border: 1px solid currentColor; }
.chip.relevant, .chip.supported { color: var(--success-color); }
.chip.wrong, .chip.unsupported { color: var(--danger-color); }
.chip.irrelevant, .chip.not_applicable { color: var(--warning-color); }
.tag { display: inline-block; margin-left: 0.4rem; padding: 0 0.45rem; border-radius: 0.3rem; font-size: 0.7rem; color: var(--muted); border: 1px solid var(--border-color); font-family: var(--font-text); white-space: nowrap; }
.ids { color: var(--text-color); }
.ids span { color: var(--muted); }
.kp-line { margin: 0 0 0.9rem; overflow-wrap: anywhere; }
.kp-line .kid { font-weight: 700; margin-right: 0.5rem; }
.alts { color: var(--accent-color); }
details > summary { cursor: pointer; color: var(--accent-color); font-size: 0.8rem; margin-top: 0.25rem; }
details.ref-item { background: var(--text-box); border-radius: 0.5rem; padding: 0.6rem 1rem; margin-bottom: 0.5rem; }
details.ref-item > summary { margin: 0; color: var(--text-color); font-size: 0.9rem; }
details.ref-item .detail-text { margin-top: 0.75rem; background: var(--details-bg); max-height: 22rem; overflow: auto; }
.mark { font-weight: 700; margin-right: 0.4rem; }
.mark.ok { color: var(--success-color); } .mark.missing { color: var(--danger-color); }
.meta { display: block; color: var(--muted); font-size: 0.8rem; font-family: var(--font-text); }
.empty { padding: 3rem 1rem; text-align: center; color: var(--muted); background: var(--secondary-color); border: 2px dashed var(--border-color); border-radius: 1rem; }
.empty code { font-family: var(--font-mono); background: var(--text-box); padding: 0.1rem 0.4rem; border-radius: 0.3rem; }

/* metric guide: right-hand drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100vw); background: var(--secondary-color); border-left: 1px solid var(--border-color); box-shadow: var(--shadow); z-index: 50;
  transform: translateX(104%); transition: transform .22s ease; display: flex; flex-direction: column; visibility: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.open { transform: none; visibility: visible; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-color); }
.drawer-head h2 { margin: 0; font-size: 1.1rem; }
.x { border: 1px solid var(--border-color); background: transparent; border-radius: 0.5rem; width: 2rem; height: 2rem; cursor: pointer; font-size: 1rem; line-height: 1; }
.x:hover { border-color: var(--primary-color); }
.pages { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border-color); }
.pagebtn { background: transparent; border: 1px solid var(--border-color); border-radius: 999px; padding: 0.15rem 0.7rem; font-size: 0.8rem; cursor: pointer; }
.pagebtn[aria-current="true"] { background: var(--primary-color); border-color: var(--primary-color); color: var(--on-primary); font-weight: 600; }
.drawer-body { padding: 1.25rem; overflow-y: auto; flex: 1; min-height: 0; }
.drawer-body h3 { margin: 0 0 0.25rem; font-size: 1.15rem; }
.drawer-body .what { margin: 0 0 1rem; color: var(--muted); }
.drawer-body h5 { margin: 1.25rem 0 0.4rem; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.drawer-body p { margin: 0 0 0.5rem; }
.formula { font-family: var(--font-mono); font-size: 0.85rem; background: var(--text-box); border-radius: 0.5rem; padding: 0.6rem 0.8rem; overflow-x: auto; white-space: pre; }
.ex { background: var(--text-box); border-radius: 0.5rem; padding: 0.75rem 1rem; font-size: 0.85rem; }
.ex .exh { font-weight: 600; margin-bottom: 0.4rem; }
.ex ul { margin: 0.4rem 0; padding-left: 1.2rem; }
.ex li { margin: 0.15rem 0; }
.calc { font-family: var(--font-mono); margin-top: 0.4rem; }
.trap { border-left: 3px solid var(--warning-color); padding: 0.1rem 0 0.1rem 0.75rem; }
.note { color: var(--muted); }

@media (max-width: 640px) { h1 { font-size: 1.8rem; } th, td { padding: 0.7rem; } .details-content { padding: 1rem; } }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
</style>

_of": "2026-11-11（現場）", "url": "https://aca.nccu.edu.tw/download/course/選課須知11407.pdf"}], "keypoints": ["K6", "K7"], "found": true}, {"text": "第四學年每學期不得少於十學分", "sources": [{"kind": "snapshot", "as_of": "2026-08（output/ 快照）", "url": "https://aca.nccu.edu.tw/download/rulesdata/law01A.pdf"}, {"kind": "live", "as_of": "2026-11-11（現場）", "url": "https://aca.nccu.edu.tw/download/rulesdata/law01A.pdf"}], "keypoints": ["K7"], "found": true}]}, "prediction": {"content": "學士班學生每學期的選課學分上限是 25 學分，具雙主修身分者可以提高到 31 學分。", "references": [{"index": 1, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 825 字，標題: aca_faq_course_selection.txt，subdomain: aca", "chars": 1003, "text": "get_page 取得 825 字，標題: aca_faq_course_selection.txt，subdomain: aca\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://aca.nccu.edu.tw/zh/常用連結/教務處qa/選課業務]\n一、每學期非歸責學生事由選課處理結束後，出納組將公告學分費繳費注意事項，請自行列印繳費單並於期限內完成學分費繳交事宜。\n\n二、學分費未依期限繳費，該科目即以零分計算。學生於當學期休學截止日前經專案申請核准補繳者，除應繳納原規定各項費用外並加收滯納金。滯納金依逾期天數計算，每逾二日按原應繳費用總額百分之一收取，以收取應繳費用總額百分之十五為上限且不逾新臺幣二千元。」。\n\n※如有任何疑問，請洽註冊組分機：63279或出納組分機62119。\n\n一、本校學士班學生每學期上限為25學分，大一至大三下限為12學分，\n\n      大四為10學分；至於延畢生則僅規定至少應修一門課程。\n\n二、學士班學生若因特殊需要得申請超修至多6學分，亦得減修學分至多6學分。\n\n三、碩、博士班學生學分數則從各所修業規定。\n\n※如有任何疑問，請洽註冊組分機：63279。\n\n一、棄修是指學生本學期放棄課程之修習。\n\n二、本校棄修期間為行事曆訂期中考試結束後二週內。\n\n三、學校棄修的原則：每學期每生以一科為限，且放棄修習後，學分數不得低於規\n\n　　定之最低下限。\n\n四、棄修課程若需繳納學分費，則應繳交後，方得棄修，且不退費。\n\n五、延畢生與研究生棄修後，沒有最低學分限制。\n\n※如有任何疑問，請洽註冊組分機：63279。\n\n一、學校選課分為初選、加退選、加簽暨退課三個階段。\n\n \n\n二、初選與加退選於網路選課系統作業；加簽暨退課則應於選課系統列印表單後送請任課老師同意、分別送開課單位辦理加簽；教務處辦理退課。\n\n \n\n三、學生於三階段選課作業結束後一週內，如有非歸責於學生事由須辦理加退課程者，應附相關證明文件及學生選課報告說明，經任課教師及開課單位同意，送請學生所屬系所簽辦，經教務長同意後辦理。\n\n請同學要依照學校公告的日程進行選課。\n\n※如有任何疑問，請洽註冊組(可洽所有同仁)，分機63279\n\n116011台北市文山區指南路二段64號 行政大樓四樓 聯絡我們", "counted": true}, {"index": 2, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 13161 字，標題: aca_law01A.txt，subdomain: aca", "chars": 13338, "text": "get_page 取得 13161 字，標題: aca_law01A.txt，subdomain: aca\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://aca.nccu.edu.tw/download/rulesdata/law01A.pdf]\n國 立 政 治 大 學 學 則\n民國111年1月14日第217次校務會議修正通過第3、5、\n10、11、13、16、19、37、40條之1、42、46、50、\n53、54、56及56條之1條文、新增第42條之1及第46條\n之1\n民國111年3月23日臺教高(二)字第1110016497號函核\n備第3、5、10、11、13、16、19、37、40條之1、42、\n46、50、53、54、56及56條之1條文、新增第42條之1\n及第46條之1條文\n民國111年4月13日政教字第1110010345號函發布\n民國113年1月12日第227次校務會議修正通過第3、\n10、14、15、22、25、34、37、38、42、43、46、\n50、51、53及第55條文、新增第2條之1\n民國113年2月27日臺教高(二)字第1130017848號函核\n備第3、10、14、15、22、25、34、37、38、42、43、\n46、50、51及第53條文、新增第2條之1\n民國113年3月11日政教字第1130006909號函發布\n民國113年11月11日第231次校務會議修正通過第3、\n4、5、17、23、28、第六章、46-1、53、58條及新增\n第37-1、38-1、第38-2及第46-2條、刪除第40-1條\n民國114年1月10日臺教高(二)字第1130136409號函核\n備第3、4、5、17、23、28、第6章、第37條之1、第46\n條之1、第46條之2、第53、58條文、新增第38條之1、\n第38條之2\n民國114年2月14日政教字第1140001282號函發布\n（完整修訂歷程，移列文末）\n第一章 總則\n第一條 本學則依大學法及其施行細則，並斟酌本校實際需要訂定之。\n第二條 本校學生入學、休學、保留學籍、保留入學資格、退學、轉學、轉系\n(組)、轉學程、開除學籍、修讀本校或他校輔系、雙主修、學程、跨\n校選修課程、成績考核、學分抵免與暑期修課、服兵役與出國有關學\n籍處理、修業期限、及所授學位等事宜，悉依本學則辦理。\n依大學法第十一條設置之學位學程，應依設立班別準用本學則之規定。\n本校學生突遭經教育主管機關認定之重大災害影響其學習權益者，其\n第一項相關規定依本校協助突遭重大災害學生學習修業作業原則辦理。\n第二條之一 民國九十四年次以後出生，自民國一百十三年起回復徵集服常備\n兵現役之學士班就學役男彈性修業措施，由本校另訂學士班學生就學\n期間服役彈性修業處理準則辦理，並報教育部備查。\n第二章 入學、保留入學資格\n1\n\n| 第三條 凡曾在公立或已立案之私立高級中學或同等學校畢業，或具有法令規 |\n| --- |\n| 定得以同等學力報考資格，經大學分發入學、大學繁星推薦入學、大 |\n| 學申請入學、四技二專甄選入學、四技二專特殊選才、運動成績優良 |\n| 學生升學輔導甄審或甄試、運動績優學生單獨招生入學、學士班特殊 |\n\n第四條 凡曾在公立或已立案之私立大學或獨立學院，或教育部認可之國外大\n學畢業得有學士學位，或具有法令規定得以同等學力報考資格，經本\n校碩士班入學考試或甄試入學、碩士原住民專班、碩士在職專班、現\n役軍人營區碩士在職專班及國際金融碩士學位學程錄取者，得入本校\n修讀碩士學位。\n前項入學方式，依本校博、碩士班招生、碩士原住民專班、碩士在職\n專班、現役軍人營區碩士在職專班及國際金融學院招生規定辦理。\n第五條 凡曾在公立或已立案之私立大學或獨立學院，或教育部認可之國外大\n學畢業得有碩士學位，或具有法令規定得以同等學力報考資格，經本\n校博士班入學考試或甄試入學錄取者，得入本校修讀博士學位。\n前項入學方式，依本校博、碩士班招生規定辦理。\n本校及台灣聯合大學系統學校修讀學士班學位之應屆畢業生及碩士班\n學生肄業一年以上，成績優異者，得申請逕行修讀博士學位，相關作\n業規定依教育部法規、台灣聯合大學系統學生逕讀博士學位作業要點\n及本校學生逕行修讀博士學位作業規定辦理。\n第五條之一 經本校於每學年第一學期博士班甄試、碩士班甄試及碩士在職專\n班招生考試入學錄取者，符合當學年度招生簡章所訂資格，得申請提\n前一學期入學註冊。\n第六條 本校得接受具有規定入學資格之外國學生申請入學，入學方式依本校\n外國學生入學招生規定辦理。\n經本校外國學生甄試入學錄取者，符合當學年度招生簡章所定資格，\n得申請提前一學期註冊入學。\n第六條之一 海外僑生入學，得依教育部僑生回國就學及輔導辦法及本校招收\n僑生及港澳生來臺就學單獨招生規定辦理。\n第六條之二 香港澳門地區學生入學，得依教育部香港澳門居民來臺就學辦法\n及本校招收僑生及港澳生來臺就學單獨招生規定辦理。\n第六條之三 大陸地區學生入學，得依教育部大陸地區人民來臺就讀專科以上\n學校辦法辦理。\n第七條 本校各院系所學程得與國外大學簽定學術合作合約，授予各級學位或\n雙學位，其辦法另定之。\n第八條 (刪除)\n第九條 (刪除)\n第十條 新生因下列情形之一，不能依規定完成入學手續者，應於註冊截止日\n前，附相關證明文件，書面申請保留入學資格，毋須繳納任何費用：\n一、重大疾病須長期療養者，以一年為限。\n2\n\n| 選才招生、國防學士班招生入學及符合教育部規定之特種身分學生錄 |  |\n| --- | --- |\n| 取者，得入本校修讀學士學位。 |  |\n|  | 凡符合入學大學同等學力認定標準相關規定，並參加本校轉學生考 |\n|  | 試錄取者，得編入本校學士班相當院系年級肄業，修讀學士學位。 |\n\n二、應徵召服兵役者，依法定役期保留。\n三、本人、配偶或伴侶懷孕、曾懷孕或分娩者，以一年為限。\n四、因特殊事故不能按時入學者，以一年為限。\n五、本人、配偶或伴侶撫育三歲以下子女者，至子女滿三足歲為限。\n六、學士班新生參加青年教育與就業儲蓄帳戶方案者，以三年為限。\n前項各款保留入學資格以學年為單位申請，並以核准一次為限。保\n留期滿即應依第十三條規定辦理復學，違者註銷學籍。\n第一項第三款所稱曾懷孕係指於入學當年度曾有流產或出養之情事。\n第十一條 學生於入學時有下列情形之一者，一經查明，尚未繳費註冊者，取\n消入學資格並刪除學籍資料；已繳費註冊者，即開除學籍；畢業後\n經調查屬實者，應予撤銷學位，並追繳其已發之學位證書：\n一、矇混舞弊。\n二、所繳入學證件有假借、冒用、偽造或變造。\n三、入學資格不符規定。\n第十二條 在校生或畢業校友未經申請手續，不得更改個人基本資料。\n申請更改應檢具身分證明文件，報請教務處辦理。入學資格證件所\n載與身分證明文件所載不符者，應即更正。\n第三章 繳費、註冊、選課\n第十三條 學生應於每學期規定期限內繳納各種費用並完成註冊通知單規定之\n各項手續。延誤註冊逾二週仍未完成繳費註冊、休學或保留學籍者，\n當學年度入學新生即令註銷學籍；其他學生未逾第四十一條所定休\n學年限者即令休學；逾休學年限者，即令退學。但有特殊事由經書\n面向教務處專案申請核准者，不在此限。\n第十四條 學生選修本校課程，依本校學生選課辦法及選課公告辦理。\n學生選修國內其他大學校院課程，依本校國內校際選課辦法辦理。\n學生出國選修課程，依本校學生出國選修課程實施辦法辦理。\n學生註冊但未於選課作業結束前完成選課，未逾第四十一條所定休\n學年限者即令休學，其餘則依第四十六條規定退學。\n第一項至第四項應於規定期限內辦理，逾期不予受理。\n第十五條 學士班學生第一至第三學年每學期修習學分，不得少於十二學分，\n不得多於二十五學分，第四學年每學期不得少於十學分，不得多於\n二十五學分，違者所修科目之學分及成績均不計。學生若因情況特\n殊，經系主任核可者，得於當學期超修或減修學分。超減修至多以\n六學分為限。碩、博士班學生每學期修習學分由各系(所)自定。\n學生選課應按年循序就該系(所)規定必修科目表修習並依科目表採\n計畢業學分，科目內容有先後修習次序者，除經各該系(所)核准外，\n不得顛倒修習，違者該科目學分及成績均不計。\n必修科目表所列單學期科目，學生如修習全學年上、下學期課程，\n3\n\n經學系同意得分開認列為必、選修畢業學分，其上學期科目學分若\n逾必修科目表規定學分上限，多出之學分不得採計。\n必修科目表之科目學分採計，各系(所)如有特殊規定，應明定於相\n關修業辦法或必修科目表特殊事項。\n碩、博士班學生經該系(所)核可，得分別修讀博、碩士班之科目，\n其修習科目學分及成績由該系所認定。\n學士班三、四年級學生經開課系(所)核可，得修習碩士班或碩、博\n士班合開之科目。\n學士班學生經申請認定符合本校運動成績績優學生認定標準者，每\n學期得減修學分，但至少應修習三學分。\n第十六條 同一上課時間不得修習二科以上之科目，違者移除時間衝堂科目。\n修習科目有以下情形之一者，為重複修習：\n一、歷年重複修習：前已修習及格科目，再次修習相同名稱科目\n或經系所專案認定科目名稱不同但內容相同之科目。\n二、當學期重複修習：同一學期修習相同名稱科目或名稱不同但經\n系所專案認定內容相同之科目。\n重複修習科目未經系所主管核准，移除該科目。因轉系，或修讀輔\n系、雙主修、學分學程或其他特殊事由確需重複修習者或同一學期\n重複修習科目，申請恢復一門科目者，經系所主管核准，不在此限。\n修習已及格且重複修習之科目，經系(所)主管核准同意修習者，該\n科目不納入學生所屬系(所)學業成績及畢業學分計算為原則。\n第十七條 全學年科目，上學期未修習或成績不及格者，下學期不得修習，違\n者移除該科目。但經授課教師及開課單位主管核准者，不在此限，\n修畢且及格之下學期科目，其學分及成績予以採計。\n全學年科目上學期已修習及格，下學期因故未續修者，其上學期學\n分照計。\n第十八條 (刪除)\n第十九條 碩、博士班學生修讀碩、博士班或學士班科目者、學士班學生修習\n須繳費科目者，應依各開課單位於本校各級學雜費收費基準表中所\n列標準繳交學分費。\n各項費用逾期未繳納者，該科成績以零分計算。學生於當學期休學\n截止日前經專案申請核准補繳者，除應繳納原規定各項費用外並加\n收滯納金。滯納金依逾期天數計算，每逾二日按原應繳費用總額百\n分之一收取，以收取應繳費用總額百分之十五為上限且不逾新臺幣\n二千元。\n4\n\n|  | 延畢之學士班學生補修或重修之課程應依各開課單位於本校各級學 |\n| --- | --- |\n|  | 雜費收費基準表中所列標準繳交學雜費。 |\n| 學士班學生重複修習已及格科目第三次以上者，須加收學分費。 |  |\n|  | 全校學生應依規定繳交電腦及網路通訊使用費。使用外文中心之語 |\n|  | 言視聽設備之學生，應依規定繳交語言設備使用費。 |\n\n第十九條之一 (刪除)\n第四章 科目學分成績\n第二十條 學士班學生畢業應修學分數，不得少於一二八學分。但因教育政策\n或教學研究之需求，報經教育部專案核准者，不在此限。\n相當於國內高級中等學校二年級之國外或香港澳門地區同級同類學\n校畢業學士班學生以同等學力入學後，應在規定之修業期限內增加\n應修之畢業學分數十二學分。\n碩士班學生應修學分數，不得少於二十四學分；博士班學生應修學\n分數，不得少於十八學分。學士班應屆畢業生逕行修讀博士學位者，\n含博士班應修學分在內，應修學分數不得少於三十六學分；碩士班\n學生逕行修讀博士學位者，含博士班應修學分在內，不得少於三十\n學分。\n第二十一條 學士班之畢業學分，包括共同必修、專業必修與選修；共同必修\n包括通識課程、體育課程。\n學生修習專業必修科目不及格者，應令重修。\n第二十二條 學生入學後提高編級及抵免學分，依本校學生抵免學分辦法辦\n理。\n第二十三條 各科目學分之計算，一學分以授課十八小時為原則；科目另設實\n習課者，得不計學分；計學分之實習或實驗科目，每學分應授課\n三十六至五十四小時；上述各科目得於十六週內完成。\n第二十四條 本校學生學業成績考查方式如下：\n一、平時成績：由授課教師隨時考查之。\n二、期中考試：於每學期期中在規定時間內舉行之。\n三、期末考試：於每學期期末在規定時間內舉行之。\n期中、期末考試，依本校期中、期末隨堂考試辦法辦理。\n第二十五條 本校專、兼任教師於開課學期期末考試結束後，應依期限繳交全\n部修業學生成績至教務處註冊組登錄。\n學生第一學期成績，應於行事曆所訂寒假開始日起二週內繳交；\n第二學期成績，應於行事曆所訂暑假開始日起三週內繳交。成績\n繳交截止日如遇假日或學校共同調整放假日，順延至次一工作日。\n學士班應屆畢業生第二學期學期成績及各期暑修課程成績，應於\n前項學期成績繳交起始日起及當期暑修結束後一週內繳交。\n教師逾期限未能繳交全部成績，由教務處通知授課教師，並副知\n開課學系(所、學程)主任協助催繳，逾規定期限一週仍未補交成\n績者，上網公告教師名單。\n學士班學生成績於次學期開始上課日期起一週內教師仍未補交成\n績者，該科即以零分登錄，並即進行排名作業。\n教師未依限完成碩、博士學生成績繳交者應依本校成績作業要點\n處理成績未完成相關事宜。\n5\n\n第二十六條 學生學業成績採用百分計分法，以一百分為滿分。各學系學士班\n學生以六十分為及格，碩、博士班學生以七十分為及格，不及格\n者不給學分。性質特殊之科目，經院系課程委員會及教務會議通\n過後，得採通過、不通過之考評方式。\n碩、博士班學生學位考試以七十分為及格。\n碩、博士班學生修讀學士班科目，以六十分為及格。但該科目學\n分成績不列入學期及畢業成績計算。\n本校自一百零六學年度起實施中、英文成績單成績呈現分流制度，\n中文成績單以百分制表示成績，英文成績單成績轉為等第制，相\n關作業依本校學生成績作業要點辦理。\n學生操行成績依本校操行成績實施要點辦理。\n第二十七條 學士班學生參加暑期班修讀，依本校暑期開班授課規定要點辦理。\n暑期班修讀科目及成績記載，依本校暑期開班授課相關規定辦理。\n第二十八條 學生各項成績經評定送教務處後，不得撤回。未涉及學生是否退\n學之成績更正，因登記或核算錯誤更正時，由授課教師提出成績\n評定書面證明，填妥成績更正申請書，經開課單位主管同意，由\n註冊組更正登錄。非屬前列成績更正事由者，除依前列程序申請\n外，另須經教務長核定後始得更正。\n成績之更正，涉及學生是否退學者，應經開課單位會議討論通過，\n並提行政會議審議同意始得更正。\n學士班學生成績更正案於次學期開始上課日期起一週內完成更正\n程序者，始得納入當學期排名作業，成績更正程序如已超過學士\n班排名作業時間，本校不再進行當學期成績排名，以免損及其他\n學生權益。\n學生成績更正案至遲應於修課次學期休學截止日前完成更正程序。\n第二十九條 學生學業平均成績之計算方法如下：\n一、以科目之學分乘該科目所得之成績分數為積分。\n二、學生學期所修各科目學分之總和，扣除以通過、不通過考評\n方式、暑期班修讀之科目學分，為學分總數。學生學期修習\n學分總數除成績積分總和，為學期學業平均成績。\n三、各學期(含暑期班)修習學分數總和除成績積分總和，為學業\n平均成績。\n學士班畢業生之學業平均成績，為其畢業成績。\n碩、博士班畢業生之學業平均成績與學位考試成績之平均，為其\n畢業成績。\n前列各項成績，如有小數，均計算至第二位止，第三位以下四捨\n五入。\n第三十條 (刪除)\n第三十一條 (刪除)\n6\n\n第三十二條 (刪除)\n第三十三條 (刪除)\n第三十四條 學士班應屆畢業生缺修學分，須於延長修業期限之第二學期重修\n或補修者，第一學期得免予註冊，辦理休學。註冊者，至少應選\n修一個科目。\n第五章 請假、缺席\n第三十五條 學生因故不能上課者，應依本校請假規則辦理；凡未經請假或請\n假未准而缺席者，為曠課。\n學生因病或特殊事故不能參加期中、期末隨堂考試時，其准假\n及補考事宜，均由各該科目之授課教師權宜辦理。\n未經請假或請假未准而缺考者，為曠考。\n因公請假者，不作缺席計。\n曠課或曠考之科目，其成績由授課教師權宜核給。\n第三十六條 (刪除)\n第六章 轉系、輔系、雙主修、校學士、學分(教育)學程\n第三十七條 學士班學生自一年級下學期起得申請轉系，並以核准一次為限。\n降級轉系者，其應修學分數及必修科目，應依轉入年級學生入學\n學年度必修科目表規定辦理；其在原系重複修習之年級，不列入\n轉入學系之修業期限計算。\n。\n第三十七條之一 碩士班學生於修業第二學年開始前，得經原肄業所及擬轉入\n所雙方主管同意後，申請轉所，並以一次為限。\n各所錄取轉所之名額，以其當學年度經核定之招生名額一成為原\n則。\n碩士班辦理轉所之規定，由各所自訂並明列於修業規定中。\n轉所經核准後，學生應依轉所後註冊當學年度之必修科目表修習，\n並不得再申請更改或轉回原所。\n第三十八條 學士班學生，自二年級起得修讀本校或他校其他學系為雙主修、\n輔系，延後畢業學生不得提出申請。\n修讀雙主修以一學系為限，輔系以二學系為限。\n7\n\n| 依入學招生簡章規定入學後不得轉系者，從其規定不可申請轉系 |  |\n| --- | --- |\n|  | 依台灣聯合大學系統學生轉校規定核准轉入本校就讀者，不得申 |\n|  | 請轉系。 |\n|  | 本校學士班學生轉系規範依本校學士班轉系規則辦理。 |\n\n| 依台灣聯合大學系統學生轉校規定核准轉入本校就讀者，不得再 |\n| --- |\n| 申請轉所。 |\n\n學生修讀雙主修、輔系規範依本校學士班學生修讀雙主修、輔系\n辦法辦理。\n第三十八條之一 碩、博士班學生修讀雙主修、輔系之規範，依本校碩博士班\n學生修讀雙主修、輔系辦法辦理。\n第三十八條之二 學士班學生修讀校學士之規範，依本校校學士設置準則辦理。\n第三十九條 (刪除)\n第 四十 條 本校學生得依本校學分學程設置辦法修習學分學程，其辦法另定\n之。\n學士班學生二年級以上及碩、博士班學生申請修習師資培育中心\n課程，依本校教育學院師資培育中心學生甄選暨課程修習辦法辦\n理，其辦法另定之，並報教育部核定。\n第四十條之一 (刪除)\n第七章 休學、保留學籍、退學、復學、轉學\n第四十一條 學生因特殊事故得申請休學、延長休學或退學；申請當學期休學\n者，須於期末考試以前辦理，逾期不予受理。\n學生申請休學，得由學校一次核准一學期至二學年。休學累計以\n二學年為原則，期滿因重病或特殊事故需再申請延長休學一學期\n或一學年者，得專案報請校長核准，申請延長休學以一次為原則。\n請准休學學生，其休學期間之修課紀錄予以刪除。\n第四十二條 學生在學期間，有下列情形者，應附相關證明文件於休學截止日\n前，申請保留學籍：\n一、應徵召服兵役者，依法定役期保留。\n二、本人、配偶或伴侶懷孕、曾懷孕或分娩者，以一年為限。\n三、本人、配偶或伴侶撫育三歲以下子女者，至子女滿三足歲為\n限。\n學生因第一項補辦休學學期回溯保留學籍之申請，限於申請時仍\n具本校在籍身分，學生已畢業、退學或學籍註銷不得申請。\n請准保留學籍學生，其保留學籍期間之修課紀錄予以刪除。\n第四十二條之一 新生及轉學生入學第一學期於本校行事曆所訂繳費註冊截止\n日前辦理休學或保留學籍者，免繳註冊相關費用；繳費註冊截止\n日後申請休學或保留學籍者，須繳費後始得辦理。\n第四十三條 學生休學或保留學籍期滿即應復學，如於尚未期滿前提早復學，\n應於復學之當學期加退選結束前辦理完成復學程序，並依規定期\n限辦妥註冊相關事宜。復學時仍應在原肄業系(所)相銜接之學年\n或學期肄業；學期中途休學或保留學籍者，復學時應入原肄業之\n年級或學期肄業。\n第四十四條 (刪除)\n第四十五條 (刪除)\n8\n\n第四十六條 學生有下列情形之一者，應予退學或勒令退學：\n一、逾期未註冊且已逾休學年限者。\n二、修業期限屆滿，經依規定延長期限仍未修足所屬系(所)規定\n應修科目與學分者。\n三、碩、博士班學生在修業期限內未依所屬院、系、所規定完成\n碩、博士學位候選人資格考核者。\n四、碩、博士班學生學位考試在修業期限內未依所屬院、系、所\n規定通過者。\n五、註冊未選課且已逾休學年限者。但碩博班學生已修畢應修課\n程者，不在此限。\n六、依本學則其他有關規定應令退學者。\n七、依本校學生獎懲辦法勒令退學者。\n八、依本校研究生學位考試要點規定應令退學者。\n九、本校畢業生在學期間，修業情形有不實或舞弊情事，經所屬\n系所調查屬實，情節重大撤銷學位者。\n十、依入學辦法或簡章規定應令退學者。\n十一、無前列各款事由而自動申請退學者。\n學生於退學當學期休學截止日前退學者，該學期修課紀錄予以刪\n除。\n第四十六條之一 學生於本校同一學制相同學系所或同一學籍分組，同時具有\n二個以上在籍學籍時，應擇一學籍就讀並主動辦理其他學籍退學。\n如未辦理經發現者，將依以下原則，保留學生一個學籍，其他學\n籍予以退學:\n一、保留學生當學期繳費註冊在學學籍。\n二、學生當學期二個以上繳費註冊在學學籍或在籍學籍均未繳費\n註冊在學時，保留較早入學學籍。\n經前項規定退學之學生，退學學籍之入學年度早於在學學籍者，\n該退學學籍如有本校修習課程紀錄且未辦理抵免，得依本校抵免\n學分辦法專案申請抵免。\n第四十六條之二 學生有下列情形之一者，應開除學籍：\n一、有本校學則第十一條之情事者。\n二、經本校學生獎懲委員會議決開除學籍者。\n第四十七條 依規定應予退學或開除學籍學生，依本校學生申訴處理辦法提出\n申訴者，申訴結果未確定前，不因申訴之提起，而停止原處分之\n執行。但提出申訴的學生得向本校提出繼續在校肄業之書面申請。\n學生申訴處理辦法另定之。\n前項受處分學生經校內申訴未獲救濟者，得依法提起訴願及行政\n訴訟；原處分經上級主管機關決定或行政法院判決顯係違法或不\n當時，應另為處分。\n9\n\n依前項規定經本校另為處分得復學之學生，因特殊事故無法及時\n復學時，各系(所)及教務處應輔導復學；其復學前之離校期間，\n並得補辦休學。\n第四十八條 經本校學生獎懲委員會議決勒令退學或開除學籍之學生，不得再\n行入學。\n前項學生已畢業者，撤銷其學位。\n第四十九條 學生得向學校申請核發各項證明文件，但有下列情形之一者，不\n得發給與修業有關之任何證明文件：\n一、入學資格，經審核不合者。\n二、開除學籍者。\n學生申請各項證明文件，應依學生請領證件規則辦理，其辦法另\n定之。\n第八章 修業期限、畢業學位\n第 五十 條 學士班採學年學分制，其修業期限以四年為原則，修業期限不含\n休學及保留學籍學期。但得視學系性質延長一至二學年，並得視\n學系實際需要，另增加實習一學期至二學年。\n學生因成績優異，於規定修業期限屆滿前一學期或一學年修滿該\n學系應修學分者，得准提前畢業。各學系學士班學生未於規定修\n業期限修滿應修學分者，得延長一學期至二學年畢業；因加修雙\n主修而未能於延長修業期限內修畢學分者，得再延長一學期或一\n學年。\n第十五條第七項運動成績績優學生及領有身心障礙證明或領有教\n育部或直轄市政府特殊教育學生鑑定及就學輔導會核發之高級中\n等以上教育階段之有效鑑定證明者，未能於第一項修業期限修畢\n應修學分者，得延長修業期限，至多以四學年為限；因加修雙主\n修，修業期限得再延長一學期或一學年。\n學生本人、配偶或伴侶在籍期間曾懷孕、撫育三歲以下幼兒，未\n能於延長修業期限內修畢應修學分者，得提出相關證明文件，申\n請延長修業期限，至多延長二學年為限。\n本條第三項及第四項延長修業期限不得累計計算。\n第五十一條 前條第二項成績優異者，應合於下列規定，並於預定畢業當學期，\n向就讀學系提出申請，並經系務會議審核通過，送教務處辦理：\n一、 學業成績(不含提前畢業當學期)加權總平均在八十分以上\n或排名名次在該系該年級學生數前百分之二十以內。\n二、各學期無懲處紀錄，或操行成績均達八十分或A以上。\n學生依前項申請提前畢業核准者，畢業當學期學業成績平均分\n數，應達八十分以上，且應符合前項第二款之標準。\n各學系得就前二項學業成績相關規定訂定更嚴格之標準。\n10\n\n第五十二條 學士班學生於規定修業期限屆滿前一學期或一學年，修滿該學系\n規定應修學分，而不合前條規定者，仍應註冊入學，其應修學分\n數，依第十五條規定辦理。\n第五十三條 碩、博士班學生在校修業期限，碩士班以一至四年為限；博士班\n以二至七年為限，修業期限不含休學及保留學籍學期。\n逕行修讀博士學位學生，自轉入博士班起，其修業期限比照前項\n博士班規定辦理；其奉核定再回碩士班就讀者，其在博士班修業\n時間，不併入碩士班最高修業期限核計。\n碩士在職專班之修業期限以一至四年為限，修業期限不含休學及\n保留學籍學期，但未在規定之修業期限內修滿應修課程或未完成\n學位論文者，得延長一學年畢業。\n碩博士班學生修讀雙主修，如已完成本系所最低應修學分數、符\n合畢業條件並通過學位考試，而未完成雙主修學系所畢業規定，\n經本系所務或學程事務會議通過及教務長同意後，修讀碩士班雙\n主修得延長修業期限一年；博士班雙主修得延長修業期限二年。\n碩博士班學生修讀輔系應在原修業期限下完成，不得延長修業期\n限。\n碩博士班學生經學校推薦修讀雙聯學位者得延長修業期限一年。\n領有身心障礙證明或領有教育部或直轄市政府特殊教育學生鑑定\n及就學輔導會核發之高級中等以上教育階段之有效鑑定證明者或\n學生本人、配偶或伴侶在籍期間曾懷孕、撫育三歲以下幼兒，未\n能於第一項至第四項各項修業期限內修畢應修學分及完成學位論\n文者，得再申請延長修業期限，至多以二學年為限。\n前項各類延長修業期限不得累計計算。\n第五十四條 學士班學生修業期滿，修滿規定科目及學分成績及格並符合學系\n畢業條件者，准予畢業。\n合於前項畢業資格學生辦妥離校程序單應辦事項後，由本校發給\n學士學位證書。\n前項離校程序單所列事項須與維持學術品質、健全學生人格發展\n相關，始得為應辦事項。\n第五十五條 碩士班學生完成碩士學位應修課程，提出論文，始得申請學位考\n試；提出論文前，應否先行通過資格考核，由各系(所)自定。\n博士班學生完成博士學位應修課程，通過博士學位候選人資格考\n核後，提出論文，始得申請學位考試。\n前二項資格考核之內容及方式，由各系（所）自行規定並辦理。\n碩、博士班學生學位考試，依本校研究生學位考試要點辦理，其\n辦法另定之，並報教育部備查，修正時亦同。\n第五十六條 碩、博士班學生修業期滿，修滿規定科目及學分，並符合本校研\n究生學位考試要點之各項規定者，准予畢業。\n11\n\n合於前項畢業資格之碩、博士班學生辦妥離校程序單應辦事項後，\n由本校分別發給碩、博士學位證書。\n逕行修讀博士學位學生修業期滿，通過博士學位候選人資格考核，\n但未通過博士學位考試，其博士學位論文經博士學位考試委員會\n決定，合於碩士學位標準者，得授予碩士學位。\n第二項離校程序單所列事項須與維持學術品質、健全學生人格發\n展相關，始得為應辦事項。\n第五十六條之ㄧ 碩、博士班學生已授予學位者，其論文、作品、成就證明、\n書面報告、技術報告或專業實務報告有造假、變造、抄襲、由他\n人代寫或舞弊情事，撤銷其學位並註記退學。\n第九章 附 則\n第五十七條 本校學生擔任各類獎助生之權益保障、申訴及救濟管道及處理程\n序，係依本校獎助生與學生勞動型兼任助理權益保障處理辦法處\n理之。\n第五十八條 本學則未盡事宜，依大學法及其施行細則、學位授予法及教育部\n公布之相關規定辦理。\n第五十九條 本學則經校務會議通過後發布施行，並報請教育部備查，修正時\n亦同。\n【完整修正歷程】\n民國56年2月17日本校第23 次行政會議審議通過\n民國56年7月19日本校第344次行政會議修正通過\n教育部58年4月18日臺(57)高字第7396 號令核定\n教育部66年1月10日臺(66)高字第0277 號函核備\n民國69年6月27日本校第50 次校務會議修正通過\n教育部69年12月3日臺(69)高字第39383 號函核備\n民國80年6月29日本校第72 次校務會議通過\n教育部80年8月8日臺(80)高字第41777 號函核備\n教育部80年9月18日臺(80)高字第49708 號函 _course_notice_11407.txt，subdomain: aca\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://aca.nccu.edu.tw/download/course/選課須知11407.pdf]\n國 立 政 治 大 學 學 生 選 課 須 知\n114.07更新\n一、【課程資訊查詢】\n『全校課程查詢』置於政大網站首頁(https://www.nccu.edu.tw)/相關連結之下，該系統透\n過輸入關鍵字或使用進階檢索方式可查詢各課程之科目代碼、科目名稱、教師姓名、學分數、\n上課時間、開課單位、異動資訊等欄位，並可點選「更多」功能鍵進一步查閱上課教室、授課\n語言、教學大綱、選課方式、選課設定、是否收費等資訊。其中選課設定包含開課單位針對\n課程設定的各項選課條件；教學大綱連結課程基本資料、授課內容、課程進行方式及評量標\n準；於選課系統中點選任課教師則可查詢近六學期課程教學意見調查結果，提供學生作為選\n課的參考(此功能必須先登入選課系統並於開放時間查詢)。同學亦可使用「追蹤」功能將有\n興趣的課程加入追蹤清單，作為選課登記的參考。\n二、【選課】\n『選課系統』置於政大網站首頁(https://www.nccu.edu.tw)/相關連結之下，為確保該系統\n功能完整相容，限用Chrome、Edge瀏覽器，並請勿使用行動通訊器材進行操作。詳細系統\n操作說明請瀏覽教務處網站(https://aca.nccu.edu.tw/zh/)/相關連結/選課訊息/(各學年)選課說\n明。\n(一) 學士班學生超減修習學分數申請\n1. 學分下限：學士班學生第一至第三學年每學期修習學分，不得少於12學分，第四\n學年每學期不得少於10學分。\n2. 學分上限：具雙主修身分者學分修習上限提高為31學分，具輔系身分者學分修習\n上限提高為28學分，無加修學系者為25學分。\n3. 學士班學生如因課程規劃及選課需要，預計於本學期修習學分數超過或低於學則\n規定之學分上下限者，應於規定期限內上網提出「超減修習學分數」申請。\n(二) 學士班四年級學生體育必修課程補修\n學士班四年級學生若仍有體育必修課程2科以上未修滿，欲於當學期修習兩門體育\n必修課者，請於規定期限上網登記申請，一經申請確認，即可於當學期加退選期間\n分發兩門體育必修課程。\n(三) 灌檔、轉檔\n1. 為簡化學生選課手續，學士班各系「必修灌檔」課程（必修且排課時指定灌檔之\n課程）或全學年課程之下學期；若因先修科目不及格遭擋修時，課程會於課程加\n簽暨退課結束後移除，同學可於非歸責學生選課處理結束前提出允許修習之申\n請。科目轉檔或灌檔進行時並未檢查衝堂，所以可能會發生衝堂問題，請同學於\n開放退選時自行排除衝堂。\n8-1\n\n2. 學士班一年級新生必須修習大學英文(一)及大學英文(二)課程，由外文中心統一\n灌檔。重修生或未曾修習之學士班二年級以上學生，請依選課程序進行選課。\n(四) 初選\n初選作業採兩階段登記分發，第一階段開放2天登記、第二階段開放3天，登記結\n束後進行1天分發。課程登記可由課表查詢加入追蹤清單後再行登記至「遞補&登記\n清單」或以科目代號單一或批量快速登記加選，等待統一分發。\n1. 第一階段接受專業科目之登記及分發，第二階段則開放所有科目(含通識、體育必\n修課及全民國防教育軍事訓練[軍訓]課程)之登記及分發，請同學依個人修業需要\n登記課程，並可由學生自行設定分發之優先順序。\n2. 登記科目數上限為30科。請依系所設定內容及課程備註欄中註記之限制條件選\n課，不符條件者請勿登記。擋修科目或重複修習科目不允許登記(系所灌檔轉檔科\n目除外)。灌檔或已轉檔科目可進行退選。系所設定不可退選科目如欲退選請洽開\n課單位協助。\n3. 分發順序：依【學生設定選課排序＋身分別＋選課點數】按科目代號由小到大順\n序分發。教學意見調查及其他條件之加計選課點數於二階段初選均採計。\n4. 分發科目數：\n通識科目：中文通識、外文通識各以一科為限。一般通識（含核心通識）及書院通識\n合計以三科為限(書院通識至多分發一科)。\n前述通識科目(不含中、外文通識及書院通識)在加退選階段不限制分發科\n目數。\n體育必修課程：以一科為限，如有特殊情形請逕洽體育室協助。\n一般科目及全民國防教育軍事訓練(軍訓)課程：無科目數的限定。\n所有選上學分數不得大於學生修習學分上限(學士班學生，具雙主修身分者為 31 學\n分，具輔系身分者為28學分，無加修學系且無申請超修者為25學分；碩博士學生依\n各系所修業規定)。\n初選階段經學系所灌檔、轉檔、分派或系統分發選上的科目，「遞補衝堂時優先保留\n本課程」欄位均預設為「保留」，同學得自行變更設定為「不保留」，但請務必「儲存\n並執行目前設定」。\n5. 衝堂：分發過程中不允許任何衝堂。先分發科目先選上，同時段後分發科目除因\n原分發科目經同學設定不保留外，自動落選。\n6. 遞補：第一階段初選落選科目不列遞補並自動刪除，學生需於第二階段初選重新\n登記。第二階段初選未選上科目自動進入遞補清單。學生可針對已選上科目設定\n選上後不被遞補欄位(即保留)，以決定分發科目是否遞補前一階段已選上之衝堂\n8-2\n\n科目。\n7. 復學生應於選課規定時間內辦理選課。\n(五) 加退選\n1. 本階段除開課單位設定不得退選課程外接受所有科目的登記、遞補及退選作業，\n第二階段初選未選上科目自動列入遞補科目。加退選期間『遞補科目+登記科目』\n合計上限為50 科。\n2. 每日下午 5:00選課系統關閉2 小時，以進行遞補分發作業。\n3. 此階段之科目遞補時，同時檢查與已選上科目之時間相同、科目名稱相同及科目\n代號前六碼相同之衝堂，並依據同學設定科目保留狀況進行遞補。\n※ 請注意：加退選階段遞補分發上的科目，其「遞補衝堂時優先保留本課程」欄位所\n呈現之「保留」、「不保留」係由同學於「遞補&登記清單」中該科目原設定狀態帶\n入。\n(六) 課程加簽暨退課\n1. 加退選後，選課設定開放加簽科目且學生在科目遞補名單中者，可於選課系統中列\n印「選課加簽單」進行加簽。若欲加簽科目與已選上科目發生衝堂，仍可列印加簽\n單，但必須先完成衝堂科目退選，同學可持原加簽單所列「因加簽衝堂欲退選科\n目」經該授課老師同意，先送註冊組處理退課，再由加簽科目開課單位辦理加簽；\n或另印退課單依程序辦理退課。\n2. 加簽課程時，若學分數已達當學期修習學分上限或超過此階段加簽科目上限時，即\n無法進行系統加簽作業。\n3. 本階段學士班學生加簽﹝含學系(所)加選﹞科目以5科為限，碩博士班學生加簽\n[含學系(所)加選]科目以3科為限。\n(七) 非歸責學生事由選課處理\n因非歸責學生事由(如系統分發錯誤)須加退選課程者，請檢附相關證明文件及學生選課\n報告說明，經任課教師及開課單位同意，送請學生所屬系所簽辦，經教務長同意後辦\n理。\n(八) 國內校際選課(非校際選課期間系統不開放)：系統填報紙本申請\n1.本校學生赴外校選課：\n（1） 請於選課系統/登入校際選課申請系統(本校生)/填寫選課資料，列印校際選課\n申請單，經學生所屬系所同意，並審核是否計入畢業學分(得否認定為雙修輔系、\n教育學程學分或通識學分，須再另洽各該學系、師培中心或通識教育中心)，送\n教務處註冊組提出申請，赴選課學校經授課教師、開課系所、他校教務處經辦單\n位同意，繳交學分費後，於期限內將申請單送回本校註冊組，才完成選課程序，\n逾期恕不受理。\n＊學分費收費標準請參見各校相關網頁資料或逕洽各校相關單位詢問。\n8-3\n\n（2） 本校學生赴外校選課，每學期以六學分為上限，且修習之科目為本校當學期未開課\n者。其他相關規定請參閱「國立政治大學國內校際選課辦法」。\n（3） 請依學生修課學校開學日上課，以免影響修課權益。\n（4）本校學生至台聯大系統大學校際選課注意事項如下：\n◎學分費收費標準：\n★修習一般課程(本校收費)\n（5） 本校學士班學生至東華大學選學士班課程學分費收費標準：依開課學校學分費六\n折計算\n（6）本校學生至臺北藝術大學校際選課注意事項如下：\n◎ 所修課程若為兩校已開放選課課程，則免辦開課院系所與授課教師核定之流程，\n直接至該校出納組繳費。\n◎學分費收費標準：依開課學校學分費六折計算。\n2.外校學生至本校選課：\n（1） 請於選課系統/登入校際選課申請系統(外校生)/填寫基本資料以及選課資料，\n列印校際選課申請單經原學校同意經本校授課教師、開課系所同意本校出\n納組繳交學分費於期限內將申請表送回本校教務處註冊組完成選課資料登錄。\n（2） 本校學分費收費標準：依同學所選課程之開課單位學分費收費標準收費，相關資\n料請參見政大首頁＞相關連結＞校務暨財務公開專區＞學雜費專區。另，台聯系統\n學校學生修習本校一般課程原則本校不收費、臺北藝術大學學生修習本校一般課\n程原則依同學所選課程之開課單位學分費收費標準收費六折計算、東華大學學士\n班學生修習本校學士班一般課程原則依同學所選課程之開課單位學分費收費標準\n收費六折計算。若修習特殊收費課程如在職專班、師培課程或擴大輔系專班課\n(010)等課程，本校則依前開規定收取學分費。\n3.國內校際選課申請期限為開學後第 2週的最後一天上班日。\n(九) 出國選課\n1. 學生辦理出國選課，依本校「國立政治大學學生出國選修課程實施辦法」規定辦理。\n2. 學生欲出國交換選課，應於出國前依公告時間提出出國選課之申請，經系所及相關單\n8-4\n\n| 學士班非延畢生：不收學分費 |\n| --- |\n| 學士班延畢生：本校依文學院學分費標準計算至友校修課學分數收取學分 |\n| 費。合計友校及本校修課學分數，未達 10學分另收等比例雜費，10學分(含)以 |\n| 上則收全額學雜費，不再另收學分費。 |\n| 碩博士班學生：本校依碩博士班學分費標準計算至友校修課學分費收取學分 |\n| 費。 |\n\n| ★修習特殊收費課程如在職專班、師培課等，由學生修課學校依其規定收取學 |\n| --- |\n| 分費。 |\n\n位同意，始完成出國選課申請程序。學生於出國選課期間，仍應辦理本校註冊繳費事\n宜，且在本校不得選課；未完成出國選課申請，以致有註冊未選課者，依學則規定辦\n理學籍處理。\n3. 出國選課申請期限為課程加簽暨退課結束前。\n(十) 課程停修\n對於修習困難或沒有興趣的課程，可於授課教師同意下於規定期限內辦理停修，但停\n止修讀課程每學期以一科為限，但情況特殊經導師、就讀系所主管同意者不在此限，\n且於扣除停止修讀之學分數後，總修讀學分數不得低於學則規定之最低學分數」。 (應\n繳交學分費科目應完成繳費後始可停修修，但不退費)。\n三、【選課結果查詢】\n1.學生可透過網路選課系統查詢選課結果，並可直接列印選課清單存查。學生亦可於選課期\n間在選課作業系統中「課表」頁籤產生即時課表，亦可匯出檔案存查。教務處於「課程\n加簽暨退課」結束後寄發選課結果電子郵件。\n2.透過選課系統可以查詢『已選上科目及管道』、『遞補中科目及遞補序號、身分』、『追蹤清\n單科目及選課狀態』、『落選科目及原因』，另外亦可查詢科目尚有多少餘額等。請詳加利用\n查詢功能，掌握最新的選課資訊。\n四、【選課重點提示】\n1.退選：採即時退選，在初選及加退選期間皆可接受退選，無法退選科目請洽開課單位協\n助。\n2.加選：採『登記加選、批次遞補』方式處理，同一分發梯次加選登記者，不以登記時間之\n先後為排序依據，以分散學生登記時段。\n3.遞補原則：\nA.二階段初選作業均採先登記後統一分發方式進行，且不允許衝堂，第一階段初選未選\n上科目系統自動刪除，第二階段初選未選上科目自動進入加退選階段「遞補清單」\n中。\nB.加退選期間遞補原則：\n加退選期間進行遞補作業，【選課清單】中已選上的科目若「遞補衝堂時優先保留本\n課程」狀態設定為「不保留」，則有可能被【遞補&登記清單】中同時段科目遞補分發\n後擠退。反之，若已選上科目已設為「保留」，則該上課時段即使有遞補中之科目，\n亦不會被遞補擠退。（系所設定「不可退選之科目」無法自行退選，亦不會被遞補擠\n退）。\nC.科目名稱相同之科目，亦需設定「保留」，不然會遞補擠退。\n體育必修(002)、中文通識(031)、外文通識(032) 、書院通識(045)、科目名稱及科目\n代碼前六碼相同之課程，即使上課時間不同，已選上之科目若設定成「不保留」，遞補\n中之科目亦會擠退已選上之科目，請同學依據自身需求先行設定好每一門課「遞補衝堂\n8-5\n\n時優先保留本課程」狀態。\n例：（週一）經濟學為已選上之科目，（週二）經濟學為遞補中之科目。若週一經濟學設\n定成「不保留」，且週二經濟學如可遞補，則將擠退已選上之週一經濟學：但若週一\n經濟學已被設定為「保留不被遞補」之科目，則將保留週一課，週二之課則會遞補\n落選。（但系所設定「不可退選之科目」不會被擠退）。\nD.凡經灌檔、轉檔、分派及初選階段分發之科目將自動被設為「保留」。同學亦可自行變\n更該項設定或退選，惟經系所設定不得退選之科目，無法自行退選，請洽開課單位協\n助。\nE.「遞補衝堂時優先保留本課程」保留與不保留設定：\n★選上科目若有設定保留者，則不會被擠退。\n★選上科目若有設定不保留者，可能會被擠退也可能不會被擠退，不要的課，一定要\n「自行退課」。\n★遞補科目設定保留，有機會被選上，一旦被選上不會被擠退。\n★遞補科目設定不保留，有機會被選上，一旦被選上，可能會被擠退也可能不會被擠\n退，遞補中之科目，但不想要被遞補上的課，一定要「刪除」。\n4.系統刪除選課之保留原則：系所設定加選並設定不得退選者，最優先保留；學生自行設定\n保留者，次優先；時間分發次序為後分發者，優先保留；分發時間相同時，科目代碼小\n者，優先保留。\n5.特別提醒：學生於選課系統任何操作與設定請務必存檔(儲存並執行目前設定)。\n五、【重複修習或被擋修未被允許科目，「加簽暨退課」結束後，系統刪\n除該科目選課資料】\n1. 期保留。\n\n二、本人、配偶或伴侶懷孕、曾懷孕或分娩者，以一年為限。\n\n三、本人、配偶或伴侶撫育三歲以下子女者，至子女滿三足歲為限。\n\n學生因前述原因補辦休學學期回溯保留學籍之申請，限於申請時仍具本校在籍身分，學生已畢業、退學或學籍註銷不得申請。\n\n請准保留學籍學生，其保留學籍期間之修課紀錄予以刪除。\n\n休學/保留學籍申請時間\n\n一、新生及轉學生\n\n（一）入學第一學期之繳費註冊截止日前：申請休學或保留學籍，免繳註冊相關費用。\n\n（二）入學第一學期之繳費註冊截止日後：申請休學或保留學籍，須繳費後始得辦理。若延誤註冊逾二週仍未完成繳費註冊、休學或保留學籍者，當學年度入學新生即令註銷學籍。\n\n二、在校學生\n\n（一）當學期繳費註冊截止日前：申請休學或保留學籍，免繳註冊相關費用。\n\n（二）已完成當學期繳費註冊後：申請休學或保留學籍，須於當學期休學截止日前辦理；完成休學/保留學籍程序，當學期所修課程將自動刪除。\n\n休學/保留學籍申請程序\n\n本人攜帶學生證或身分證件正本（非本人親辦，需附委託書及被委託人身分證件正本），填妥「休學/保留學籍申請書」並依說明至系所及各處室蓋章後，送至教務處註冊組；申請保留學籍者需檢具相關證明文件。\n\n休學/保留學籍期滿復學與提早復學之規定 \n\n一、學生休學或保留學籍期滿即應復學，並依規定期限辦妥繳費註冊相關事宜。\n\n二、如於尚未期滿前擬辦提早復學，應於復學之當學期加退選結束前，本人攜帶學生證或身分證件正本（非本人親辦，需附委託書及被委託人身分證件正本），填妥「提早復學申請書」並依說明至系所及各處室蓋章後，送至教務處註冊組，並依規定期限辦妥註冊相關事宜。\n\n三、復學時仍應在原肄業系（所）相銜接之學年或學期肄業；學期中途休學或保留學籍者，復學時應入原肄業之年級或學期肄業。\n\n休學/保留學籍退費說明\n\n一、 有關學雜（學基）費、學分費及相關繳費退費將依本校學年行事曆中之繳交學雜費截止日、學期三分之一、學期三分之二為基準，按照比例退費至學生於總務處出納組登記之帳戶。\n\n二、 退費相關事宜由學務處生僑組承辦，請至【學務處首頁/生活事務暨僑生輔導組/學生生活事務/休退學暨研究生畢業退費/[休（退）學退費標準](https://osa.nccu.edu.tw/tw/%E7%94%9F%E6%B4%BB%E4%BA%8B%E5%8B%99%E6%9A%A8%E5%83%91%E7%94%9F%E8%BC%94%E5%B0%8E%E7%B5%84/%E5%AD%B8%E7%94%9F%E7%94%9F%E6%B4%BB%E4%BA%8B%E5%8B%99/%E4%BC%91%E9%80%80%E5%AD%B8%E6%9A%A8%E7%A0%94%E7%A9%B6%E7%94%9F%E7%95%A2%E6%A5%AD%E9%80%80%E8%B2%BB/%E4%BC%91-%E9%80%80-%E5%AD%B8%E9%80%80%E8%B2%BB%E6%A8%99%E6%BA%96)】項下參考其退費相關標準。\n\n相關法規與表單\n\n[國立政治大學學則第十三條、第四十一條、第四十二條、第四十二條之一、第四十三條規定](https://aca.nccu.edu.tw/download/rulesdata/law01A.pdf)\n\n[休學/保留學籍申請書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-02)\n\n[提早復學申請書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-04)\n\n[各項證明文件申辦委託書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-02-05)\n\n116011台北市文山區指南路二段64號 行政大樓四樓 聯絡我們", "counted": true}, {"index": 2, "role": "HumanMessage", "tool": null, "title": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]", "chars": 4203, "text": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]\n\nget_form 取得表單 各項證明文件申辦委託書 / Power of Attorney for Certificates\n[live:src status=snapshot kind=form checked= snap=2026-08 tls=0 url=https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-02-05]\n\n全文：\n表單編號:QP-T01-02-05\n保存年限:1 年\n國立政治大學教務處註冊組各項證明文件申辦委託書\n本人 茲委託 先生/小姐代為辦\n理 。\n此致\n教務處註冊組\n委 託 人\n(簽名或蓋章)\n身分證統一編號\n聯 絡 電 話\n受 託 人\n身分證統一編號\n與委託人關係\n聯 絡 電 話\n中華民國 年 月 日\n委託代辦說明\n1. 依法律之規定，有使用文字之必要者，得不由本人自寫，但必須親自簽名。如有用印章代簽名\n者，其蓋章與簽名生同等之效力。(民 3)(依內政部 89.10.11 台(89)內戶字第 8973709 號函釋規\n定委託書雖不以自寫必要，但仍須親自簽名或蓋章)。 僑生、港澳生、陸生及國際學生請填寫\n有效居留證號或護照號碼。\n2. 委託申辦「畢業離校」時，除填寫本委託書外，被委託人應攜帶身分證明文件正本辦理（委託\n人如為境外生，另須準備居留證影本交予被委託人，學校將核對並維護其居留證號）。委託申\n辦「遺失學位(畢業)證書補發」時，除填寫本委託書外，應攜帶委託人身分證明文件影本及被\n委託人身分證明文件正本辦理。\n3. 被委託人應攜帶身分證明文件正本(國民身分證、駕照、健保卡、有效護照或有效居留證)以備\n查驗;學校於必要時，得向委託人進行委託事實查證。\n4. 若有未經合法授權或資料有冒偽情事文他人或機關受有損害，受託人應自負一切民刑事責任。\n\nget_form 取得表單 休學/保留學籍申請書 / NCCU Application Form for Leave of Absence of Student Status\n[live:src status=snapshot kind=form checked= snap=2026-08 tls=0 url=https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-02]\n\n全文：\n表單編號：QP-T01-03-02\n保存年限：1 年\n國立政治大學 學生□休學□保留學籍 申請書\n□學士班 □碩士班 □博士班\n202512版\n\n| 申 請 人 | 學 號 |  | 姓 名 |  |  |  |  | 系 級 | 系（所/學程） |  |  |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n|  |  |  |  |  |  |  |  |  | 組（班） 年級 |  |  |\n| 申請 期間 |  | 自 學年度第 學期起 至 學年度第 學期止 |  |  |  |  |  |  | 家長 同意 | (未成年學生須經法定代理人簽章同意。） |  |\n| 復學 時間 |  | 學年度第 學期 |  |  |  | 出生年 月日 | 民國 年 月 日 |  |  |  | 電 話 |\n| 原 因 |  | □傷病□經濟因素□系所不符預期□工作□家務原因□論文撰寫□懷孕/育嬰/兵役(請圈選) □其他:(請簡述原因) |  |  |  |  |  |  |  |  |  |\n| 會 簽 程 序 【 申 請 者 請 參 閱 本 表 說 明 並 依 序 前 往 辦 理 】 |  | （1）系所簽章 |  |  | （2）圖書館 |  |  |  |  | （3）出納組 |  |\n|  |  | ※轉系(所)經核准公告後，於申辦當學期 休學者，取消其轉系(所)核准資格 （各系所辦公室） |  |  | （總圖或分館借還書櫃檯） |  |  |  |  | (行政大樓5樓) (確認學生帳戶) |  |\n|  |  | （4）住宿組 |  |  | (5)生僑組/原資中心 |  |  |  |  | （6）國際合作事務處 |  |\n|  |  | 限住宿生(行政大樓 3 樓) ※畢業、休學、退學或轉學住宿生應於發生 日起7日內(含例假日、且不得超過當學期期 末所定離舍日)向住宿組辦理退離宿手續 後，始得申請退還宿費及住宿保證金。 (非住宿生免辦) |  |  | (行政大樓 3 樓) (僑生、港澳生、陸生至生僑組) (原住民族籍學生至原資中心) |  |  |  |  | 限國際學生(行政大樓8樓) ※申請休學/保留學籍之國際學生請 l=QP-T01-03-04"}], "keypoints": ["K23"], "found": true}, {"text": "依規定完成繳費註冊、選課上課者，即完成復學手續", "sources": [{"kind": "live", "as_of": "2026-11-13（現場）", "url": "https://aca.nccu.edu.tw/db/upload/115-1註冊通知單_中文版.pdf"}], "keypoints": ["K24"], "found": false}]}, "prediction": {"content": "休學或保留學籍期滿者，依規定完成繳費註冊、選課上課，即完成復學手續，不需要申請表。\n\n如果要在期滿前提早復學：\n1. 須在復學當學期的加退選結束前辦理。\n2. 本人攜帶學生證或身分證件正本（非本人親辦，需附委託書及被委託人身分證件正本；委託書：https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-02-05），填妥「提早復學申請書」（表單編號 QP-T01-03-04，下載連結：https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-04）。\n3. 請以下單位蓋章：\n   - 系所會辦。\n   - 生僑組（僅男生及僑生需辦理）：請繳交歸屬證書正本、體位證書正本或退伍令影本，在行政大樓三樓，聯絡人盧誼甄（分機 62226）。\n   - 國際合作事務處（僅國際學生需辦理）：在行政大樓八樓，聯絡人徐維勵（分機 62058）。\n   - 註冊組承辦人擬准予復學，再由註冊組組長蓋章；學士班另加會學士班統籌。註冊組在行政大樓四樓，組長王揚忠（分機 63273）。\n4. 各單位蓋章完畢後，送註冊組辦理。申請經核准後，即完成復學手續。\n5. 完成復學手續後，要依規定期限辦理註冊。\n6. 原保留入學資格者，因保留原因消失想提早復學，限於第一學期申請（每年八月），第二學期不得申請入學。", "references": [{"index": 1, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 1936 字，標題: 休學-保留學籍-退學-提早復學，subdomain: aca", "chars": 2167, "text": "get_page 取得 1936 字，標題: 休學-保留學籍-退學-提早復學，subdomain: aca\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://aca.nccu.edu.tw/zh/服務項目/學籍/休學-保留學籍-退學-提早復學]\n[偵測到表單編號: QP-T01-02-05, QP-T01-03-02, QP-T01-03-04]\n\n全文：\n休學/保留學籍 /提早復學\t\t\t\n\n休學規定\n\n依本校學則第四十一條規定，學生申請當學期休學者，須於期末考試以前辦理，逾期不予受理。申請休學，得由學校一次核准一學期至二學年。休學累計以二學年為原則，期滿因重病或特殊事故需再申請延長休學一學期或一學年者，得專案報請校長核准，申請延長休學以一次為原則。\n\n請准休學學生，其休學期間之修課紀錄予以刪除。\n\n保留學籍規定\n\n依本校學則第四十二條規定，學生在學期間，有下列情形者，應附相關證明文件於休學截止日前，申請保留學籍：\n\n一、應徵召服兵役者，依法定役期保留。\n\n二、本人、配偶或伴侶懷孕、曾懷孕或分娩者，以一年為限。\n\n三、本人、配偶或伴侶撫育三歲以下子女者，至子女滿三足歲為限。\n\n學生因前述原因補辦休學學期回溯保留學籍之申請，限於申請時仍具本校在籍身分，學生已畢業、退學或學籍註銷不得申請。\n\n請准保留學籍學生，其保留學籍期間之修課紀錄予以刪除。\n\n休學/保留學籍申請時間\n\n一、新生及轉學生\n\n（一）入學第一學期之繳費註冊截止日前：申請休學或保留學籍，免繳註冊相關費用。\n\n（二）入學第一學期之繳費註冊截止日後：申請休學或保留學籍，須繳費後始得辦理。若延誤註冊逾二週仍未完成繳費註冊、休學或保留學籍者，當學年度入學新生即令註銷學籍。\n\n二、在校學生\n\n（一）當學期繳費註冊截止日前：申請休學或保留學籍，免繳註冊相關費用。\n\n（二）已完成當學期繳費註冊後：申請休學或保留學籍，須於當學期休學截止日前辦理；完成休學/保留學籍程序，當學期所修課程將自動刪除。\n\n休學/保留學籍申請程序\n\n本人攜帶學生證或身分證件正本（非本人親辦，需附委託書及被委託人身分證件正本），填妥「休學/保留學籍申請書」並依說明至系所及各處室蓋章後，送至教務處註冊組；申請保留學籍者需檢具相關證明文件。\n\n休學/保留學籍期滿復學與提早復學之規定 \n\n一、學生休學或保留學籍期滿即應復學，並依規定期限辦妥繳費註冊相關事宜。\n\n二、如於尚未期滿前擬辦提早復學，應於復學之當學期加退選結束前，本人攜帶學生證或身分證件正本（非本人親辦，需附委託書及被委託人身分證件正本），填妥「提早復學申請書」並依說明至系所及各處室蓋章後，送至教務處註冊組，並依規定期限辦妥註冊相關事宜。\n\n三、復學時仍應在原肄業系（所）相銜接之學年或學期肄業；學期中途休學或保留學籍者，復學時應入原肄業之年級或學期肄業。\n\n休學/保留學籍退費說明\n\n一、 有關學雜（學基）費、學分費及相關繳費退費將依本校學年行事曆中之繳交學雜費截止日、學期三分之一、學期三分之二為基準，按照比例退費至學生於總務處出納組登記之帳戶。\n\n二、 退費相關事宜由學務處生僑組承辦，請至【學務處首頁/生活事務暨僑生輔導組/學生生活事務/休退學暨研究生畢業退費/[休（退）學退費標準](https://osa.nccu.edu.tw/tw/%E7%94%9F%E6%B4%BB%E4%BA%8B%E5%8B%99%E6%9A%A8%E5%83%91%E7%94%9F%E8%BC%94%E5%B0%8E%E7%B5%84/%E5%AD%B8%E7%94%9F%E7%94%9F%E6%B4%BB%E4%BA%8B%E5%8B%99/%E4%BC%91%E9%80%80%E5%AD%B8%E6%9A%A8%E7%A0%94%E7%A9%B6%E7%94%9F%E7%95%A2%E6%A5%AD%E9%80%80%E8%B2%BB/%E4%BC%91-%E9%80%80-%E5%AD%B8%E9%80%80%E8%B2%BB%E6%A8%99%E6%BA%96)】項下參考其退費相關標準。\n\n相關法規與表單\n\n[國立政治大學學則第十三條、第四十一條、第四十二條、第四十二條之一、第四十三條規定](https://aca.nccu.edu.tw/download/rulesdata/law01A.pdf)\n\n[休學/保留學籍申請書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-02)\n\n[提早復學申請書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-04)\n\n[各項證明文件申辦委託書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-02-05)\n\n116011台北市文山區指南路二段64號 行政大樓四樓 聯絡我們", "counted": true}, {"index": 2, "role": "HumanMessage", "tool": null, "title": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]", "chars": 4203, "text": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]\n\nget_form 取得表單 各項證明文件申辦委託書 / Power of Attorney for Certificates\n[live:src status=snapshot kind=form checked= snap=2026-08 tls=0 url=https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-02-05]\n\n全文：\n表單編號:QP-T01-02-05\n保存年限:1 年\n國立政治大學教務處註冊組各項證明文件申辦委託書\n本人 茲委託 先生/小姐代為辦\n理 。\n此致\n教務處註冊組\n委 託 人\n(簽名或蓋章)\n身分證統一編號\n聯 絡 電 話\n受 託 人\n身分證統一編號\n與委託人關係\n聯 絡 電 話\n中華民國 年 月 日\n委託代辦說明\n1. 依法律之規定，有使用文字之必要者，得不由本人自寫，但必須親自簽名。如有用印章代簽名\n者，其蓋章與簽名生同等之效力。(民 3)(依內政部 89.10.11 台 : true}]}, "prediction": {"content": "辦理休學的流程如下。\n\n**規定**\n- 申請當學期休學，須在期末考試（休學截止日）前辦理，逾期不予受理。\n- 休學一次可申請一學期至二學年，累計以二學年為原則。\n- 休學期間的修課紀錄予以刪除（含國內外校際選課）。\n\n**程序**\n1. 本人攜帶學生證或身分證件正本，填妥「休學/保留學籍申請書」（表單編號 QP-T01-03-02，下載連結：https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-02）。\n2. 依申請書的會簽程序依序前往各單位辦理：\n   - 系所簽章。\n   - 圖書館（總圖或分館借還書櫃檯）。\n   - 出納組（行政大樓五樓）確認學生帳戶，找劉組長（分機 62120）。\n   - 住宿組（行政大樓三樓）：限住宿生，非住宿生免辦。找陳源宗（分機 67161）。\n   - 生僑組（行政大樓三樓）：僑生、港澳生、陸生到生僑組，找盧小姐（分機 62226）；原住民族籍學生到原資中心（行政大樓三樓），找古素幸（分機 62201）。\n   - 國際合作事務處（行政大樓八樓）：限國際學生，找計畫專員（分機 62058）。\n   - 教務處註冊組（行政大樓四樓）擬准休學，由註冊組組長簽章，教務長批示，找王組長（分機 63273）。\n3. 各單位蓋章完畢後，送教務處註冊組。\n\n**退費**（由學務處生僑組承辦）\n- 繳費截止日（含）前完成休學程序：學雜費全額退費。\n- 繳費截止日次日起至學期 1/3 退費基準日：退 2/3 學雜費。\n- 學期 1/3 退費基準日次日起至 2/3 退費基準日（含）：退 1/3 學雜費。\n- 逾學期 2/3 退費基準日申請休學：學雜費全數不予退還。\n- 學生平安保險費不退費。", "references": [{"index": 1, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 1936 字，標題: 休學-保留學籍-退學-提早復學，subdomain: aca", "chars": 2167, "text": "get_page 取得 1936 字，標題: 休學-保留學籍-退學-提早復學，subdomain: aca\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://aca.nccu.edu.tw/zh/服務項目/學籍/休學-保留學籍-退學-提早復學]\n[偵測到表單編號: QP-T01-02-05, QP-T01-03-02, QP-T01-03-04]\n\n全文：\n休學/保留學籍 /提早復學\t\t\t\n\n休學規定\n\n依本校學則第四十一條規定，學生申請當學期休學者，須於期末考試以前辦理，逾期不予受理。申請休學，得由學校一次核准一學期至二學年。休學累計以二學年為原則，期滿因重病或特殊事故需再申請延長休學一學期或一學年者，得專案報請校長核准，申請延長休學以一次為原則。\n\n請准休學學生，其休學期間之修課紀錄予以刪除。\n\n保留學籍規定\n\n依本校學則第四十二條規定，學生在學期間，有下列情形者，應附相關證明文件於休學截止日前，申請保留學籍：\n\n一、應徵召服兵役者，依法定役期保留。\n\n二、本人、配偶或伴侶懷孕、曾懷孕或分娩者，以一年為限。\n\n三、本人、配偶或伴侶撫育三歲以下子女者，至子女滿三足歲為限。\n\n學生因前述原因補辦休學學期回溯保留學籍之申請，限於申請時仍具本校在籍身分，學生已畢業、退學或學籍註銷不得申請。\n\n請准保留學籍學生，其保留學籍期間之修課紀錄予以刪除。\n\n休學/保留學籍申請時間\n\n一、新生及轉學生\n\n（一）入學第一學期之繳費註冊截止日前：申請休學或保留學籍，免繳註冊相關費用。\n\n（二）入學第一學期之繳費註冊截止日後：申請休學或保留學籍，須繳費後始得辦理。若延誤註冊逾二週仍未完成繳費註冊、休學或保留學籍者，當學年度入學新生即令註銷學籍。\n\n二、在校學生\n\n（一）當學期繳費註冊截止日前：申請休學或保留學籍，免繳註冊相關費用。\n\n（二）已完成當學期繳費註冊後：申請休學或保留學籍，須於當學期休學截止日前辦理；完成休學/保留學籍程序，當學期所修課程將自動刪除。\n\n休學/保留學籍申請程序\n\n本人攜帶學生證或身分證件正本（非本人親辦，需附委託書及被委託人身分證件正本），填妥「休學/保留學籍申請書」並依說明至系所及各處室蓋章後，送至教務處註冊組；申請保留學籍者需檢具相關證明文件。\n\n休學/保留學籍期滿復學與提早復學之規定 \n\n一、學生休學或保留學籍期滿即應復學，並依規定期限辦妥繳費註冊相關事宜。\n\n二、如於尚未期滿前擬辦提早復學，應於復學之當學期加退選結束前，本人攜帶學生證或身分證件正本（非本人親辦，需附委託書及被委託人身分證件正本），填妥「提早復學申請書」並依說明至系所及各處室蓋章後，送至教務處註冊組，並依規定期限辦妥註冊相關事宜。\n\n三、復學時仍應在原肄業系（所）相銜接之學年或學期肄業；學期中途休學或保留學籍者，復學時應入原肄業之年級或學期肄業。\n\n休學/保留學籍退費說明\n\n一、 有關學雜（學基）費、學分費及相關繳費退費將依本校學年行事曆中之繳交學雜費截止日、學期三分之一、學期三分之二為基準，按照比例退費至學生於總務處出納組登記之帳戶。\n\n二、 退費相關事宜由學務處生僑組承辦，請至【學務處首頁/生活事務暨僑生輔導組/學生生活事務/休退學暨研究生畢業退費/[休（退）學退費標準](https://osa.nccu.edu.tw/tw/%E7%94%9F%E6%B4%BB%E4%BA%8B%E5%8B%99%E6%9A%A8%E5%83%91%E7%94%9F%E8%BC%94%E5%B0%8E%E7%B5%84/%E5%AD%B8%E7%94%9F%E7%94%9F%E6%B4%BB%E4%BA%8B%E5%8B%99/%E4%BC%91%E9%80%80%E5%AD%B8%E6%9A%A8%E7%A0%94%E7%A9%B6%E7%94%9F%E7%95%A2%E6%A5%AD%E9%80%80%E8%B2%BB/%E4%BC%91-%E9%80%80-%E5%AD%B8%E9%80%80%E8%B2%BB%E6%A8%99%E6%BA%96)】項下參考其退費相關標準。\n\n相關法規與表單\n\n[國立政治大學學則第十三條、第四十一條、第四十二條、第四十二條之一、第四十三條規定](https://aca.nccu.edu.tw/download/rulesdata/law01A.pdf)\n\n[休學/保留學籍申請書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-02)\n\n[提早復學申請書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-04)\n\n[各項證明文件申辦委託書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-02-05)\n\n116011台北市文山區指南路二段64號 行政大樓四樓 聯絡我們", "counted": true}, {"index": 2, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 1223 字，標題: 休(退)學退費標準，subdomain: osa", "chars": 1412, "text": "get_page 取得 1223 字，標題: 休(退)學退費標準，subdomain: osa\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://osa.nccu.edu.tw/tw/生活事務暨僑生輔導組/學生生活事務/休退學暨研究生畢業退費/休-退-學退費標準]\n\n全文：\n[休(退)學退費標準](https://osa.nccu.edu.tw/tw/生活事務暨僑生輔導組/學生生活事務/休退學暨研究生畢業退費/休-退-學退費標準)\n\n 發佈: 2015年06月02日                    \n\n 點擊數: 102075                        \n\n法令依據: 依據教育部專科以上學校學雜費收取辦法第15條之專科以上學校學雜費退費基準表辦理。\n\n休 ( 退 ) 學日程\n\n退費標準\n\n繳費截止日(含)前完成休(退)學程序。\n\n學雜費全額退費(不含學生平安保險費)\n\n ( 宿費等退費請詳閱注意事項 4 、 5 、 6)\n\n繳費截止日次日起至學期1 / 3退費基準日完成休(退)學程序。\n\n退2 / 3學雜費 (不含學生平安保險費)\n\n ( 宿費等退費請詳閱注意事項 4 、 5 、 6)\n\n學期1 / 3退費基準日次日起至學期2 / 3退費基準日(含)完成休(退)學程序。\n\n退1 / 3 學雜費(不含學生平安保險費)\n\n ( 宿費等退費請詳閱注意事項 4 、 5 、 6)\n\n逾學期2 / 3退費基準日申請休(退)學。\n\n學雜費全數不予退還。\n\n注意事項：\n\n1.學生於繳費截止日前辦理休(退)學，不需繳費，直接辦理即可。但休學且欲參加學生平安保險者，需繳交平安保險費，並影印繳費單據乙份給生僑組學生平安保險承辦人 (除退費外，休(退)學相關問題請洽行政大樓四樓教務處註冊組，代表分機 63279)。\n\n2.學生未於本校登錄入帳帳戶者，請攜帶本人第一銀行或郵局帳戶至行政大樓五樓總務處出納組登錄，以利辦理退費(登錄帳戶及入帳相關問題請洽總務處出納組，分機62123)。\n\n3.學生完成休(退)學程序後，學務處生僑組將依註冊組學籍資料及出納組繳費資料主動退費，學生不需親自到生僑組辦理，退費款項會直接匯入學生第一銀行或郵局帳戶。(退費款項不含宿費、住宿保證金、僑生及外籍生健保費，另學生於休學當學期繳交平安保險費仍受學生團保之保障，故平安保險費不退費)。\n\n4.宿費及住宿保證金退費，請填妥退宿申請表，並至宿舍區檢查寢室後，再到行政大樓三樓學務處住宿組辦理退費(宿舍相關退費問題，大學部請洽分機62222，研究所請洽分機63251)。\n\n5.僑生、外籍生健保費退費請分別至學務處生僑組(分機63013)、國合處國際教育組(分機62040)辦理。\n\n6.退費基準日依據本校各學年行事曆日程辦理。\n\n學務處意見信箱： nccuosa@nccu.edu.tw 總機電話：02-29393091 緊急事件通聯窗口（24小時） 學安、校安中心 0919099119, 校內分機 66119 駐警隊 02-29387129, 校內分機 66110 地址：台北市文山區指南路二段64號 行政大樓三樓 Copyright © 2019 國立政治大學學務處. All Rights Reserved.", "counted": true}, {"index": 3, "role": "HumanMessage", "tool": null, "title": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]", "chars": 4203, "text": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]\n\nget_form 取得表單 各項證明文件申辦委託書 / Power of Attorney for Certificates\n[live:src status=snapshot kind=form checked= snap=2026-08 tls=0 url=https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-02-05]\n\n全文：\n表單編號:QP-T01-02-05\n保存年限:1 年\n國立政治大學教務處註冊組各項證明文件申辦委託書\n本人 茲委託 先生/小姐代為辦\n理 。\n此致\n教務處註冊組\n委 託 人\n(簽名或蓋章)\n身分證統一編號\n聯 絡 電 話\n受 託 人\n身分證統一編號\n與委託人關係\n聯 絡 電 話\n中華民國 年 月 日\n委託代辦說明\n1. 依法律之規定，有使用文字之必要者，得不由本人自寫，但必須親自簽名。如有用印章代簽名\n者，其蓋章與簽名生同等之效力。(民 3)(依內政部 89.10.11 台(89)內戶字第 8973709 號函釋規\n定委託書雖不以自寫必要，但仍須親自簽名或蓋章)。 僑生、港澳生、陸生及國際學生請填寫\n有效居留證號或護照號碼。\n2. 委託申辦「畢業離校」時，除填寫本委託書外，被委託人應攜帶身分證明文件正本辦理（委託\n人如為境外生，另須準備居留證影本交予被委託人，學校將核對並維護其居留證號）。委託申\n辦「遺失學位(畢業)證書補發」時，除填寫本委託書外，應攜帶委託人身分證明文件影本及被\n委託人身分證明文件正本辦理。\n3. 被委託人應攜帶身分證明文件正本(國民身分證、駕照、健保卡、有效護照或有效居留證)以備\n查驗;學校於必要時，得向委託人進行委託事實查證。\n4. 若有未經合法授權或資料有冒偽情事文他人或機關受有損害，受託人應自負一切民刑事責任。\n\nget_form 取得表單 休學/保留學籍申請書 / NCCU Application Form for Leave of Absence of Student Status\n[live:src status=snapshot kin 6-08（output/ 快照；表單版本 202512版）", "url": "https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-02"}], "keypoints": ["K45"], "found": true}, {"text": "當學期繳費註冊截止日前：申請休學或保留學籍，免繳註冊相關費用", "sources": [{"kind": "snapshot", "as_of": "2026-08（output/ 快照）", "url": "https://aca.nccu.edu.tw/zh/服務項目/學籍/休學-保留學籍-退學-提早復學"}, {"kind": "live", "as_of": "2026-11-13（現場）", "url": "https://aca.nccu.edu.tw/zh/服務項目/學籍/休學-保留學籍-退學-提早復學"}], "keypoints": ["K46"], "found": true}, {"text": "繳費註冊截止日後申請休學或保留學籍者，須繳費後始得辦理", "sources": [{"kind": "snapshot", "as_of": "2026-08（output/ 快照）", "url": "https://aca.nccu.edu.tw/download/rulesdata/law01A.pdf"}], "keypoints": ["K47"], "found": false}, {"text": "入學第一學期之繳費註冊截止日後：申請休學或保留學籍，須繳費後始得辦理", "sources": [{"kind": "snapshot", "as_of": "2026-08（output/ 快照）", "url": "https://aca.nccu.edu.tw/zh/服務項目/學籍/休學-保留學籍-退學-提早復學"}, {"kind": "live", "as_of": "2026-11-13（現場）", "url": "https://aca.nccu.edu.tw/zh/服務項目/學籍/休學-保留學籍-退學-提早復學"}], "keypoints": ["K47"], "found": true}, {"text": "若延誤註冊逾二週仍未完成繳費註冊、休學或保留學籍者，當學年度入學新生即令註銷學籍", "sources": [{"kind": "snapshot", "as_of": "2026-08（output/ 快照）", "url": "https://aca.nccu.edu.tw/zh/服務項目/學籍/休學-保留學籍-退學-提早復學"}, {"kind": "live", "as_of": "2026-11-13（現場）", "url": "https://aca.nccu.edu.tw/zh/服務項目/學籍/休學-保留學籍-退學-提早復學"}], "keypoints": ["K48"], "found": true}]}, "prediction": {"content": "辦理休學的流程如下。\n\n**規定**\n- 申請當學期休學，須在期末考試（休學截止日）前辦理，逾期不予受理。\n- 休學一次可申請一學期至二學年，累計以二學年為原則；期滿因重病或特殊事故需延長者，得專案報請校長核准，延長以一次為原則。\n- 休學期間的修課紀錄予以刪除（含國內外校際選課）。\n- 未成年學生須經法定代理人簽章同意。\n\n**程序**\n1. 本人攜帶學生證或身分證件正本（非本人親辦，需附委託書及被委託人身分證件正本；委託書：https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-02-05），填妥「休學/保留學籍申請書」（表單編號 QP-T01-03-02，下載連結：https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-02）。\n2. 依申請書的會簽程序依序前往各單位辦理：\n   - 系所簽章（各系所辦公室）。\n   - 圖書館（總圖或分館借還書櫃檯）。\n   - 出納組（行政大樓五樓），確認學生帳戶，聯絡人劉桂芬（分機 62120）。\n   - 住宿組（行政大樓三樓）：限住宿生，非住宿生免辦；住宿生要在休學事由發生日起 7 日內（不得超過當學期期末所定離舍日）辦理退離宿手續，之後才能申請退還宿費及住宿保證金。聯絡人趙紀綱（分機 62500）。\n   - 生僑組（行政大樓三樓）：僑生、港澳生、陸生到生僑組，聯絡人盧誼甄（分機 62226）；原住民族籍學生到原住民族學生資源中心（原資中心，行政大樓三樓），聯絡人蔡炎龍（分機 62200）。\n   - 國際合作事務處（行政大樓八樓）：限國際學生，聯絡人徐維勵（分機 62058）。國際學生在台居留事由為「就讀」者，外僑居留證將由移民署註銷，需在辦完手續後 10 日內離境；台灣獎學金自休學生效日的隔月起停發。\n   - 教務處註冊組（行政大樓四樓）擬准休學，再由註冊組組長簽章，教務長批示。聯絡人王揚忠（分機 63273）。\n3. 各單位蓋章完畢後，送教務處註冊組。\n4. 休學證明書可在三個工作天後親自到註冊組承辦人處領取，也可郵寄（附足資回郵信封），不需要證明書的人可自行上 iNCCU 查詢學籍狀態。\n\n**退費**（休學退費由學務處生僑組承辦）\n- 繳費截止日（含）前完成休學程序：學雜費全額退費（不含學生平安保險費）。\n- 繳費截止日次日起至學期 1/3 退費基準日完成休學程序：退 2/3 學雜費。\n- 學期 1/3 退費基準日次日起至 2/3 退費基準日（含）完成休學程序：退 1/3 學雜費。\n- 逾學期 2/3 退費基準日申請休學：學雜費全數不予退還。\n- 學生平安保險費不退費。\n- 完成休學程序後，生僑組依註冊組與出納組的資料主動退費，款項直接匯入學生登錄的帳戶，學生不需親自辦理。\n- 宿費及住宿保證金要填退宿申請表、至宿舍區檢查寢室後，到住宿組辦理退費。\n- 未在本校登錄入帳帳戶的學生，要攜帶第一銀行或郵局帳戶到出納組登錄，才能辦理退費。\n\n**補充**：因經濟因素休學的學生可先洽生僑組申請濟助措施；因懷孕等因素休學的學生可洽身心健康中心（電話 8237-7419）。\n\n**圖書館的電話**\n- 總圖（中正館流通櫃臺、典藏閱覽組）借還書：(02)2939-3091 轉分機 63222，直撥 (02)2938-7878。\n- 政大總機：(02)29393091。\n- 綜圖分機 50107、商圖分機 84006、傳圖分機 67152；達賢圖：(02)82377017。", "references": [{"index": 1, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 1936 字，標題: 休學-保留學籍-退學-提早復學，subdomain: aca", "chars": 2167, "text": "get_page 取得 1936 字，標題: 休學-保留學籍-退學-提早復學，subdomain: aca\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://aca.nccu.edu.tw/zh/服務項目/學籍/休學-保留學籍-退學-提早復學]\n[偵測到表單編號: QP-T01-02-05, QP-T01-03-02, QP-T01-03-04]\n\n全文：\n休學/保留學籍 /提早復學\t\t\t\n\n休學規定\n\n依本校學則第四十一條規定，學生申請當學期休學者，須於期末考試以前辦理，逾期不予受理。申請休學，得由學校一次核准一學期至二學年。休學累計以二學年為原則，期滿因重病或特殊事故需再申請延長休學一學期或一學年者，得專案報請校長核准，申請延長休學以一次為原則。\n\n請准休學學生，其休學期間之修課紀錄予以刪除。\n\n保留學籍規定\n\n依本校學則第四十二條規定，學生在學期間，有下列情形者，應附相關證明文件於休學截止日前，申請保留學籍：\n\n一、應徵召服兵役者，依法定役期保留。\n\n二、本人、配偶或伴侶懷孕、曾懷孕或分娩者，以一年為限。\n\n三、本人、配偶或伴侶撫育三歲以下子女者，至子女滿三足歲為限。\n\n學生因前述原因補辦休學學期回溯保留學籍之申請，限於申請時仍具本校在籍身分，學生已畢業、退學或學籍註銷不得申請。\n\n請准保留學籍學生，其保留學籍期間之修課紀錄予以刪除。\n\n休學/保留學籍申請時間\n\n一、新生及轉學生\n\n（一）入學第一學期之繳費註冊截止日前：申請休學或保留學籍，免繳註冊相關費用。\n\n（二）入學第一學期之繳費註冊截止日後：申請休學或保留學籍，須繳費後始得辦理。若延誤註冊逾二週仍未完成繳費註冊、休學或保留學籍者，當學年度入學新生即令註銷學籍。\n\n二、在校學生\n\n（一）當學期繳費註冊截止日前：申請休學或保留學籍，免繳註冊相關費用。\n\n（二）已完成當學期繳費註冊後：申請休學或保留學籍，須於當學期休學截止日前辦理；完成休學/保留學籍程序，當學期所修課程將自動刪除。\n\n休學/保留學籍申請程序\n\n本人攜帶學生證或身分證件正本（非本人親辦，需附委託書及被委託人身分證件正本），填妥「休學/保留學籍申請書」並依說明至系所及各處室蓋章後，送至教務處註冊組；申請保留學籍者需檢具相關證明文件。\n\n休學/保留學籍期滿復學與提早復學之規定 \n\n一、學生休學或保留學籍期滿即應復學，並依規定期限辦妥繳費註冊相關事宜。\n\n二、如於尚未期滿前擬辦提早復學，應於復學之當學期加退選結束前，本人攜帶學生證或身分證件正本（非本人親辦，需附委託書及被委託人身分證件正本），填妥「提早復學申請書」並依說明至系所及各處室蓋章後，送至教務處註冊組，並依規定期限辦妥註冊相關事宜。\n\n三、復學時仍應在原肄業系（所）相銜接之學年或學期肄業；學期中途休學或保留學籍者，復學時應入原肄業之年級或學期肄業。\n\n休學/保留學籍退費說明\n\n一、 有關學雜（學基）費、學分費及相關繳費退費將依本校學年行事曆中之繳交學雜費截止日、學期三分之一、學期三分之二為基準，按照比例退費至學生於總務處出納組登記之帳戶。\n\n二、 退費相關事宜由學務處生僑組承辦，請至【學務處首頁/生活事務暨僑生輔導組/學生生活事務/休退學暨研究生畢業退費/[休（退）學退費標準](https://osa.nccu.edu.tw/tw/%E7%94%9F%E6%B4%BB%E4%BA%8B%E5%8B%99%E6%9A%A8%E5%83%91%E7%94%9F%E8%BC%94%E5%B0%8E%E7%B5%84/%E5%AD%B8%E7%94%9F%E7%94%9F%E6%B4%BB%E4%BA%8B%E5%8B%99/%E4%BC%91%E9%80%80%E5%AD%B8%E6%9A%A8%E7%A0%94%E7%A9%B6%E7%94%9F%E7%95%A2%E6%A5%AD%E9%80%80%E8%B2%BB/%E4%BC%91-%E9%80%80-%E5%AD%B8%E9%80%80%E8%B2%BB%E6%A8%99%E6%BA%96)】項下參考其退費相關標準。\n\n相關法規與表單\n\n[國立政治大學學則第十三條、第四十一條、第四十二條、第四十二條之一、第四十三條規定](https://aca.nccu.edu.tw/download/rulesdata/law01A.pdf)\n\n[休學/保留學籍申請書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-02)\n\n[提早復學申請書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-04)\n\n[各項證明文件申辦委託書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-02-05)\n\n116011台北市文山區指南路二段64號 行政大樓四樓 聯絡我們", "counted": true}, {"index": 2, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 1223 字，標題: 休(退)學退費標準，subdomain: osa", "chars": 1412, "text": "get_page 取得 1223 字，標題: 休(退)學退費標準，subdomain: osa\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://osa.nccu.edu.tw/tw/生活事務暨僑生輔導組/學生生活事務/休退學暨研究生畢業退費/休-退-學退費標準]\n\n全文：\n[休(退)學退費標準](https://osa.nccu.edu.tw/tw/生活事務暨僑生輔導組/學生生活事務/休退學暨研究生畢業退費/休-退-學退費標準)\n\n 發佈: 2015年06月02日                    \n\n 點擊數: 102075                        \n\n法令依據: 依據教育部專科以上學校學雜費收取辦法第15條之專科以上學校學雜費退費基準表辦理。\n\n休 ( 退 ) 學日程\n\n退費標準\n\n繳費截止日(含)前完成休(退)學程序。\n\n學雜費全額退費(不含學生平安保險費)\n\n ( 宿費等退費請詳閱注意事項 4 、 5 、 6)\n\n繳費截止日次日起至學期1 / 3退費基準日完成休(退)學程序。\n\n退2 / 3學雜費 (不含學生平安保險費)\n\n ( 宿費等退費請詳閱注意事項 4 、 5 、 6)\n\n學期1 / 3退費基準日次日起至學期2 / 3退費基準日(含)完成休(退)學程序。\n\n退1 / 3 學雜費(不含學生平安保險費)\n\n ( 宿費等退費請詳閱注意事項 4 、 5 、 6)\n\n逾學期2 / 3退費基準日申請休(退)學。\n\n學雜費全數不予退還。\n\n注意事項：\n\n1.學生於繳費截止日前辦理休(退)學，不需繳費，直接辦理即可。但休學且欲參加學生平安保險者，需繳交平安保險費，並影印繳費單據乙份給生僑組學生平安保險承辦人 (除退費外，休(退)學相關問題請洽行政大樓四樓教務處註冊組，代表分機 63279)。\n\n2.學生未於本校登錄入帳帳戶者，請攜帶本人第一銀行或郵局帳戶至行政大樓五樓總務處出納組登錄，以利辦理退費(登錄帳戶及入帳相關問題請洽總務處出納組，分機62123)。\n\n3.學生完成休(退)學程序後，學務處生僑組將依註冊組學籍資料及出納組繳費資料主動退費，學生不需親自到生僑組辦理，退費款項會直接匯入學生第一銀行或郵局帳戶。(退費款項不含宿費、住宿保證金、僑生及外籍生健保費，另學生於休學當學期繳交平安保險費仍受學生團保之保障，故平安保險費不退費)。\n\n4.宿費及住宿保證金退費，請填妥退宿申請表，並至宿舍區檢查寢室後，再到行政大樓三樓學務處住宿組辦理退費(宿舍相關退費問題，大學部請洽分機62222，研究所請洽分機63251)。\n\n5.僑生、外籍生健保費退費請分別至學務處生僑組(分機63013)、國合處國際教育組(分機62040)辦理。\n\n6.退費基準日依據本校各學年行事曆日程辦理。\n\n學務處意見信箱： nccuosa@nccu.edu.tw 總機電話：02-29393091 緊急事件通聯窗口（24小時） 學安、校安中心 0919099119, 校內分機 66119 駐警隊 02-29387129, 校內分機 66110 地址：台北市文山區指南路二段64號 行政大樓三樓 Copyright © 2019 國立政治大學學務處. All Rights Reserved.", "counted": true}, {"index": 3, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 1799 字，標題: 各組聯絡資訊，subdomain: www.lib", "chars": 1980, "text": "get_page 取得 1799 字，標題: 各組聯絡資訊，subdomain: www.lib\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://www.lib.nccu.edu.tw/p/404-1000-312.php?Lang=zh-tw]\n\n全文：\n各組聯絡資訊\n\n\t字體大小調整\n\t[小](javascript:void(0);)\n[中](javascript:void(0);)\n[大](javascript:void(0);)\n\n您的瀏覽器不支援JavaScript功能，若網頁功能無法正常使用時，請開啟瀏覽器JavaScript狀態\n\n☎️政大總機：(02)29393091\n\n總圖 63222，綜圖 50107，商圖 84006，傳圖 67152\n\n達賢圖：(02)82377017\n\n🖥️電子資料庫、電子期刊、Turnitin等相關問題，請於週一至週五9:00-17:00洽推廣諮詢組：(02)82377066\n\n館名\n\n單位\n\n直撥電話\n\n校內分機\n\n傳真\n\ne-mail\n\n主要業務\n\n中正\n\n\t\t\t圖書館\n\n典藏閱覽組\n\n[(02)2938-7878](tel:+886229393091)\n\n63222\n\n(02)2939-0272\n\n圖書借還、指定參考書、跨校借書證、全國文獻傳遞、紙本期刊、閱覽服務、場地借用服務等\n\n知識組織組\n\n[(02)2938-7091](tel:+886229387091)\n\n67091\n\n(02)2938-7187\n\n各種資源之分編、學位論文系統管理、學術期刊全文電子檔及機構典藏系統管理等\n\n資源徵集組\n\n[(02)2938-7092](tel:+886229387092)\n\n67092\n\n(02)2938-7272\n\n圖書經費分配與管理、圖書/ 請書逕送回原系所並通知學生）。\n3. 雙方同意後送**教務處複核**：註冊組承辦人擬核准，再由註冊組組長、教務長審核。聯絡人：註冊組組長王揚忠（分機 63273），註冊組在行政大樓四樓。\n\n辦理規定：\n- 要在修業第二學年開始前申請，以一次為限。\n- 申請期間：上學期為 12 月 1 日至 12 月 31 日，下學期為 6 月 1 日至 6 月 30 日。\n- 一般研究所學生與在職專班學生不得互轉；有學籍分組的系所可以申請轉組。\n- 轉所規定由各所自訂，明列於修業規定中。\n- 申請轉所的當學期不得休學；核准後如果辦理休學，轉所自始無效。\n- 核准後不得再申請更改或轉回原所。\n- 轉所於新學期生效；生效後二週內要填寫學分認定申請書（https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-05-06）並附成績單，送轉入系所審核。\n- 申請書是「碩士班轉系所申請書」，表單編號 QP-T01-05-05，下載連結：https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-05-05\n- 各所錄取轉所名額以當學年度核定招生名額的一成為原則；陸生轉所要在部定陸生總名額內流用；甄試入學的學生、外國學生、僑生是否能轉所由各系所自行規範。", "references": [{"index": 1, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 2252 字，標題: 轉系，subdomain: aca", "chars": 2443, "text": "get_page 取得 2252 字，標題: 轉系，subdomain: aca\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://aca.nccu.edu.tw/zh/服務項目/學籍/轉系]\n[偵測到表單編號: QP-T01-05-05, QP-T01-05-06]\n\n全文：\n轉系/轉所\t\t\t\n\n \n\n學士班轉系事宜\n\n申請資格、時間與程序\n\n[115學年度學生轉系（組）相關事項公告](https://aca.nccu.edu.tw/db/upload/115學年度學士班學生轉系(組) 相關事項公告.pdf)\n\n[轉系申請系統_學生操作說明](https://aca.nccu.edu.tw/download/Rgr_file/tranfer/轉系申請系統_學生端操作說明_2024v2.pdf)\n\n[傳播學院大一大二不分系申請轉系作業原則及注意事項](https://aca.nccu.edu.tw/db/upload/傳院不分系轉系作業.pdf)\n\n申請標準\n\n[115學年度學生轉系（組）標準表](https://aca.nccu.edu.tw/download/Rgr_file/tranfer/115學年度學士班學生轉系（組）標準表.pdf)\n\n錄取名單與注意事項\n\n1.[115學年度學士班核准轉系(組)學生注意事項](https://aca.nccu.edu.tw/db/upload/115學年度學士班轉系(組)學生注意事項.pdf)\n\n2.[115學年度學士班核准轉系(組)學生錄取名單](https://aca.nccu.edu.tw/db/upload/115學年度學士班轉系(組)錄取名單_公告版.pdf)\n\n相關法規與表單\n\n[國立政治大學學則第三十七條規定](https://aca.nccu.edu.tw/download/rulesdata/law01A.pdf)\n\n[國立政治大學學士班學生轉系規則](https://aca.nccu.edu.tw/download/rulesdata/law11A.pdf)\n\n[學士班未成年學生申請轉系法定代理人同意書](https://aca.nccu.edu.tw/db/upload/學士班未成年學生申請轉系法定代理人同意書.pdf)\n\n \n\n碩士班轉所事宜 \n\n申請資格\n\n碩士班（含在職專班）學生於修業第二學年開始前，經原肄業所及擬轉入所雙方主管同意，申請轉所，並以一次為限。一般研究所學生與在職專班學生不得互轉，系所經報教育部同意核備有學籍分組者得申請轉組。\n\n申請標準\n\n碩士班辦理轉系所之規定，由各系所自訂並明列於修業規定中；相關規定請參閱各系所修業規定。\n\n申請時間\n\n碩士班轉所申請為每學年12月1日至12月31日及6月1日至6月30日開放一年級學生提出申請，請學生參照系所是否同意轉出（轉入）及開放名額向系所遞交轉所申請表。\n\n申請程序\n\n學生填具「轉系所申請書」，於規定期間內提出申請，經原肆業所及擬轉入所雙方主管同意，送教務處複核後，學生原就讀系所應於每學期結束日前將表單正本送教務處註冊組據以處理學籍等後續事宜。\n\n學分認定\n\n轉所於新學期生效，學生應於轉所生效當學期開課日起二週內填寫「學分認定申請書」並附成績單，送轉入系所辦理學分認定審核。\n\n注意事項\n\n一、學生申請轉所當學期不得休學，若於申請核准後，辦理休學者，其轉所自始無效，且不得再申請轉所。轉所核准後，學生應依轉所後註冊當學年度之必修科目表修習，並不得再申請更改或轉回原所。\n\n二、依據96學年度第一學期第2次教務會議決議，基於尊重各系所之個別考量，碩士班甄試管道入學之學生、外國學生、僑生（含港澳生）是否得以轉系所，由各系所自行規範。\n\n三、依據教育部102年10月15日臺教高通字第1020149833號函釋，陸生轉系所應在當學年度部定招收陸生之總名額及系所範圍內辦理流用。\n\n四、新（系所）學籍於次學期生效。\n\n五、學生證請於次學期開學日起至教務處註冊組系所櫃檯處理更新名條。\n\n相關法規與表單\n\n[國立政治大學學則第三十七條之一規定](https://aca.nccu.edu.tw/download/rulesdata/law01A.pdf)\n\n[114學年度第2學期碩士班轉系所名額及辦理轉系所相關事宜](https://aca.nccu.edu.tw/download/Rgr_file/tranfer/master/1152800010_抄.pdf)\n\n[114學年度第2學期碩士班轉系所名額表](https://aca.nccu.edu.tw/download/Rgr_file/tranfer/master/附件一轉所名額1142.pdf)\n\n[114學年度第2學期碩士班陸生轉系所名額表（115.6.15更新）](https://aca.nccu.edu.tw/download/Rgr_file/tranfer/master/附件二陸生轉所名額1142-更新陸生1150615.pdf)\n\n[碩士班轉系所申請書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-05-05)\n\n[碩士轉系所學分認定申請書](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-05-06)\n\n \n\n[轉校(跨校轉系、所)](https://aca.nccu.edu.tw/zh/專區業務/newbie-2/149-轉校-跨校轉系、所/4962-跨校轉系所)\n\n116011台北市文山區指南路二段64號 行政大樓四樓 聯絡我們", "counted": true}, {"index": 2, "role": "HumanMessage", "tool": null, "title": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]", "chars": 3027, "text": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]\n\nget_form 取得表單 碩士班轉系所申請書 / Master Student Application Form for Institute Transfer\n[live:src status=snapshot kind=form checked= snap=2026-08 tls=0 url=https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-05-05]\n\n全文：\n表單編號：QP-T01-05-05\n保存年限：1年~學生畢業\n( 版本：112年11月)\n\n| 國立政治大學碩士班轉系所申請書 申請學年學期： 學年 學期 填表日期： 年 月 日 |  |  |  |  |  |  |  |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 學 號 | 姓 名 |  |  | 聯絡電話 |  | 學生身份別 |  |\n|  |  |  |  |  |  | 台生 陸生 僑(港澳)生外籍生 |  |\n| 原就讀系所
