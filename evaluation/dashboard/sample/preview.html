n\n \n\n \n\n依本校109學年度第2學期第1次教務會議決議，本校加入台聯大合作辦理學士班跨校雙主 修輔系作業，碩博士班不開放雙主修及輔系(含本校生跨校)。\n\n本校自111學年度起參加台聯大修讀雙主修輔系相關作業。\n\n \n\n \n\n \n\n(一)申請原則：僅限申請修讀與本系性質不同之學系，並須經所屬及申請修讀之校系雙方同意。性質之認定由學生所在學校及申請雙主修及輔系之學校相關學系認定。\n\n \n\n \n\n \n\n(二)申請資格：學士班以一年級下學期起至三年級止，學生得申請台聯大跨校雙主修及輔系，且申請學生當學期須註冊在學。\n\n \n\n \n\n \n\n(三)作業期間：原則每年5月底公告相關訊息，並於7月接受申請，8月下旬公布榜單。\n\n \n\n \n\n \n\n(四)修讀、放棄、學分採計及取得資格證書之呈現依本校修讀雙主修、輔系辦法規定辦理。\n\n     ※本校學生跨校修讀雙主修不得以他校雙主修學系畢業※\n\n \n\n \n\n \n\n相關法規： [台灣聯合大學系統學生跨校修讀雙主修辦法](https://aca.nccu.edu.tw/db/upload/%E5%8F%B0%E7%81%A3%E8%81%AF%E5%90%88%E5%A4%A7%E5%AD%B8%E7%B3%BB%E7%B5%B1%E5%AD%B8%E7%94%9F%E8%B7%A8%E6%A0%A1%E4%BF%AE%E8%AE%80%E9%9B%99%E4%B8%BB%E4%BF%AE%E8%BE%A6%E6%B3%95.pdf)、[台灣聯合大學系統學生跨校修讀輔系辦法](https://aca.nccu.edu.tw/db/upload/%E5%8F%B0%E7%81%A3%E8%81%AF%E5%90%88%E5%A4%A7%E5%AD%B8%E7%B3%BB%E7%B5%B1%E5%AD%B8%E7%94%9F%E8%B7%A8%E6%A0%A1%E4%BF%AE%E8%AE%80%E8%BC%94%E7%B3%BB%E8%BE%A6%E6%B3%95.pdf)\n\n \n\n115學年度台灣聯合大學系統學士班學生跨校修讀輔系雙主修申請資訊公告\n\n(一)申請時間：\n\n115年7月1日(三)至115年7月23日(四)下午5點截止。\n\n非上班時間、例假日、本校共同暑休日及逾期後皆不受理收件。\n\n審查結果公告日期：115年8月31日(一)\n\n(二)[115學年度國立政治大學接受台灣聯合大學系統學生申請跨校雙主修輔系學系一覽表](https://aca.nccu.edu.tw/db/upload/115學年度國立政治大學接受台灣聯合大學系統學生申請跨校雙主修輔系學系一覽表.pdf)\n\n \n\n(三)台聯大他校雙主修、輔系資訊\n\n　(1) [國立中央大學](https://pdc.adm.ncu.edu.tw/p/412-1019-1935.php?Lang=zh-tw)\n\n　(2) [國立清華大學](https://registra.site.nthu.edu.tw/p/406-1211-307945,r219.php?Lang=zh-tw)\n\n　(3) [國立陽明交通大學](https://reurl.cc/X291zg)\n\n(四)\n\n依112年12月4日台灣聯合大學系統112年度第3次四校教務長會議決議：凡通過台聯大系統轉校生可否保留原申請台聯大系統跨校輔系、雙主修資格，應由學生重新向轉入學校學系申請，再由轉入學校發文通知加修學校重啟審查作業。\n\n請務必於跨校雙輔核准名單公佈後一週內提出申請，逾期不再受理。\n\n例：小華原為A大學生，通過台聯大系統轉校，轉至清華大學。後因小華在A大時，曾申請台聯大系統跨校輔系、雙主修，目前已通過取得修習B大輔系、雙主修資格。但小華已轉出A大，應於跨校輔系、雙主修核准名單公佈後一週內重新向轉入學校（清大）申請，再由清大發文給欲加修學校重啟審查。\n\n(五)表格下載\n\n[台灣聯合大學系統學士班學生跨校修讀輔系/雙主修申請表](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-04-21)\n\n[台灣聯合大學系統學士班學生放棄跨校修讀輔系/雙主修申請表](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-04-22)\n\n[台灣聯合大學系統學士班學生跨校修讀輔系/雙主修畢業資格審查表](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-04-23)\n\n \n\n114學年度台聯大系統跨校修讀雙主修輔系申請結果公告\n\n核定名單如[附件](https://aca.nccu.edu.tw/db/upload/114學年台聯大系統學校學生跨校修讀本校雙主修輔系申請案-核定結果(去識別化公告名單).pdf)，後續請同學依校際選課程序辦理選課事宜。\n\nThe approved list of Inter-School Academic Minors/Inter-School Academic Double Majors under the University System of Taiwan (UST) in Academic Year 2025\n\nThe approved list is [attached](https://aca.nccu.edu.tw/db/upload/114學年台聯大系統學校學生跨校修讀本校雙主修輔系申請案-核定結果(去識別化公告名單).pdf)(pdf), please follow the  inter-university  course selection procedures for course registration.\n\n \n\n114學年度台聯大系統跨校修讀雙主修輔系申請結果公告\n\n核定名單如[附件](https://aca.nccu.edu.tw/db/upload/114學年本校學生跨校修讀台聯大系統學校雙主修輔系申請案-核定結果(去識別化公告名單).pdf)，後續請同學依校際選課程序辦理選課事宜。\n\nThe approved list of Inter-School Academic Minors/Inter-School Academic Double Majors under the University System of Taiwan (UST) in Academic Year 2025\n\nThe approved list is [attached](https://aca.nccu.edu.tw/db/upload/114學年本校學生跨校修讀台聯大系統學校雙主修輔系申請案-核定結果(去識別化公告名單).pdf)(pdf), please follow the inter-university course selection procedures for course registration.\n\n116011台北市文山區指南路二段64號 行政大樓四樓 聯絡我們", "counted": true}, {"index": 2, "role": "HumanMessage", "tool": null, "title": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]", "chars": 4798, "text": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]\n\nget_form 取得表單 台灣聯合大學系統學士班學生跨校修讀輔系雙主修申請表\n[live:src status=snapshot kind=form checked= snap=2026-08 tls=0 url=https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-04-21]\n\n全文：\n台灣聯合大學系統學士班學生跨校修讀輔系/雙主修申請表\n【說明】\n1. 依台灣聯合大學系統公告時間受理申請。相關規定請詳閱台灣聯合大學系統學生跨校修讀輔系/雙主修辦法。\n2. 台聯大學生跨校修讀輔系及雙主修之上限(含校內輔系及雙主修)為一個雙主修及二個輔系。前項申請限加修不同性\n質之學系為輔系或雙主修。學生亦不得申請同一學系為輔系及雙主修(如在學期間同時申請加修A大中文系為輔系及\n雙主修)，以及不得申請兩校同一學系(或性質相近)為輔系及雙主修或兩個輔系(如在學期間申請加修A大中文系雙主\n修或輔系，又同時申請加修B大中文系為輔系)。\n3. 審查結果由註冊組公告於註冊組網頁，請學生於公告時間自行至網頁查詢。\n4. 申請修讀經核准後，符合主修學系畢業資格但尚未修滿輔系或雙主修規定學分，欲放棄修讀者，請填寫「台灣聯合\n大學系統學士班學生放棄跨校修讀輔系/雙主修申請表」，逕送原就讀學校辦理。\n5. 修滿規定學分者，請填寫「台灣聯合大學系統學士班學生跨校修讀輔系/雙主修畢業資格審查表」，併同歷年成績單，依\n表單所列程序審核後，送註冊組彙整並     { id: 'irr',   page: 'cir',   group: 'Keypoint outcome', label: 'Irrel', low: true, get: function (r) { return r.irrelevance; }, tip: function (r) { var c = kpCounts(r); return c ? c.irr + ' / ' + c.total + ' keypoints not stated' : ''; } },
    { id: 'cl_p',  page: 'claim', group: 'Claim', label: 'P',  get: function (r) { return r.claim ? r.claim.precision : null; }, tip: function (r) { return r.claim ? r.claim.correct + ' / ' + r.claim.claims + ' claims' : ''; } },

  /* ---------- metric guide (right-hand drawer) ---------- */
  var EX = {

  function claimList(a) {
    return '<ul>' + a.claims.map(function (c) {
      var tag = c[2] === 'ok' ? '<span class="chip relevant">states a gold fact</span>' : (c[2] === 'wrong' ? '<span class="chip wrong">states it wrongly</span>' : '<span class="chip irrelevant">not a gold fact</span>');
      var un = a.unsupported && a.unsupported.indexOf(c[0]) >= 0 ? ' <span class="chip unsupported">no evidence</span>' : '';
      return '<li>' + c[0] + ' ' + esc(c[1]) + ' ' + tag + un + '</li>';
    }).join('') + '</ul>';
  }
  var A = EX.wrong, B = EX.partial, ca = cnt(A), cb = cnt(B);
  var PAGES = [
    { key: 'kp', title: 'Keypoint P / R / F1', short: 'Keypoint P/R/F1',
      what: 'Of the gold facts (keypoints), how many did the answer state correctly, and how many of the facts it touched were right?',
      formula: 'P = relevant / (relevant + wrong)\nR = relevant / all keypoints\n    (R is also called Completeness)\nF1 = 2PR / (P + R)',
      example: '<div class="exh">' + EX.question + ' &mdash; ' + A.name + '</div>' + kpList(A) + '<div class="calc">relevant ' + ca.relevant + ', wrong ' + ca.wrong + ', not stated ' + ca.irrelevant + ' (7 keypoints)<br>P = ' + ca.relevant + ' / ' + (ca.relevant + ca.wrong) + ' = ' + fx(ca.relevant, ca.relevant + ca.wrong) + '<br>R = ' + ca.relevant + ' / 7 = ' + fx(ca.relevant, 7) + '<br>F1 = 0.714</div>',
      read: 'R: how much of the gold was covered. P: how reliable the stated facts were. F1 needs both.',
      trap: '<b>Precision alone is misleading.</b> ' + B.name + ' states only K1 and K2 (both right):<ul><li>P = 2 / 2 = 1.000</li><li>R = 2 / 7 = ' + fx(2, 7) + '</li><li>F1 = 0.444</li></ul>Perfect P, yet five of seven facts are missing.',
      src: 'Claude Code judges each keypoint (stage 3). Needs the isolated trace first.' },
    { key: 'cir', title: 'Hallucination / Irrelevance (and Completeness)', short: 'Hallu / Irrel',
      what: 'Of the gold keypoints, what share did the answer state wrongly, and what share did it not state at all?',
      formula: 'Hallucination = wrong / keypoints\nIrrelevance = not stated / keypoints\nCompleteness = relevant / keypoints\n    (the same number as Keypoint R)',
      example: '<div class="exh">' + EX.question + '</div><p><b>' + A.name + '</b>: ' + ca.relevant + ' relevant, ' + ca.wrong + ' wrong, ' + ca.irrelevant + ' not stated &rarr; Completeness / Hallucination / Irrelevance = <span class="calc">0.714 / 0.286 / 0.000</span></p><p><b>' + B.name + '</b>: ' + cb.relevant + ' relevant, ' + cb.wrong + ' wrong, ' + cb.irrelevant + ' not stated &rarr; <span class="calc">0.286 / 0.000 / 0.714</span></p>',
      read: 'The three add up to 1 (conditional keypoints that do not apply are left out). For Hallucination and Irrelevance lower is better.',
      trap: 'One mistake can turn several keypoints wrong at once, so Hallucination can be larger than the number of errors you would count by eye.',
      src: 'Claude Code judges each keypoint (stage 3).' },
    { key: 'claim', title: 'Claim P / R / F1', short: 'Claim P/R/F1',
      what: 'Of everything the answer says, how much correctly states a gold fact? This measures focus, not only correctness.',
      formula: 'P = claims that correctly state a keypoint / all claims\nR = relevant keypoints / all keypoints (same as Keypoint R)\nF1 = 2PR / (P + R)',
      example: '<div class="exh">' + EX.question + ' &mdash; ' + A.name + '</div>' + claimList(A) + '<div class="calc">9 claims: 6 correct, 2 wrong, 1 extra<br>P = 6 / 9 = 0.667<br>R = 5 / 7 = 0.714<br>F1 = 0.690</div>',
      read: 'Low P means the answer carries claims that do not map to a correct gold fact: wrong ones or extra ones.',
      trap: 'Extra but true information (c9) also lowers P. It is a focus measure. Whether c9 is supported by evidence is the job of Evidence Support.',
      src: 'Claude Code links claims to keypoints (stage 3), using the isolated trace.' },
    { key: 'evid', title: 'Evidence Support', short: 'Evidence Support',
      what: 'For each statement in the answer, is there text the system actually read that supports it?',
      formula: 'Evidence Support = supported claims / all claims',
      example: '<div class="exh">' + EX.question + ' &mdash; ' + A.name + '</div>' + claimList(A) + '<div class="calc">c1 (24) and c5 (30) have no support in what the system read<br>7 / 9 = 0.778</div>',
      read: 'High means the answer stays within what the system read. It is the only metric that also checks statements the gold does not list.',
      trap: 'A short answer can be fully supported and still incomplete: ' + B.name + ' scores 2 / 2 = 1.000 here but Keypoint R 0.286. Read it together with Keypoint R.',
      src: 'An isolated subagent traces every claim to a quote (stage 3); a program verifies that each quote is in the evidence.' },
    { key: 'acc', title: 'Accuracy (rule-based, hard facts only)', short: 'Accuracy',
      what: 'Of the exact values the answer must contain (numbers, links, extensions, floors), how many does it contain correctly? This is a recall over the hard facts, checked by a program, not by Claude.',
      formula: 'Accuracy = hard facts matched / hard facts',
      example: '<div class="exh">' + EX.question + ' &mdash; ' + A.name + '</div>Hard facts (a value the answer must contain): K1, K2, K3, K6, K7 = 5 of the 7 keypoints. K4 and K5 are worded facts, so the rule does not count them.<ul><li>K1 wants 25, answer says 24 &rarr; miss</li><li>K2 wants 31, answer says 31 &rarr; hit</li><li>K3 wants 28, answer says 30 &rarr; miss</li><li>K6 wants 12, answer says 12 &rarr; hit</li><li>K7 wants 10, answer says 10 &rarr; hit</li></ul><div class="calc">3 / 5 = 0.600   (Keypoint R is 5 / 7: it also counts K4 and K5)</div>',
      read: 'High means the exact values are present and not contradicted. It is a cheap cross-check of Keypoint R: on the hard facts, Claude and the rule should agree.',
      trap: 'Only hard facts count (5 of 7 keypoints here, 4 of 21 in some questions). A wrong value and a missing value are both a miss. It can be fooled when the right string appears somewhere else: "輔系上限 25 學分" contains 25學分, so K1 looks matched.',
      src: 'Rule program, no LLM. Available right after the run (stage 2).' },
    { key: 'rouge', title: 'Surface Similarity (ROUGE-L)', short: 'ROUGE-L',
      what: 'How similar is the wording of the answer to the gold answer text?',
      formula: 'ROUGE-L = F-score of the longest common subsequence\n(Chinese text cut into words with jieba)',
      example: '<div class="exh">' + EX.question + '</div><p><b>' + A.name + '</b> (two wrong numbers): P 0.509, R 0.773, F <span class="calc">0.614</span></p><p><b>' + B.name + '</b> (two right facts only): P 0.800, R 0.213, F <span class="calc">0.337</span></p>',
      read: 'A rough check that the answer is in the same shape as the gold. It never tells right from wrong.',
      trap: 'The answer with wrong numbers (0.614) scores higher than the short correct one (0.337). Do not read it as quality.',
      src: 'Program, no LLM. Available right after the run (stage 2).' },
    { key: 'retr', title: 'Retrieval (Context Sentence / Words P / R / F1)', short: 'Retrieval',
      what: 'Did the text the system read contain the source passages the gold answer needs?',
      formula: 'R = gold source sentences (words) found in the read text / all gold source sentences (words)\nP = the share of the read text that is gold source\nF1 = 2PR / (P + R)',
      example: '<div class="exh">' + EX.question + '</div><p>Sentences: R <span class="calc">1.000</span>, P 0.014, F1 0.028</p><p>Words: R <span class="calc">0.985</span>, P 0.028, F1 0.055</p><p>Both answers read the same pages, so these numbers are the same for ' + A.name + ' and ' + B.name + '. Open a question and look at its Ground Truth References: every &#x2717; is a gold passage the system did not read.</p>',
      read: 'R is the one to look at: low R means the system never read what it needed (a retrieval failure, not a writing failure).',
      trap: '<b>P and F1 are always small</b>: the system reads whole pages and only a few sentences are gold. They get the same colors as the rest but only mean something when you compare runs (for example BM25 only vs grep only).',
      src: 'Program, no LLM. Available right after the run (stage 2).' }
  ];
  function pageHtml(p) {
    return '<h3>' + esc(p.title) + '</h3><p class="what">' + p.what + '</p><h5>Formula</h5><div class="formula">' + esc(p.formula) + '</div><h5>Worked example</h5><div class="ex">' + p.example + '</div>' +
      '<h5>How to read it</h5><p>' + p.read + '</p><h5>Common trap</h5><div class="trap">' + p.trap + '</div><h5>Where it comes from</h5><p>' + p.src + '</p>';
  }
  var drawer = document.getElementById('drawer'), pagesEl = document.getElementById('pages'), lastFocus = null;
  pagesEl.innerHTML = PAGES.map(function (p) { return '<button type="button" class="pagebtn" data-page-key="' + p.key + '">' + esc(p.short) + '</button>'; }).join('');
  function markColumns() {                                         // highlight the matching table columns without redrawing the table
    Array.prototype.forEach.call(document.querySelectorAll('#results-table [data-page]'), function (el) { el.classList.toggle('hl', activePage != null && el.getAttribute('data-page') === activePage); });
    Array.prototype.forEach.call(pagesEl.children, function (b) { if (b.getAttribute('data-page-key') === activePage) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
  }
  function openHelp(key) {
    var p = PAGES.filter(function (x) { return x.key === key; })[0] || PAGES[0], wasOpen = drawer.classList.contains('open');
    activePage = p.key;
    var body = document.getElementById('drawer-body'); body.innerHTML = pageHtml(p); body.scrollTop = 0;
    if (!wasOpen) { lastFocus = document.activeElement; drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false'); document.getElementById('help-close').focus({ preventScroll: true }); }
    markColumns();
  }
  function closeHelp() {
    drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); activePage = null; markColumns();
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
  }
  document.getElementById('help-open').addEventListener('click', function () { openHelp(activePage || 'kp'); });
  document.getElementById('help-close').addEventListener('click', closeHelp);
  pagesEl.addEventListener('click', function (e) { var b = e.target.closest('[data-page-key]'); if (b) openHelp(b.getAttribute('data-page-key')); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drawer.classList.contains('open')) closeHelp(); });
  document.addEventListener('click', function (e) {              // click outside the guide closes it; the table stays usable
    if (!drawer.classList.contains('open')) return;
    var path = e.composedPath ? e.composedPath() : [];
    if (path.indexOf(drawer) >= 0 || path.indexOf(document.getElementById('help-open')) >= 0) return;
    if (e.target.closest && (e.target.closest('[data-card-page]') || e.target.closest('#app') || e.target.closest('.seg'))) return;
    closeHelp();
  });

  /* ---------- start ---------- */
  var initial = parseJsonl(document.getElementById('initial-data').textContent);
  if (initial.length) setRows(initial, 'Embedded sample (' + initial.length + ' questions)'); else render();
})();
</script>
