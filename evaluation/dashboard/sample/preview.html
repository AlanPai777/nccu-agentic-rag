 "snapshot", "as_of": "2026-08（output/ 快照）", "url": "https://osa.nccu.edu.tw/tw/住宿輔導組/宿舍申請與床位資訊/退離宿程序"}, {"kind": "live", "as_of": "2026-11-13（現場）", "url": "https://osa.nccu.edu.tw/tw/住宿輔導組/宿舍申請與床位資訊/退離宿程序"}], "keypoints": ["K18"], "found": true}]}, "prediction": {"content": "搬離宿舍退還住宿保證金的流程：\n\n1. 填寫「離宿暨退還住宿保證金申請表」（表單編號 QP-M03-01-05，下載連結：https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-M03-01-05）。\n2. 先到住宿組（行政大樓二樓）辦理退宿，**之後**再請宿舍服務台檢查寢室。\n3. 檢查寢室後一個月內，持表到住宿組。聯絡人：陳哲良（分機 62223）。\n4. 款項會直接領現金。\n\n- 住宿保證金是 500 元。\n- 沒有依程序辦理的人，保證金可以退一半。", "references": [{"index": 1, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 1446 字，標題: 退離宿程序，subdomain: osa", "chars": 1637, "text": "get_page 取得 1446 字，標題: 退離宿程序，subdomain: osa\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://osa.nccu.edu.tw/tw/住宿輔導組/宿舍申請與床位資訊/退離宿程序]\n[偵測到表單編號: QP-M03-01-05]\n\n全文：\n[退離宿程序](https://osa.nccu.edu.tw/tw/住宿輔導組/宿舍申請與床位資訊/退離宿程序)\n\n 發佈: 2015年04月17日                    \n\n 點擊數: 90004                        \n\n►學期前退宿(取消/放棄下學期之住宿權)\n\n[請下載填寫：「退宿申請表」](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-M03-01-04)\n\n適用對象：\n\n1. 未進住之新住宿生，開學前申請退宿。\n\n2. 舊住宿生，學期(或暑期)住宿開始日前，申請取消下一學期或暑宿之續住申請，目前仍住宿中。\n\n \n\n►申請流程\n\n填寫列印「退宿申請表一學期前」\n\n↓\n\n至宿舍組辦理退宿註記、換註冊繳費單或退費\n\n註：已繳交暑宿費用者，如不擬住宿，應於暑宿開始前檢附繳費收據，至宿舍輔導組辦理全額退費。「宿費繳費收據」若遺失，可至iNccu補印。\n\n \n\n \n\n►離宿暨退還「住宿保證金」 (學期中/末 搬離宿舍)\n\n[請下載填寫： 『退離宿暨退還「住宿保證金」申請表』](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-M03-01-05)\n\n適用對象：申請退離宿暨退還「住宿保證金」者\n\n►作業流程\n\n學期中\n\n填寫列印『離宿暨退還「住宿保證金」申請表』\n\n↓\n\n 持上表 至宿舍服務台(檢查寢室簽章)\n\n↓\n\n三天內持上表及「宿費繳費收據」至住宿組(行政大樓3樓)， 辦理退宿註記、退宿費或住宿保證金\n\n學期末\n\n填寫列印『離宿暨退還「住宿保證金」申請表』\n\n↓\n\n 持上表 至宿舍服務台(檢查寢室簽章)\n\n \n\n註：\n\n僅退住宿保證金者可不交宿費收據；「宿費繳費收據」若遺失，可至iNccu補發。\n\n由住宿組造冊匯入同學(於政大網頁-在校學生-個人基本資料)登記之帳戶。\n\n期末規定離宿日前一週內離宿者，本表可交由「宿舍區服務中心/服務台」轉交。\n\n僑生及外籍生因離宿後即出國、帳戶已結清無法領取者，另再填『申請退還「住宿保證金」匯入代理人申請表』辦理，外籍交換生請向相關系所辦理退還「住宿保證金」。\n\n \n\n \n\n \n\n►僑生及外籍生(含訪問研究生)，如需將住宿保證金匯入代領人帳戶\n\n[請下載填寫相關領據](https://osa.nccu.edu.tw/files/10781882205edd9d46b756b.pdf) (另開視窗)\n\n適用對象：  \n\n若離宿後即回國，台灣國內帳戶已結清、無法領取住宿保證金之僑外生，或在台無帳戶之外籍生者。可於離宿前申請將住宿保證金匯入代領人帳戶。\n\n申請流程：\n\n填寫上述相關領據\n\n※需本人簽名\n\n↓\n\n持上表至相關系所辦理\n\n註：搬離宿舍時，仍須依上述退離宿程序列印「住宿生退離宿暨退還「住宿保證金」申請表」辦理。\n\n學務處意見信箱： nccuosa@nccu.edu.tw 總機電話：02-29393091 緊急事件通聯窗口（24小時） 學安、校安中心 0919099119, 校內分機 66119 駐警隊 02-29387129, 校內分機 66110 地址：台北市文山區指南路二段64號 行政大樓三樓 Copyright © 2019 國立政治大學學務處. All Rights Reserved.", "counted": true}, {"index": 2, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 52666 字，標題: faq，subdomain: osa", "chars": 52814, "text": "get_page 取得 52666 字，標題: faq，subdomain: osa\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://osa.nccu.edu.tw/tw/faq]\n\n全文：\n[學務FAQ](https://osa.nccu.edu.tw/tw/faq)\n\n 發佈: 2015年06月10日                    \n\n 點擊數: 279946                        \n\n常見問題類型一覽表\n\n[學生權益處理](https://osa.nccu.edu.tw/tw/faq#學生權益處理)\n\n[碩、博士班宿舍](https://osa.nccu.edu.tw/tw/faq#碩、博士班宿舍)\n\n[外傷處理](https://osa.nccu.edu.tw/tw/faq#外傷處理)\n\n[學士班宿舍](https://osa.nccu.edu.tw/tw/faq#學士班宿舍)\n\n[場地租借](https://osa.nccu.edu.tw/tw/faq#場地租借)\n\n[藝文活動](https://osa.nccu.edu.tw/tw/faq#藝文活動)\n\n[志工工作室](https://osa.nccu.edu.tw/tw/faq#志工工作室)\n\n[飲食衛生](https://osa.nccu.edu.tw/tw/faq#飲食衛生)\n\n[飲用水衛生](https://osa.nccu.edu.tw/tw/faq#飲用水衛生)\n\n[學生體檢](https://osa.nccu.edu.tw/tw/faq#學生體檢)\n\n[醫療用品借用](https://osa.nccu.edu.tw/tw/faq#醫療用品借用)\n\n[校外租屋](https://osa.nccu.edu.tw/tw/faq#校外租屋)\n\n[就學貸款](https://osa.nccu.edu.tw/tw/faq#就學貸款)\n\n[助學服務](https://osa.nccu.edu.tw/tw/faq#助學服務)　　　\n\n[學生團體保險](https://osa.nccu.edu.tw/tw/faq#學生團體保險)\n\n[弱勢學生助學金](https://osa.nccu.edu.tw/tw/faq#弱勢學生助學金)\n\n[學雜費減免](https://osa.nccu.edu.tw/tw/faq#學雜費減免)\n\n[急難救助](https://osa.nccu.edu.tw/tw/faq#急難救助)\n\n[失業勞工子女就學補助](https://osa.nccu.edu.tw/tw/faq#失業勞工子女就學補助)\n\n[陸生輔導事宜](https://osa.nccu.edu.tw/tw/faq#陸生輔導事宜)\n\n[課外組場地租借](https://osa.nccu.edu.tw/tw/faq#課外組場地租借)\n\n[獎學金](https://osa.nccu.edu.tw/tw/faq#獎學金)\n\n[服務資訊](https://osa.nccu.edu.tw/tw/faq#服務資訊)\n\n[【住宿期間】](https://osa.nccu.edu.tw/tw/faq#【住宿期間】)\n\n[職涯輔導](https://osa.nccu.edu.tw/tw/faq#職涯輔導)\n\n[課外組器材借用](https://osa.nccu.edu.tw/tw/faq#課外組器材借用)\n\n[導師制](https://osa.nccu.edu.tw/tw/faq#導師制)\n\n[臺北市立聯合醫院附設政大門診部](https://osa.nccu.edu.tw/tw/faq#臺北市立聯合醫院附設政大門診部)\n\n[學生兵役](https://osa.nccu.edu.tw/tw/faq#學生兵役)\n\n[僑生輔導事宜](https://osa.nccu.edu.tw/tw/faq#僑生輔導事宜)\n\n[軍訓教育](https://osa.nccu.edu.tw/tw/faq#軍訓教育)\n\n[校園安全](https://osa.nccu.edu.tw/tw/faq#校園安全)\n\n[預官輔考](https://osa.nccu.edu.tw/tw/faq#預官輔考)\n\n[學生社團](https://osa.nccu.edu.tw/tw/faq#學生社團)\n\n[服務學習](https://osa.nccu.edu.tw/tw/faq#服務學習)\n\n[大型活動](https://osa.nccu.edu.tw/tw/faq#大型活動)\n\n[性別平等](https://osa.nccu.edu.tw/tw/faq#性別平等)\n\n[學生申訴](https://osa.nccu.edu.tw/tw/faq#學生申訴)\n\n[宿舍設備及請修](https://osa.nccu.edu.tw/tw/faq#宿舍設備及請修)\n\n \n\n \n\n學生權益處理 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n有關宿舍、社團及學生權益相關問題欲提學生事務會議討論的程序？\n\n \n\n請與學生事務會議學生會、各院、研學會學生代表聯繫，代為提案。\n\n \n\n遇到宿舍、社團及學生權益相關問題尋求解答的途徑？\n\n \n\n可逕至行政大樓三樓學務長室、撥校內分機62200、上BBS(政大貓空）學務處交流版或使用學務處網站所設之信箱。\n\n \n\n辦妥休（退）學、畢業程序後，要如何退費？\n\n \n\n新生需先繳費註冊建立學籍後才能辦理休學，完成休（退）學、畢業程序後，學務處生僑組會主動辦理退費，款項直接匯入學生帳戶，學生不必到生僑組辦理（舊生亦由生僑組主動辦理退費）；新（舊）生辦理休（退）學、畢業時，請務必攜帶本人第一銀行或郵局帳號至總務處出納組登錄，以利退費，帳戶相關問題請洽詢出納組，校內分機62123。僑生、外籍生健保費及各項宿費退費請逕洽業管單位辦理（僑生請洽生僑組、外籍生請洽國合處，宿費請洽住宿組）。除休學退費外其他休學相關資訊請洽教務處註冊組詢問，代表分機63279。\n\n \n\n休(退)學退費標準為何？\n\n \n\n依教育部規定，繳費截止日(含)前完成休（退）學程序者，學雜費全額退費(不含學生平安保險費)；繳費截止日次日起至學期1/3退費基準日(含)完成休(退)學程序者，退2/3學雜費全額退費(不含學生平安保險費)；學期1/3退費基準日次日起至學期2/3退費基準日(含)完成休(退)學程序者，退1/3學雜費全額退費(不含學生平安保險費)；學期2/3退費基準日後完成休(退)學程序者，學雜費全數不予退費。\n\n \n\n研究生提前畢業退費標準為何？\n\n \n\n依教育部規定及教務處公告，註冊日之次日起至繳費截止日完成畢業離校程序者，學費、資訊設備費退還2/3、雜費全部退還、平安保險費不退還；繳費截止日次日起至學期1/3退費基準日完成畢業離校程序者，學費、資訊設備費及雜費退還2/3、平安保險費不退還；學期1/3退費基準日次日起至學期2/3退費基準日(含)完成畢業離校程程序者，學費、資訊設備費及雜費退還1/3、平安保險費不退還；逾學期2/3退費基準日完成畢業離校程序者，所繳費用不予退還。\n\n \n\n請問請假手續如何辦理？\n\n \n\n學生請假之假別分為病假、生理假、事假、公假、產假、原住民族歲時祭儀假六種。 \n\n學生請假應上網申請（路徑：iNCCU/學生資訊系統/資訊服務/學生請假系統），於線上填寫假單並確認送出假單後，列印假單並檢附相關證明，送請任課老師核可，並送所屬系所(學位學程)辦公室備查。\n\n \n\n請假需要什麼證明文件？\n\n \n\n事假：其事由以直系親屬、兄弟姊妹之婚喪或其他重大特殊情況為限。 \n\n 公假：須檢具派遣單位主管簽證之公假證明。 \n\n 病假與產假：須檢具政府立案的醫療院所之證明文件。 \n\n 產假的規定：分娩前得請產前假七日，得分次申請，不得保留至分娩後。於分娩後，得請娩假八週。懷孕滿五個月以上流產者，得請流產假六週；懷孕三個月以上未滿五個月流產者，得請流產假四週；懷孕未滿三個月流產者，得請流產假二週；懷孕未滿二個月流產者，得請流產假五日。娩假及流產假應一次請畢。\n\n 原住民族歲時祭儀假：學生因原住民族歲時祭儀請假，以行政院原住民族委員會公告之各該民族歲時祭儀日期放假一日。\n\n \n\n如果我上課或考試沒有向老師辦理請假手續，會有什麼後果？\n\n \n\n學生因故不能上課或參加考試，均應辦理請假手續。未經請假或請假未准而缺席或缺考者，一律以曠課或曠考論。\n\n \n\n \n\n碩、博士班宿舍 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n請問碩、博士班宿舍每學期及暑假住宿費為何？\n\n \n\n（一）學期宿費\n\n碩博士班男生住宿區域為自強1-3舍及自強十舍A、C棟，\n\n碩博士班女生住宿區域則為莊敬九舍及自強十舍B、D棟，\n\n依學年期及宿舍棟別有不同之收費，\n\n詳細學期宿舍費用請參閱住宿組網頁連結：\n\nhttp://osa.nccu.edu.tw/modules/tinyd4/\n\n(二)「暑期住宿費」以學期住宿費之二分之一計算。\n\n(三)「寒假住宿費」已納入上下學期之住宿費用中，不需另繳。\n\n※另每位住宿生需繳納「住宿保證金」1,000元。住宿保證金依規定辦理退離宿程序後退還；若未依退離宿程序辦理退離宿手續者，保證金不予退還。\n\n \n\n請問研究所新生及未住宿之研究生如何申請研究生宿舍？\n\n \n\n(一) 戶籍於非限制區者：\n\n1、碩博班新生：請於7月上網填寫新生資料表時一併申請。\n\n2、碩博班舊生：請於每年公告之碩博士班宿舍申請須知規定之時間上網申請。\n\n(二) 戶籍於限制區者，僅得於8月申請宿舍候補。\n\n碩博士班宿舍申請須知可至本校住宿輔導組網頁最新消息公告查詢。\n\n \n\n研究生如何遞補宿舍？往年遞補之進度如何？\n\n \n\n(一)碩博士生宿舍候補床位之遞補，依據學年住宿申請時，電腦亂數抽籤所產生未抽中核配宿舍者之「宿舍候補名單序號」依序遞補，學期中有同學休、退學、畢業、退宿遷出宿舍時，住宿組將電子郵件通知候補同學遞補床位。\n\n※請同學務必隨時上網維護本校學生「個人基本資料維護」內相關之連絡電話及電子郵件(請設定系統中「主要電子郵件」為學號之E-mail帳號，以免被擋信而錯失重要宿舍訊息，致影響個人權益。\n\n(二)候補進度：候補速度須視空床位狀況決定，往年的經驗僅供參考，每年仍略有不同，若有同學違規或退宿才會有空床位可供候補，時間上無法確定。\n\n \n\n請問若未申請到學校宿舍，學校有否提供校外租屋資訊？\n\n \n\n請至本校網頁查詢：政大首頁→行政單位→學生事務處→住宿輔導組→校外賃居資訊。(須以政大email帳號密碼登入，尚無學號之新生請洽住宿輔導組)\n\n另於住宿輔導組(行政大樓三樓)有免費提供之「學生校外租屋須知手冊」及空白格式之「房屋租賃契約書」供同學索取。\n\n \n\n請問家境清寒、特殊狀況及表現優秀之學生，學校可否提供宿舍？\n\n \n\n(一)身心障礙生、現任研究生學會會長及低收入戶學生(持有社會局核發之低收入卡)：請於宿舍申請期限內檢附相關有效證明文件影本逕向住宿輔導組提出申請。\n\n(二)未持有低收入戶卡之清寒及表現優良具特殊貢獻之學生：可依本校「優秀及清寒學生申請宿舍要點」(請至「住宿輔導組」網頁查詢「宿舍法規」辦理，於第二學期期初依公告申請下學年之宿舍。\n\n(三)碩博士班新生：未持有低收入戶卡，但家境清寒者，請先於公告之申請期限（每年約7月）上網申請，約8月初可查詢結果。若未申請到宿舍，約於8月中旬辦理清寒生申請宿舍，屆時請上網查詢住宿輔導組網頁之「最新消息」，於公告申請期限內送交住宿輔導組。\n\n(四)其他若有臨時、特殊狀況住宿需求，請各系上簽文陳述原因及檢附相關證明文件，會住宿輔導組，送校長核可後，由住宿輔導組安排宿舍。\n\n(五)申請準備資料：\n\n1.清寒學生宿舍申請表（可由住宿輔導組網頁最新消息之公告下載）。\n\n2.「國稅局開立之最新年度全國檔各類全家所得總歸戶清單」(含本人、直系血親卑親屬)\n\n3、最近三個月內全戶戶籍謄本或戶口名簿影本。\n\n4、家庭遭遇重大變故證明。\n\n5、無力負擔學費證明(如：助學貸款證明)。\n\n6、家長失業或無薪假證明。\n\n※以上1~3為台生必備文件，其他文件依狀況儘可能提出。請務必於申請表上以文字詳述所有家境清寒狀況。\n\n \n\n碩、博士班宿舍寢室室友申請異動調整須辨理何種手續？如何辦理？\n\n \n\n(一)請至住宿組網頁表格下載處下載「寢室異動申請表」，經異動雙方住宿生簽名後，送至行政大樓3樓住宿輔導組辦理異動手續。\n\n(二)新住宿生若欲得知寢室及新室友相關資料，請至政大網頁查詢：政大首頁→iNCCU →全人發展與自我管理系統→多元生活→住宿生活，可自行用『學號』寄發電子郵件聯絡，住宿組不提供室友之連絡電話。\n\n(三)每學期末會進行碩博班寢室更換作業，同學可選擇空床位更換或與其他住宿生交換床位。\n\n \n\n碩博士生宿舍抽籤抽中後可住多久？\n\n \n\n碩博士生宿舍期限：碩士班學生住宿期限為四學期，博士班學生住宿期限為八學期。學期數之起算原則上由核准住宿當學期始，碩博士生住宿期限屆滿者(住宿期間若有中斷者亦須合計住宿年限)，不得再為住宿申請。\n\n \n\n請問申請暑假住宿需具備資格為何？碩博士班新生可否申請暑宿？\n\n \n\n(一)暑假住宿申請資格：\n\n1、現住宿生：經核准之暑期住宿生若於暑期中辦理畢業離校程序後，仍可繼續住宿至暑宿結束日(八月底)，離校程序單可至住宿輔導組先核章，學生證不用繳回註冊組，仍可使用於宿舍門禁系統。\n\n2、其他非住宿之舊生：由住宿組依床位供需，另行公告辦理申請。\n\n（二）碩博士班新學年新生：原則上不能申請暑宿，但若該系所課程提前於暑期上課或協助老師做研究者，由該系所統一彙總男女生住宿名單，於6月底前以簽文會住宿組安排床位(住宿日期至八月底止)。\n\n※惟整建修繕宿舍寢室或公共空間必須淨空、調配相關床位時，將另行公告相關申請規定及申請期限。\n\n \n\n請問現住宿生及已核配宿舍者之退宿規定及如何申請退還「住宿保證金」？退(補)費標準為何？\n\n \n\n(一)退離宿程序及申請退還住宿保證金：請至住宿輔導組網頁查詢「退離宿程序」，依規定辦理退離宿手續，始得申請退還住宿保證金。\n\n(二)退(補)宿費標準：請至住宿輔導組網頁查詢。\n\n \n\n請問現住宿碩博士生出國交換研讀，其住宿資格可保留至回國後嗎？如何辦理？\n\n \n\n(一)資格:出國交換超過一學期(含)以上\n\n(二)資格保留與住宿安排:\n\n1.出國交換學生得保留所餘住宿期限之住宿資格（以學期計）。俟回國前告知住宿組確定回國時間後，本校住宿組將視空床情況，優先分配住宿床位。\n\n2.同學如於學期中退離宿時，當學期將列計已住宿一學期。\n\n(三)應繳交之證明文件:\n\n請將「出國交換之證明文件」(如錄取通知、入學許可等等)，於退離宿時，交送住宿組宿舍業務承辦人，並請告知學號、姓名、系級、原住宿之寢室、曾住宿時間及預定回國時間，俾利憑以優先分配回國後之新學期宿舍(若要申請暑宿者，亦請一併告知)。\n\n \n\n請問休學生復學，如何申請宿舍？\n\n \n\n（一）若於新學年第一學期復學，請先辦理復學（依教務處註冊組公告之註冊時間繳交學雜費）後，依新學年碩博班宿舍申請公告時間上網申請。若申請時有問題請電話洽詢住宿輔導組。\n\n（二）若於第二學期復學，請先辦理復學（依教務處註冊組公告之註冊時間繳交學雜費）後至住宿組辦理宿舍候補。若申請時有問題請電話洽詢住宿輔導組。\n\n \n\n請問畢業、休學、退學或轉學住宿生應於何時搬離宿舍？\n\n \n\n(一)畢業、休學、退學或轉學住宿生應於發生日起7日(含例假日，且不得超過當學期期末所訂離宿日)內向宿舍服務台辦理退離宿手續，始得申請退還住宿保證金或宿舍費用。\n\n※退離宿手續：填具「退離宿暨退還保證金申請表」→請宿舍服務台人員檢查寢室後核章→送住宿組辦公室。\n\n(二)惟於暑期中，畢業生若已申請暑宿且繳暑宿費者，可於暑期中先辦理畢業離校程序，請宿舍服務台或住宿組先於「畢業離校程序單」上核章，可住宿至暑期結束日(至8月31日，門禁仍可使用)，依上所列退離宿手續申請退還住宿保證金。\n\n \n\n \n\n外傷處理 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n校園發生緊急傷病如何處理？\n\n \n\n請就近直撥電話或校內分機，如病患休克或意識不清等無法判斷之傷病請直接呼叫119或通知\n\n衛生保健組電話 8237-7424、8237-7431\n\n軍訓總值日室電話 2938-7132、2939-3091轉67132、66119\n\n警衛室電話 2938-7129、 2939-3091轉66110或66001\n\n \n\n門診部沒有服務時間我受傷或身體不適時，想休息怎麼辦？\n\n \n\n健康中心2樓衛生保健組於上班時間仍提供簡易外科換藥及可短暫休息之處。\n\n \n\n何種傷口可在衛保組換藥？\n\n \n\n1、一般傷口(擦傷、刀傷)處理。\n\n2、灼、燙傷處理 。\n\n3、運動傷害處理。\n\n4、口腔潰瘍處理。\n\n5、蚊蟲叮咬處理。\n\n6、傷口縫合前後換藥。\n\n \n\n \n\n學士班宿舍 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n【換寢】換寢可以線上申請嗎？\n\n \n\n換寢無法線上申請，必須填寫完寢室異動單後，經由當事人雙方簽名後，送交住宿組辦理；寢室異動單可從住宿組網頁－表格下載列印。\n\n \n\n【宿舍申請】申請結果甚麼時候會公告？\n\n \n\n申請結果通常會在期中考後，詳細日期可見住宿組網頁公告，公告日起，同學亦可登入iNCCU愛政大查詢結果。\n\n \n\n【宿舍申請】申請過後就代表有床位了嗎？先申請抽中的機率會比較大嗎？\n\n \n\n申請過後還需等待床位抽籤的結果，床位抽籤相關時程請見公告；不管先申請還是後申請，只要在期限內有提出申請，抽中的機率是一樣的，都是由電腦亂數抽籤決定。\n\n \n\n【宿舍申請】如果沒有中籤，會自動列為候補嗎？\n\n \n\n如果沒有中籤，系統將會自動列為候補，並產生候補序號，候補床位時會依據序號來通知同學，候補序號同學可由iNCCU愛政大中查詢得知，同學亦會知道總候補人數有幾位，自己是幾號。\n\n \n\n【宿舍申請】如果我是外籍生（或其他保障身份），也一樣要上網申請宿舍嗎？\n\n \n\n是的，所有需要床位的同學都要上網申請宿舍，包含所有保障身份之學生（相關保障身份可見宿舍輔導及管理辦法第七條）；但外籍生如果對於申請流程不清楚，可洽國合處協助。\n\n \n\n【宿舍申請】如果已經舉家搬遷到非限制區的戶籍，但是系統還是無法讓我登入申請，要如何處理？\n\n \n\n如果已經舉家搬遷，可檢附舉家搬遷之戶籍謄本供驗證，並至住宿組紙本登記，由住宿組統一匯入系統，抽中的機率和大家是一樣的，都是由電腦亂數抽籤決定。\n\n \n\n【宿舍申請】如果我忘了在期限內申請宿舍，有什麼補救的措施嗎?\n\n \n\n如果來不及在公告的期限內完成宿舍申請，就只能登記床位候補，候補的日期請見住宿組網頁公告。\n\n \n\n【宿舍申請】請問限制區包含那些地區？限制區僅能登記候補嗎？\n\n \n\n台北市全部行政區及新北市中和區、永和區、新店區、板橋區、深坑區、石碇區、三重區、蘆洲區。其餘皆為非限制區。限制區之同學不能申請宿舍，僅能登記候補。\n\n \n\n【宿舍申請】請問沒有個人帳戶就無法上網申請宿舍嗎？\n\n \n\n對，為了利於退還保證金及其他校內款項，每位入學之學生都須在校內建立個人金融帳戶，可選擇郵局或第一銀行之帳戶，若同學有帳戶但若未於學校完成登記，須至出納組櫃台或電話告知帳戶資訊，以利後續退費事宜。除非僑生或外籍生有其居留上不可抗力之因素，方可洽住宿組辦理紙本申請宿舍，由住宿組統一匯入資料。\n\n \n\n【床位選填】請問床位選填的順序是什麼？一個隊可以選擇幾個志願？\n\n \n\n床位選填會依照【申請制（莊二、三舍）】－【升大四】－【升大四＋升大三】－【升大四＋升大三＋升大二】－【直接選填】的順序選填，若於前述選填之時間內皆未分發完成，則最後可直接選填，直接選填不選擇志願，選到那一床即為那一床；每隊可以選擇10個志願。\n\n \n\n【床位選填】如果我是升大二的女生，想跟升大三的學姐一起住，能在升大三可選填的時間內就組隊選填嗎？\n\n \n\n不行，升大三的學姐必須要等到升大二可選填的時間內，才可以一起組隊選填；如果有不同年級的同學想一起住，必須要到同隊中，年級較低的同學可選填之時間內，才可組隊選填。\n\n \n\n【床位選填】如果我沒有室友可以一起組隊，也可以組隊選填床位嗎？\n\n \n\n可以，組隊分成單人組隊及多人組隊，系統中會以”隊”作為分發單位。\n\n \n\n【床位選填】隊長選填過床位後，隊員還要再去選填嗎？如果隊長組隊，隊員沒有確認會怎樣嗎？\n\n \n\n不必，若已完成組隊，則以隊長選填之床位志願為主；如果隊長組隊，隊員沒有確認則未完成組隊，無法選填床位。\n\n \n\n【床位選填】如果對於已經選到的床位想更換，請問有什麼方式嗎？\n\n \n\n若已經選到床位卻想重選，必須登入系統放棄床位後才能再重選，且是以\"隊\"為單位放棄，但同學若要放棄已選到之床位，要考慮重選後床位不若前一天多的情況。\n\n \n\n【床位選填】如果越早選填，就能選到自己想要的床位嗎？如果第一天分發沒有成功，隔天還需要重新組隊嗎？\n\n \n\n如果在同一天的時間裡，早選填及晚選填是沒有影響的，因為是由電腦亂數去分發；但是如果是第一天選填及隔天選填就會不同，因為系統只要成功分發的床位，隔天就不會再釋出讓同學選擇。另，如果第一天分發沒有成功，系統並不會解散組隊，但若同學不想維持前一天的組隊，可以上系統中解散組隊。\n\n \n\n【床位選填】要怎樣選填志願才會比較容易分發成功？\n\n \n\n床位志願分為：「都可」、「宿舍區」、「床位數」、「樓層」、及「寢室號」五大類，並非寫在前面的志願就容易分發成功；而是選填的區塊越大就越容易成功，像樓層的成功率一定會大於寢室號；床位數的成功率一定會大於樓層，以此類推。\n\n \n\n【換寢】莊二、三舍為申請制，若想與莊二、三舍同學換寢可以嗎？\n\n \n\n不可，莊二、三舍為服務時數申請制，若有空床位，將依當初申請同學之資料依序聯絡同學候補，以維護申請制同學之權益。\n\n \n\n【床位選填】為什麼我無法登入床位選填系統？\n\n \n\n學校裡的系統建議使用IE7以上或FIREFOX之瀏覽器，才能登入系統，GOOGLE瀏覽器無法登入系統。\n\n \n\n【床位選填】若我選填完床位，卻發現我臨時不需要床位了，我要如何辦理？\n\n \n\n若你已確定不需要床位，請盡快至住宿組辦理退宿，以免時間過久，影響他人的床位候補速度，也影響自身日後申請宿舍之權益。\n\n \n\n【候補】請問候補床位大約要等多久？如果候補到我，可是我現在還不想住宿校內宿舍，可以保留資格嗎？\n\n \n\n候補速度須視空床位狀況決定，往年的經驗僅供參考，每年仍略有不同，若有同學違規或退宿才會有空床位可供候補，時間上無法確定。如果在候補的時間內不想候補，視同放棄候補資格，不能保留資格，若還需床位則要再重排候補。\n\n \n\n【候補】請問候補到床位後，要怎樣辦理程序？會用什麼方式通知同學？\n\n \n\n通常候補到床位，會有兩種選填床位方式，一種是線上選床位，通常是候補人數較多或寒暑假時間；另一種是至住宿組選床位，通常是候補人數較少或學期間。同學依上面兩種方式之一選填完床位後，至出納組完成繳費，再拿繳費單換取核准入住通知單，即可至各舍區櫃台報到辦理入住。候補除住宿組網頁公告之外，亦會發信至同學之學號信箱，請同學多加留意。\n\n \n\n【候補】如果候補到，可以選擇想要的床位嗎？宿費又如何計算？\n\n \n\n如果候補到床位，同學僅能就當時現有之床位作選擇，但是那一棟宿舍、2人房或4人房則無法保證。依據學生宿舍輔導與管理辦法第十三條，補繳宿費標準如下：開學起10日內，繳交全額宿費；開學10日後至學期三分之一基準日止，繳交全學期四分之三宿費；學期三分之一基準日後第一天起至學期三分之二基準日止，繳交全學期二分之一宿費；逾學期三分之二基準日後，繳交全學期三分之一宿費。相關內容亦可見住宿組網頁-退/補宿費規定。網址：http://osa.nccu.edu.tw/modules/tinyd4/index.php?id=13。\n\n \n\n【換寢】如果已經知道有空的寢室，可以直接換去那裡嗎？\n\n \n\n不行，還是要先向住宿組詢問並確認，因為有些寢室是緊急備用寢，僅供緊急情況使用；原則上空床狀況變動相當大，若同學想換寢，建議可先從同學與同學交換為原則。\n\n \n\n【候補】如果我錯過了線上登記候補的時間，有補救的辦法嗎？\n\n \n\n如果錯過了9月的線上候補登記，就要到住宿組（行政大樓3樓）辦理紙本候補登記，順序排在線上候補登記之後。\n\n \n\n【退宿】若辦理退宿，退費標準是甚麼？\n\n \n\n依據學生宿舍輔導與管理辦法第十三條，退(補)宿費標準如下：開學2週前退宿者全額退費；開學前2週至開學前1天止，需先繳納「延後退宿費」新台幣500元，方可申請退還全費或更換註冊單，惟已入住者除繳納「延後退宿費」新台幣500元外，另須繳交自入住日起算，逐日累積之延宿費，方可申請退費或換單；開學起10日內退宿者，退還三分之二宿費；開學10日後至學期三分之一基準日止內退宿者，退還宿費二分之一；逾學期三分之一基準日後退宿者，不予退還宿費。相關內容亦可見住宿組網頁－退/補宿費規定。網址：http://osa.nccu.edu.tw/modules/tinyd4/index.php?id=13。\n\n \n\n【退宿】退宿之後下學年可以再申請宿舍嗎？會不會之後就不能申請了？\n\n \n\n申請退宿是指放棄學年的住宿資格，若非延宕過久故意不退宿或違規滿10點退宿的話，之後如果想再申請是可以的，但如果同一學年裡又想住宿，則需登記候補，若無重大違規或特殊情況不會因此就失去申請宿舍資格。\n\n \n\n \n\n場地租借 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n我想辦活動，藝文中心有哪些場地可借用？\n\n \n\n(1)以下場地提供借用：101舞蹈室、視聽館、621活動室、622視聽室、721活動室、722活動室、813活動室、大禮堂。\n\n(2)借用方式及各場地設備及用途：http://osa.nccu.edu.tw/modules/tinyd5/index.php?id=10\n\n \n\n我今天有閒、有心情，可以到藝文中心彈彈鋼琴嗎？\n\n \n\n(1)藝文中心目前有兩間活動室因分別存置一台鋼琴，為發揮最大效益，並提供有需求學生使用，故開放申請付費借用，非屬藝文中心固定服務項目。\n\n(2)通常約於開學兩週前以正式函告及本中心網頁，公告開始登記日等相關訊息。\n\n(3)詳細時程、借用方式、計費標準等相關規定均請見當期公告。\n\n(4)因為琴室使用率幾乎全滿，所以如果開學初沒有順利完成借用與繳費，恐就沒得談（彈）啦！\n\n \n\n我看到有人在那裡辦活動，可是為何我在場地借用系統上看不到那個場地？\n\n \n\n(1)藝中周遭尚有一些「開放空間」可以辦活動，此類場地有1樓社團活動空間（鏡牆）、2樓戶外木平台、4樓戶外木平台及星空廣場、水岸實驗劇場。\n\n(2)上述場地尚未列於場地租借系統辦理線上借用，請填寫「特殊場地借用申請單」辦理。\n\n(3)相關事宜請逕洽場地管理人楊小姐〈校內分機63389〉。\n\n \n\n藝文中心開放使用時間為何？\n\n \n\n藝文中心開放時間原則如下\n\n學期間週一至週五，8:00-22:00，週六-日，8:00-17:00\n\n寒、暑假週一至六，8:00-17:00，國定假日不開放\n\n農曆春節比照學校函告時間放假\n\n \n\n我要辦大型活動，藝文中心有大型場地可借用嗎？\n\n \n\n(1)藝文中心大禮堂是目前藝中最大型的活動場地，設置1,348座位。\n\n(2)借用方式及更詳細說明： http://osa.nccu.edu.tw/modules/tinyd5/index.php?id=18&place_id=27\n\n \n\n不是！不是！為何在藝文中心的場地借用不是洽藝文中心？\n\n \n\n(1)藝文中心因應其他進駐單位業務所需，有些場地移撥相關單位管理。\n\n(2)目前移撥的場地及其借用承辦人如下\n\n<2樓>215多功能教室：課務組 李小姐，校內分機62181\n\n<2樓>舜文大講堂：課務組 林小姐，校內分機63294\n\n<2樓>數位藝術創作中心：數位內容碩士學位學程 林助教，校內分機62670\n\n<3樓>創意實驗室：創新創造力研究中心 張小姐，校內分機62603\n\n \n\n我發現藝中設施有毀損或需要維修情形，要如何處理？\n\n \n\n(1)直接面告或撥打校內分機63393，洽四樓服務台值班人員。\n\n(2)若屬使用過程中所造成損害，則需另行依規定辦理賠償事宜。\n\n \n\n \n\n藝文活動 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n哇！有些節目與兩廳院同月間前後舉行，收費有沒有比兩廳院便宜？\n\n \n\n藝文中心舉辦的活動除了研習活動等酌收工本費或保證金外，其餘原則上免費。\n\n \n\n我錯過了一些精彩的節目或講座，有機會觀賞到嗎？\n\n \n\n藝文中心所舉辦演出節目及講座活動，其中經獲授權同意公開播放部分，可於本校「YOU政大--演講與活動網」「藝文表演活動」項下點閱http://speech.nccu.edu.tw/?nav=folder\n\n \n\n有些校外節目很不錯，我如何得知？\n\n \n\n(1)校外藝文文宣集中置放、張貼於藝文中心四樓大廳旋轉展示架、海報展示區。\n\n(2)學務處藝文中心網頁設置校外各級藝文單位網頁連結。\n\n \n\n如何取得藝文中心第一手節目資訊？\n\n \n\n(1)走路時：四維堂前左側藝文中心專用公告欄、藝文中心大門外公告欄及外牆海報。\n\n(2)宅在電腦前：藝文中心網頁http://osa.nccu.edu.tw/modules/tinyd6/index.php?id=5\n\n(3) 紙本收藏者：可於本校校門口收發室、藝文中心四樓服務台、社資中心、商學院、綜合院館、道藩樓及行政大樓服務台、四維堂左側專用海報板等定點，索取節目表。\n\n \n\n節目很不錯！但我忘記報名，還是可以參加嗎？\n\n \n\n(1)依節目活動性質不同，所以參加方式也有些差異。\n\n(2)大致上，只要是在開放或規定進場時間內到達，不用報名的如下：展覽、電影欣賞。\n\n(3)需上「聯合報名系統」登錄的如下：表演活動、研習活動及講座、工作坊等。\n\n(4)因應活動名額限制等不同需求或演出者的要求，各場次活動入場都有可能有特殊規定，請詳參當學期節目表說明。\n\n \n\n \n\n志工工作室 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n我如何加入藝文中心志工工作室？\n\n \n\n(1)可在每學期開學期間社團招新「藝文中心志工工作室」攤位中登記參加。\n\n(2)可由藝文中心網頁進行線上報名，每學期開學當週公告於藝文中心最新消息。\n\n(3)電洽藝文中心楊小姐〈校內分機63389〉。\n\n \n\n是誰？那些在活動中穿著黑色背心或黑色服裝的人？\n\n \n\n他們是屬於「藝文中心志工工作室」的志工。\n\n \n\n \n\n飲食衛生 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n衛保組既然是檢查單位，可不可以說明一下如何進行檢查呢?\n\n \n\n（1）每週由受過訓練之工讀生與本組工作同仁執行學校餐廳衛生檢查，結果依序呈閱學務長後，公佈於網頁。\n\n（2）每週除由本組實施檢查校內餐廳衛生狀況乙次，或視狀況實施無預警式夜間衛生檢查。\n\n（3）每學期抽驗校內餐廳販售食品1次，樣品送至北市衛生局檢驗室檢驗；檢驗結果不合格之業者，除知會管理單位（學務處住宿組、總務處事務組）加強輔導改善衛生狀況外，並再次抽驗送檢，直至合乎衛生規定；情節重大時，由簽約單位總務處事務組執行履約停止營業。\n\n \n\n對於餐飲衛生方面有意見要如何反應與申訴呢?\n\n \n\n（1）校務建言系統\n\n（2）直接向各餐廳負責人反應。\n\n（3）向衛保組、學務處住宿組（安九食堂）或總務處事務組（全校餐廳）反應。\n\n \n\n當我吃壞肚子時，我該怎麼辦？\n\n \n\n（1）請勿擅自服用成藥。\n\n（2）請至鄰近醫院就醫。\n\n（3）若是在校內餐廳用餐後出現身體不適現象，請電洽本校學務處衛生保健組(82377431)，會有專人為您迅速解決問題。\n\n \n\n校園裡有很多餐廳，是否設有專人負責餐飲衛生把關呢?\n\n \n\n（1）本校設有學校衛生委員會統籌校內餐廳衛生管理事宜，以加強改善學校餐廳衛生，維護全校師生健康。\n\n（2）學務處住宿組（安九食堂）、總務處事務組（全校）為管理單位，負責校內餐飲業者、販賣部招商、簽約與廠商管理事宜。\n\n（3）衛生保健組為檢查單位，負責校內餐廳衛生檢查與缺點輔導改進。\n\n \n\n \n\n飲用水衛生 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n校園裡有很多飲水機，是否設有專人負責飲用水衛生把關呢?\n\n \n\n（1）本校衛生保健組設有專人負責飲用水衛生管理事宜，以維護本校飲水設備之正常水質以達安全飲用水之標準，確保全校師生之健康。\n\n（2）總務處事務組為飲用水設備清潔單位，負責校內督導及負責飲水機清潔工作（濾心之清洗、設備外殼及檯面清潔）。\n\n（3）總務處營繕組為飲用水設備維護單位，飲水機外管線與設備修繕工作、蓄水池、蓄水塔之清洗、每三個月更換濾心。\n\n（4）衛生保健組為檢驗單位，負責校內飲用水設備水質檢驗\n\n工作。\n\n \n\n那麼衛保組是如何進行水設備水質檢驗工作呢?\n\n \n\n（1）校內自行檢驗：由受過專業訓練工讀生進行水質檢驗。\n\n（2）每三個月委託環保署認可之檢測機構抽驗全校1/8飲用水設備，並檢驗飲用水衛生。\n\n（3）上述2項之檢驗報告皆定期於衛生保健組網頁/衛生檢驗結果公告。\n\n（4）檢驗結果不符合飲用水標準之設備公告暫停使用，將檢驗結果呈報環保局核備，並安排複檢事宜。\n\n \n\n對於飲用水衛生方面有意見要如何反應與申訴呢?\n\n \n\n（1）校務建言系統\n\n（2）飲用水設備清潔方面的問題，請向總務處事務組反應。\n\n（3）飲用水設備維修方面的問題，請向總務處營繕組反應。\n\n（4）飲用水設備水質方面的問題，請向學務處衛保組反應。\n\n \n\n \n\n學生體檢 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n是否所有的新生都需要新生體檢？\n\n \n\n依據「國立政治大學學生健康檢查實施辦法」第二條規定新生一律需完成學校所規定之體檢。\n\n \n\n若是因為出國或沒有時間不能參加學校舉辦的新生健康檢查怎麼辦？\n\n \n\n可以於攜帶本校的「學生健康資料卡」於規定體檢期限前到任何一家合格的醫療院所完成體檢，再將體檢表寄回衛生保健組就可以了\n\n \n\n如果因生病或其他不可抗拒原因無法於規定期限完成體檢怎麼辦？\n\n \n\n可於期限內填具體檢延期申請表並附上相關證明後提出延期申請。\n\n \n\n如果我自己有做定期的健康檢查，還需要參加學校的體檢嗎？\n\n \n\n若符合下列兩個條件：\n\n（1）是入學當年做的體檢。\n\n（2）體檢項目含括本校「學生健康資料卡」背面之健康檢查項目。\n\n則可以不用參加學校體檢。\n\n \n\n \n\n醫療用品借用 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n如何借急救包？\n\n \n\n請上學務處衛生保健組網頁下載並列印醫療用品借用單（亦\n\n可直接向衛保組櫃檯索取），填妥後經申請單位核可（社團\n\n請課外活動組蓋章、校隊請體育室蓋章、系所請系辦蓋章），\n\n即可向衛保組申請借用。\n\n \n\n如何借用柺杖、輪椅等器材？\n\n \n\n持學生證及相關證明文件親自至衛生保健組辦理，借用期限以2週為限，歸還時退還證件。\n\n \n\n政治大學附近醫療院所？\n\n \n\n醫院診所名稱 地址 電話\n\n萬芳醫院 台北市文山區興隆路3段111號 2930-7930\n\n欣民診所 台北市文山區保儀路11號 2937-5115\n\n鍾內兒科 台北市文山區木柵路3段119號 2939-9632\n\n建怡診所 台北市文山區新光路1段34號 2234-8082\n\n慈幼診所 台北市文山區指南路2段21號 2937-6956\n\n吳錫賢診所 台北市文山區木新路3段208號 2938-1577\n\n洪佑承小兒科 台北市文山區興隆路4段64-2號 2936-4708\n\n徐慧玲診所 台北市文山區興隆路4段99號 2234-0000\n\n聯醫政大門診 台北市文山區指南路2段117號1樓 8237-7441\n\n陳啟義眼科 台北市文山區興隆路3段204號 2239-5988\n\n目欣眼科 台北市文山區木新路2段120號 2939-1900\n\n觀心眼科 台北市文山區興隆路2段225號 8663-6017\n\n樸園牙醫診所 台北市文山區指南路2段45巷8號 2936-4720\n\n維新牙醫診所 台北市文山區指南路2段129號 2936-7409\n\n文山牙醫診所 台北市文山區木柵路3段37號 2937-7770\n\n許志文耳鼻喉科 台北市文山區指南路1段2號 8661-4918\n\n \n\n \n\n校外租屋 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n在校外租屋簽約後遷入時，應注意之事項為何？\n\n \n\n同學們在租屋簽約後遷入時，應注意之事項為：\n\n（一）為顧及個人居住隱私及安全，租屋後房鎖應換新為宜，並檢查有無偷窺針孔監視器等以確保自身安全。\n\n（二）與鄰居及其他房客保持良好互動關係，以收守望相助之效。\n\n（三）避免和陌生人共乘電梯。\n\n（四）深夜莫走暗巷，應儘量減少單獨夜歸情形。\n\n（五）在校外租屋時，應格外注意用電安全，外出前務必檢查並關閉所有電源及爐火等，以防止意外發生。\n\n（六）在校外租屋時，應告知家人及系教官正確地址及電話。\n\n（七）個人生活行為務必自我約束，避免增添房東及其他房客困擾。\n\n在校外租屋若發生租屋糾紛時，應如何處理？\n\n \n\n在校外租屋若與房東發生租屋糾紛時，可先依雙方簽訂之租約內容進行討論，若仍無法妥善解決，則應儘速至本校『學生租屋資訊服務中心』（住宿輔導組內）請求協助。\n\n在校外租屋若發生突發事件時，應如何請求協助？\n\n \n\n在校外租屋若發生突發事件時，可經由學校『緊急聯絡電話』獲得必要的支援：\n\n（一）日間：生活輔導組校外租屋服務─29387167（服務專線）或軍訓教官室─0919099119（專線）\n\n（二）夜間：總值日官室─0919099119（專線）\n\n \n\n \n\n就學貸款 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n學生申請就學貸款的資格為何？\n\n \n\n（一）學生家庭年所得收入符合中低收入家庭標準者，標準由教育部逐年公布。目前的規定為：\n\n1.家庭年所得總額120萬元以下（含120萬元）的學生，在學期間可免息申貸。\n\n2.家庭年所得總額逾120萬元至148萬元（含）的學生，學生加上兄弟姊妹或子女共2名以上(含)者，在學期間可免息申貸。\n\n3.家庭年所得總額逾148萬元的學生：\n\n(1)學生加上兄弟姊妹或子女共2名者，在學期間需自付全息申貸。\n\n(2)學生加上兄弟姊妹或子女共3名以上(含3名)者，在學期間可免息申貸。\n\n上述所提之「兄弟姊妹」和「子女」，為未成年者或已成年且就讀國內公私立學校的學生。\n\n4.另各校對於失業勞工子女就學或經濟上或其他特殊情況有困難的學生一旦經學校認定有貸款必要者，學校會依實際狀況給予從寬認定辦理就學貸款。\n\n（二）學生本人、法定代理人、配偶、保證人，需具有中華民國國籍，並有戶籍登記者。但保證人如為父母，僅一方具有中華民國國籍並有戶籍登記，且雙方已同盡納稅義務者亦可。\n\n年收入計算，財稅資料中心會查核本人與父母親（已婚者為配偶）前一年度綜合所得，包括薪資、利息、營利、股利等。不需要學生自己提供家庭所得清單。\n\n學生是否需要申請中低收入家庭證明或清寒證明？\n\n \n\n無須自行提出任何證明，由學校統一報請教育部轉請財政部財稅資料中心查調。但事先可自行核算是否符合標準，以免遭退件之困擾。\n\n學生申請就學貸款的流程為何？\n\n \n\n（一）申請之學生及家長（或監護人，第一次申辦時須出面）應在註冊前親自至銀行或至線上辦理對保手續。\n\n（二）學生回學校繳交相關文件時，出示銀行所開具之證明(就學貸款申請暨撥款通知書)，向學校辦理緩繳學雜各費。\n\n（三）學校核對並彙整申請貸款清冊彙報教育部平台轉請財政部財稅資料中心審查學生是否符合中低收入家庭標準。\n\n（四）合格者，由學校將申請清冊送承辦銀行辦理貸款；不合格者，由學校刪除其貸款資格並通知學生補繳學雜各費。以每學期註冊相關公告為準。\n\n準備文件部分\n\n（一）向戶政機關申請三個月內之戶籍謄本：申請人與保證人之戶籍謄本（包括父、母、本人）乙份。父母離異者，備申請人與父或母（即擔任保證人者）之戶籍謄本乙份。父母均歿者，備申請人與保證人之戶籍謄本乙份。\n\n（二）學生本人印章及保證人印章。\n\n（三）學生及保證人身份證\n\n（四）學生證（新生憑錄取通知單）\n\n（五）註冊繳費通知單\n\n（六）本校線上填寫並列印的「暫緩繳納註冊費用申請單」出示可貸款金額\n\n（七）富邦銀行網站列印之「就學貸款申請暨撥款通知書」三份。\n\n學生申請就學貸款金額之範圍是如何？\n\n \n\n學生申請就學貸款金額，以下列各費為範圍：\n\n（一）該學期實際繳納之學雜等費。\n\n（二）書籍費：其金額依主管機關之規定，目前專科以上學校為3,000元。\n\n（三）校內(外)住宿費：校內宿費依註冊繳費單所列金額；若學生住宿校外，則依校內住宿費最高額辦理。\n\n（四）學生平安保險費。\n\n（五）生活費(領有低收入戶證明者，每學期以4萬元為上限，領有中低收入戶證明者，每學期以2萬元為上限)。\n\n（六）電腦及網路通訊使用費：該學期實際繳納之費用。\n\n學貸款多久辦理一次？前往銀行對保，學生本人需要親自前往嗎？\n\n \n\n就學貸款每學期辦理一次。第一次辦理者，可選擇學生本人及連帶保證人親自前往銀行對保或線上辦理。\n\n本校就學貸款是由哪家銀行為承貸銀行？\n\n \n\n台北富邦銀行\n\n學生就學貸款相關規定及對保各分行 ，請參閱生僑組網站。\n\n辦理就學貸款時，可以找誰來擔任連帶保證人？\n\n \n\n申請就學貸款以學生為申請人，父母為保證人(學生年滿十八歲，父母任何一方為保證人即可)。如已婚，配偶為保證人。\n\n學生未滿十八歲，保證人由父母共同行使，其中一方未能出面，可檢具 父母印鑑證明，填具授權書(自行至富邦銀行網站下載)，委託另一方辦理。\n\n若父母為保證人其年滿七十歲以上者，應另加覓適當成年人作連帶保證人，並檢附其在職證明。\n\n若保證人無法親自至銀行辦理對保手續，可出具經住所所在地之地方法院公證之「就學貸款保證書」（請自行至富邦銀行網站下載）；或檢具距申貸日前六個月內之父母印鑑證明〈在戶政事務所可核發印鑑證明之情況下〉暨經父母加蓋印鑑證明章之「就學貸款保證書」，交由學生攜至銀行辦理；或另覓適當之成年人擔任保證人，需出具在職證明、財力證明或扣繳憑單等。\n\n是否每個學期保證人都要跟我去銀行辦一次對保？\n\n \n\n自92學年度起，台北富邦銀行為改善就學貸款每學期對保期間學生家長南北來回奔波及排隊等候之情形，將對保手續改為每一教育階段（大學為一個階段、研究所為一個階段）由承貸學生及連帶保證人簽立「總額度借據」方式辦理，只要首次申請時，保證人必須協同辦理對保，第二次以後申請，只需同學本人持前一次對保時銀行出具的「就學貸款申請暨撥款通知書」至銀行辦理對保即可。\n\n若父母親離異，應由誰擔任保證人？\n\n \n\n父母親離異：\n\n（1）若學生未成年，應由學生家長（或監護人）作保，若法院將監護權判歸母(父)親或協議將監護權歸母(父)親，則應由母(父)親作保。\n\n（2）若學生已成年則任何一方皆可。\n\n父母親雙亡，父親過世或失蹤、母親改嫁：\n\n（1）若學生未成年，應由法定代理人作保。\n\n（2）若學生已成年，則依民法親屬關係另覓適當之成年人作保。如哥哥、叔叔、伯伯等有正當工作收入者。\n\n未成年學生之父母的一方服長期徒刑，或因重病致無法擔任法定代理人，可否請他人代理？\n\n \n\n可以，但須檢附服監或重病證明。\n\n如何辦理就學貸款？是否直接持註冊單至銀行對保即可？\n\n \n\n同學應先上學校學務處生僑組瀏覽本學期就學貸款申貸流程及相關注意事項公告，首先上學校校務行政系統申請就學貸款線上填具「暫緩繳納註冊費用申請單」並列印出來以確定可申貸金額，另上富邦銀行網站填具「撥款通知書」同時列印三份，備妥相關文件偕同父母(連帶保證人)前往台北富邦銀行對保，對保完成後，於規定期限內繳交相關證明文件給學校學務處承辦人，並繳交未申貸的費用(電腦及網路通訊使用費及平安保險費等未申貸)給學校出納組。\n\n就學貸款的利率為何？\n\n \n\n利率之計算，由主管機關負擔者，按中華郵政股份有限公司一年期定期儲蓄存款機動利率為指標利率加百分之一點一計算；由學生負擔者，按中華郵政股份有限公司一年期定期儲蓄存款機動利率為指標利率加百分之零點一五計算。\n\n前項指標利率隨中華郵政股份有限公司一年期定期儲蓄存款機動利率變動而調整。加碼部分由教育部適時檢討調整並公告之。\n\n◎學生仍在學或畢業未滿一年內，利息由主管機關負擔。\n\n◎畢業滿一年之日起（男生得自服完兵役義務後滿一年）由學生自付利息並償還。\n\n就學貸款應於何時償還？償還的方式及期限如何？\n\n \n\n（1）貸款應於最後教育階段學業完成（或服完義務兵役或替代役或教育實習期滿）後滿一年之日開始，依年金法按月平均攤還本息；但在職專班學生，應於學業完成後即開始清償。\n\n（2）償還期限為貸款一學期得於一年內每月償還，依此類推（例如借八學期者，則借款金額會合併成一筆，分96期平均攤還）。\n\n（3）因故退學或休學未繼續升學者，應於退學或休學滿一年之日起按月償還本金。\n\n（4）出國留學、出國定居或出國就業者應一次償還。\n\n（5）學生於開始償還貸款之前一年度，平均每月所得未達新臺幣五萬元及為低收入戶或中低收入戶，得申請緩繳貸款本金（已逾應償還起算日或已開始還款者，應先償還逾期期間之已到期本息、違約金後，始得申請），最多以申請十二次為限，每次申請緩繳期限為一年，貸款到期日並隨緩繳期限順延。\n\n因故無法按期償還就學貸款時，請同學主動與承貸銀行協商調整還款時間與相關還款條件。\n\n貸款學生於各階段完成學業後如有異動，應否通知銀行？\n\n \n\n應上承貸銀行網站下載填具「延期償還申請書」主動檢附身份證影本、繼續升學現階段之學生證影本、或服義務兵役或替代役之在營證明、或教師實習證等影本）寄送通知承貸銀行，以延長其償還期限。\n\n逾期未還款者，會有什麼後果？\n\n \n\n學生逾期未還款者，承貸銀行會對積欠貸款者就貸款金額控訴求償，並將資料送請財團法人金融聯合徵信中心建檔，列為金融債信不良往來戶，並開放金融機構查詢；這項紀錄將會影響同學與銀行的往來關係，包括向銀行申請支票、信用卡、房屋貸款或信用貸款等，均將遭到拒絕；同時也會影響同學日後在國、內外之就業或就學機會。\n\n學生的父母非本國人，可以申請就學貸款嗎？\n\n \n\n款學生之父母，僅一方具有中華民國國籍並有戶籍登記，且雙方已同 盡納稅義務者，才可以申請就學貸款。\n\n如父母經商失敗或突遭意外身亡，但不符合中低收入家庭標準者，可否申請就學貸款？\n\n學生可檢附相關證件，經學校認定為特殊狀況需貸款，則可向承辦銀行辦理。\n\n \n\n \n\n助學服務 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n如何找到擔任校內學生兼任助理的機會？\n\n \n\n進入本校首頁→校園公告→徵才，瀏覽徵才資訊公告。\n\n經濟弱勢學生可進入校務資訊系統→學生資訊系統→資訊服務→弱勢學生擔任兼任助理意願調查，登錄個人資訊。\n\n直接洽詢各院系所或行政單位。\n\n學生擔任行政兼任助理，每小時薪資為何？有無工作時數限制？\n\n \n\n助學金支給行政兼任助理時，每小時金額不低於中央主管機關所核定之基本工資時薪。\n\n行政兼任助理工作時數每日不得逾8小時，工作4小時應休息30分鐘，並不得連續工作超過5日。\n\n每週工作總時數(含擔任其他勞動型兼任助理之時數)合計不得超過20小時，博士生至多25小時(外籍博士生與僑生博士生除寒暑假外，每週仍不得超過20小時)。\n\n什麼是學生生活助學金？申請資格為何？\n\n \n\n學校為培養弱勢學生獨立自主精神，並厚植畢業後之就業或就學能力，安排領取生活助學金之學生參與生活服務學習；學校視當年度預算核定若干名額，以低收入戶、中低收入戶、特殊境遇家庭子女及學生家庭遭逢變故，經濟現況較困難者優先核給。每生每月核發生活助學金新臺幣7,000元(含多元生理用品補助)，全年以核發8個月為原則。每週生活服務學習時數以6小時為上限。\n\n申請資格：\n\n具中華民國國籍之本校大學部在學學生。\n\n前一學期學業成績平均達60分以上。\n\n未受記大過以上處分者(經銷過者除外)。\n\n符合以下其中一項條件者：\n\n (1)低收入戶或中低收入戶。\n\n (2)特殊境遇家庭子女。\n\n (3)家庭遭逢急難變故，致生活出現困境者。\n\n (4)家庭年收入新臺幣90萬元以下(獲教育部弱勢學生助學金補助者為優先)。\n\n \n\n何時開始申請學生生活助學金？如何申請？\n\n \n\n學生事務處生活事務暨僑生輔導組(以下簡稱學務處生僑組)於每年一月公告受理期間。\n\n受理期間請持以下文件至學務處生僑組申請：\n\n(一)共同檢附文件(新生除外)：\n\n1.前一學期學業成績單。\n\n2.前一學期獎懲紀錄證明書或操行成績證明書。\n\n(二)依申請條件檢附文件：\n\n1.低收入戶、中低收入戶或特殊境遇家庭子女：政府核發之低收入戶、中低收入戶或特殊境遇家庭證明。\n\n2.學生家庭遭逢急難變故，致生活出現困境者：經系上導師或輔導教官查訪屬實之證明文件。\n\n(1)政府核發之低收入戶、中低收入戶或特殊境遇家庭證明。\n\n(2)前一學期成績單(新生免附)。\n\n \n\n3.非屬上述1、2身分，且家庭年收入新臺幣90萬元以下者：\n\n(1)全戶(含父母與配偶)國稅局綜合所得資料清單。\n\n(2)全戶戶籍謄本(三個月內)或新式戶口名簿影本。\n\n \n\n \n\n助學金每月何時入帳？\n\n \n\n學務處統籌之校內助學金原則上於每月18日匯入學生帳戶，學校未登錄帳戶之同學，請攜帶本人第一銀行或郵局帳號，逕洽總務處出納組登錄，相關資訊請洽分機62123；非學務處統籌之助學金請逕洽各業管單位詢問。\n\n \n\n僑生就學期間可否工讀？工作許可證應如何申請？\n\n \n\n在不影響課業的前提下，僑生需取得工作許可證後即可於校內外工讀；但學期中每週工讀時數不得超過20小時，寒暑假則不受時數限制。\n\n外國專業人員工作許可申辦網網址為https://ezwp.wda.gov.tw/，請點選「僑外生工讀申請」，申請帳號後即可進行案件申請。\n\n \n\n什麼是清寒僑生學習扶助金？申請程序為何？\n\n \n\n僑務委員會(以下簡稱僑委會)為扶助清寒僑生安心向學，協助其培養與學習自立能力，針對大學部僑生提供學習扶助金，由學務處生僑組受理申請；每期(3個月為一期)安排學生至各行政單位學習服務，並核發學習扶助金；學校視僑委會撥給預算核定若干名額，以家境清寒或因變故造成經濟重大負擔，生活確屬困難者優先錄取。\n\n學務處生僑組於每年三、六、九、十二月公告受理，學生填妥申請表、備妥成績單與相關佐證資料後繳交，將依僑委會核定名額以審核計分標準進行審查，並公告錄取名單。\n\n \n\n學生團體保險 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n意外受傷如何申請學生平安保險理賠？\n\n \n\n◎意外傷害理賠申請：\n\n(1)申請書一份。\n\n(2)診斷證明書正本一份。\n\n(3)收據正本（影本須加蓋醫院關防及與正本相符字樣） 。\n\n(4)若有骨折情況，需附上X光光片光碟。\n\n◎身故給付：\n\n(1)申請書一份。 \n\n (2)父親與母親的戶籍謄本正本一份。 \n\n (3)身故同學除戶戶籍謄本正本一份 。 \n\n (4)死亡證明或相驗屍體證明書正本一份 。 \n\n (5)意外醫療部分也可以申請保險理賠：\n\n 　A.醫生診斷證明正本(車禍時住院等)。\n\n 　B.收據正本(影本須加蓋醫院關防及與正本相符字樣)。\n\n \n\n◎殘廢給付：\n\n自事故發生起滿180天提出醫療機構開立之殘廢診斷證明書。\n\n◎特定意外險（學生社團意外險）申請流程：\n\n(1)社團至INCCU校務資訊系統/學生團體活動緊急通聯/登錄參加學生資料並列印學生名冊（請於活動前3日完成登錄）。\n\n(2)至[學務處課外活動組/表格下載/社團活動計畫書](https://tinyl.io/Be2f)，填寫後送一級主管核章。\n\n(3)將核准之社團活動計畫書及團體活動緊急通聯學生名冊於活動前3日送達生僑組。\n\n \n\n已有自行投保人壽保險，還可以再申請『學生團體平安保險』理賠給付嗎？\n\n \n\n已投保其他人壽保險，仍可以申請『學生團體平安保險』理賠給付；只要檢附診斷證明書正本及各項醫療費用收據正本或影本加蓋醫院章即可辦理。\n\n \n\n已經休學，還有『學生團體平安保險』保障嗎？\n\n \n\n已辦理休學或已畢業者，其保險效力仍持續至當學期結束（上學期為1月31日終止，下學期為7月31日終止），申請方式及手續與在學期間相同。\n\n \n\n \n\n弱勢學生助學金 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n何謂弱勢學生助學金，有限制條件嗎？\n\n \n\n配合政府政策提供未請領公費補助者，學士班學生家庭年所得70萬以下補助 20,000 元，超過70萬至90萬以下補助15,000 元；碩博士班學生家庭年所得70 萬以下補助5,000~16,500元之就學補助。\n\n 惟若已請領政府相關部會各類助學金、子女教育補助費等公費補助者不得申請。\n\n \n\n弱勢學生助學金辦理的時間為何，可以逾期申請嗎？\n\n \n\n本助學金每學年度申請一次，於每學年開學第2週(約每年9月中下旬)受理申請，核可後之補助金額將於下學期學雜費中減免。\n\n且因弱勢學生助學申請資料需上傳教育部平台，轉送財稅中心查核，逾期教育部平台即無法上傳，故若逾期申請弱勢學生助學將不受理。\n\n \n\n弱勢學生助學金辦理的流程為何？\n\n \n\n於學校公告受理之時間內，至愛政大平台/校務系統Web版/學生資訊系統/弱勢學生助學金申請，線上填寫申請表及列印，並持申請表、全戶近三個月內戶籍謄本（詳細記事）或新式戶口名簿（詳細記事）影本、前一學期成績單至生僑組辦理。\n\n \n\n弱勢學生助學金審核的項目為何？與學雜費減免等公費補助可以同時申請嗎？\n\n \n\n審核的項目包括家庭年所得（學士班90萬以下；碩博士班70萬以下），利息所得（2萬以下）與不動產（650萬以下），由財稅中心查核辦理。但若已請領政府相關部會各類助學金、子女教育補助費等公費補助者不得申請。\n\n \n\n \n\n學雜費減免 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n本校學雜費減免對象及申請程序為何，有無須注意事項？\n\n \n\n學生若具有軍公教遺族子女、原住民學生、身心障礙學生、身心障礙人士子女、低收入戶子女、現役軍人子女、特殊境遇家庭子女等特定身份，請於學校公告受理之時間內，至愛政大平台/校務系統Web版/學生資訊系統/學雜費減免-線上填寫申請表及列印，並持申請表、相關證件、全戶近三個月內戶籍謄本（詳細記事）或新式戶口名簿至生僑組辦理。\n\n \n\n學雜費減免辦理的時間為何？\n\n \n\n（一）減免申請：(舊生適用)\n\n申請日期：每年6月及12月第1週受理。\n\n（二）換單申請：(新生入學、初次申請、舊生適用)\n\n新生、初次申請者及未於上述期間提出申請學雜費減免之舊生，請於 開學第1週內提出申請換單。\n\n \n\n學雜費減免金額為多少？\n\n \n\n各類減免身份之減免金額因各學院不同，請詳閱生僑組網頁之說明。\n\n \n\n公費獎助學金可以一併申請嗎？\n\n \n\n各項公費只能擇一申請，如申請學雜費減免者，請勿申請弱勢學生助學金、勞委會失業勞工子女就學補助、學產基金中低收入戶學生助學金、農委會農漁民子女就學獎助學金、退輔會退除役軍人就學補助、軍公教子女教育補助、勞委會在職勞工就學補助等。\n\n \n\n若無身心障礙手冊，但有身心障礙鑑定證明，可以申請嗎？\n\n \n\n持有政府核發之身心障礙證明者，亦符合學雜費減免資格。依特殊教育法經直轄市、縣(市)政府鑑定為身心障礙持有鑑定證明而未領有身心障礙手冊之學生，其就學費用減免4/10。\n\n \n\n身心障礙子女就讀在職專班可以申請學雜費減免嗎？\n\n \n\n依教育部規定，自98年8月1號起，身心障礙人士子女就讀研究所在職專班，其就學費用不予減免。\n\n \n\n \n\n急難救助 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n急難慰助補助對象沒有包括外籍生或僑生？\n\n \n\n只要是本校學生都可以申請補助！\n\n \n\n急難事件若無法用相關文件證明時，可用何種文件替代呢？\n\n \n\n可由系教官、系導師及系主任分別填寫訪視表作為申請佐證資料。\n\n \n\n申請補助至撥款入帳需要多久時間？\n\n \n\n由於學校作業需經過一定的行政流程，因此需要約2個禮拜的時間才能將款項匯入學生的帳戶。\n\n \n\n我的家境很窮困，幾乎已無法負擔學雜費，但似乎又不符合”急難”救助之申請條件，可以申請急難救助嗎？\n\n \n\n本辦法的精神原則是救急不救窮，惟家境清寒，若經證明確實同學無力繳交學雜費，仍可申請急難救助，但同一事由僅受理一次為限。\n\n \n\n \n\n失業勞工子女就學補助 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n我的父（母）親最近剛失業，可以申請補助？\n\n \n\n本辦法規定父（母）親需為失業超過六個月以上的勞工，而且至少已請領政府失業給付一個月以上才得以申請此補助。\n\n \n\n我若已申請了此補助，還可以申請本校其他的就學補助嗎？\n\n \n\n若該學年度已申請本項補助，就不得再申請【包括各級政府以及本校各類學雜費減免優待補助（含全額及部分減免）、助學金或救助金（如本校薪傳助學金、急難救助金等）、農林漁鹽礦工子女就學獎助金、軍公教子女教育補助費】等補助措施。\n\n \n\n失業（再）認定、失業給付申請書暨給付收據於何處申請？\n\n \n\n各縣市政府就業服務中心。\n\n \n\n申請次數有無限制？\n\n \n\n失業勞工子女每學期每人以申請補助一次為限，且每次申請後需間隔6個月得再次提出申請。\n\n \n\n \n\n陸生輔導事宜 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n醫療傷害保險（健康保險）如何辦理理賠？\n\n \n\n由同學於醫療時先行支付費用,再持診斷書證明書(或住院證明)正本、醫療費用收據正本,至生僑組辦理並填寫保險理賠申請書,經保險公司 審核約三週後將款項撥入同學帳戶。\n\n \n\n醫療傷害保險（健康保險）內容為何？\n\n \n\n提供在臺的的醫療費用限額給付,項目及額度如下：\n\n(1)門(急)診醫療:按醫院或診所實際收取之醫療費用給付，每次理賠，上限為新臺幣 1,000 元(約人民幣 213元)。\n\n(2)每日病房費用:因疾病或傷害而住院時,每日病房費用理賠上限為新臺幣 1,000 元(約人民幣 213元)。\n\n(3)住院醫療費用:因疾病或傷害而住院時,住院醫療項目理賠上限為新臺幣 12 萬元(約人民幣 25,600元)。\n\n \n\n陸生在臺畢業後繼續留臺取得下一階段學歷，請問要如何換發多次入出境許可證？\n\n \n\n請於註冊入學後，由錄取學校代申請換發多次入出境許可證。需備文件如下:\n\n(1)填寫陸生入出境申請書。\n\n(2)照片1張（同國民身分證相片規格）。\n\n(3)大陸地區旅行證件(驗正本收影本)。\n\n(4)繳回原多（逐）次入出境許可證正本。\n\n(5)錄取或註冊證明：如學校行政單位開立證明正本，或學生證(驗正本收影本)。\n\n(6)保證書(陸生專用)。\n\n(7)費用：新臺幣1,000元。\n\n \n\n陸生來臺後如何辦理多次入出境許可證？\n\n \n\n大陸地區學生於單次入出境許可證有效期間入境，並註冊入學，備齊下列文件，1.至移民署或2.至「內政部移民署外國與外僑、大陸與港澳、無戶籍國民學生線上申請系統」。申請多次入出境許可證。\n\n(1)填寫陸生入出境申請書。\n\n(2)在學證明（請至本校教務處註冊組申請學籍狀態表）。\n\n(3)大陸地區旅行證件影本(驗正本收影本)。\n\n(4)經衛生福利部指定外籍人士體檢之國內醫院出具之健康檢查合格證(復學之陸生於前就學期間已出具者，無須檢附)。\n\n(5)繳回原單次入出境許可證正本。\n\n(6)委託書(非委託案件免附)。\n\n(7)證照費新臺幣1,000元。\n\n備註:線上申請請以圖片檔(JPG)或PDF格式上傳申請文件。\n\n \n\n如何辦理多次入出境許可證延期？\n\n \n\n大陸地區學生因修業情況申請延長停留期間者，應於停留期間屆滿前1個月內，備齊下列文件，1.至移民署或2.至「內政部移民署外國與外僑、大陸與港澳、無戶籍國民學生線上申請系統」申請多次入出境許可證延期：\n\n(1)填寫入出境許可證延期∕加簽∕換證申請書。\n\n(2)在學證明（請至本校教務處註冊組申請學籍狀態表）。\n\n(3)大陸地區旅行證件(驗正本收影本)。\n\n(4)繳回原多次入出境許可證正本。\n\n(5)委託書(非委託案件免附)。\n\n(6)費用：新臺幣300元。\n\n備註:線上申請請以圖片檔(JPG)或PDF格式上傳申請文件。\n\n \n\n畢業或休退學要如何辦理單次入出境許可證出境？\n\n \n\n大陸地區學生有休學、退學、變更或喪失學生身分等情事，除符合其他可在臺停留或居留之身分且經內政部移民署（以下簡稱移民署）許可者外，應於生效之翌日起10日內，備齊下列文件，至移民署申請單次出境證，並自核證之翌日起10日內離境。但應屆畢業生得於畢業後1個月內離境：\n\n(1)填寫陸生入出境申請書。\n\n(2)照片1張（同國民身分證相片規格）。\n\n(3)繳回原多（逐）次入出境許可證正本。\n\n(4)休(退)學或畢業證明。\n\n \n\n多次入出境許可證之入出境查驗格已蓋滿了，該如何處理？\n\n \n\n多次入出境許可證之入出境查驗格不敷使用者，應備齊下列文件，至就讀學校所在地之移民署各縣市服務站申請重新列印原紙本電子多次入出境許可證：\n\n(1)填寫入出境許可證延期∕加簽∕換證申請書。\n\n(2)繳回原紙本電子多次入出境許可證正本。\n\n(3)費用：毋須繳費。\n\n \n\n我的入出境許可證遺失、滅失或毀損，該怎麼辦？\n\n \n\nA、未入境者（含入出境許可證逾期）\n\n檢附以下文件至移民署辦理:\n\n(1)填寫陸生入出境申請書。\n\n(2)照片1張（同國民身分證相片規格），未依規定檢附者，不予受理。\n\n(3)毀損（逾期）證件或遺失說明書。\n\n(4)委託書。\n\n(5)費用：單次入出境許可證新臺幣600元。\n\nB、已入境者\n\n檢附以下文件至移民署辦理:\n\n(1)填寫陸生入出境申請書。\n\n(2)照片1張（同國民身分證相片規格），未依規定檢附者，不予受理。\n\n(3)毀損證件或遺失說明書。\n\n(4)委託書 (非委託案件免附)。\n\n(5)補(換)發費用單次出境許可證新臺幣300元，多次入出境許可證新臺幣1,000元。\n\n \n\n \n\n課外組場地租借 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n申請借用課外組場地的資格？\n\n \n\n(1) 不提供以個人名義申請\n\n(2) 社團（優先）\n\n(3) 校內各單位\n\n \n\n要如何取消場地？\n\n \n\n(1) 尚未列印場單：\n\nA. 須於「一周前」取消場地。\n\nB. 取消場地可直接到系統中「申請單查詢」，按「作廢」即可取消申請。\n\n(2) 已列印場單並已送單：\n\nA. 須於「一周前」取消場地。\n\nB. 到系統中「申請單查詢」，按「作廢」取消申請，釋放出場地讓其他需要的團體單位借用。\n\nC. 聯絡課外組場地管理老師（倩雯老師，分機：62237）\n\nD. 聯絡各場地管理員\n\n \n\n我要怎麼知道某時間某場地是被誰借用？\n\n \n\n(1) 點選「可租用時間查詢及填寫租用申請單」\n\n(2) 輸入欲查詢日期、場地\n\n(3) 點選「xxxxxx尚有空時段」\n\n(4) 彈出的視窗下方會顯示借用單位、借用人、聯絡方式。\n\n \n\n如何申請課外組場地？\n\n \n\n(1) 到iNCCU校務系統→場地申請登記系統。\n\n(2) 跑單流程：\n\nA. 社團：印出場地單→社團簽章→（批價→倩雯老師核章→）社團輔導老師核章（→出納組繳費→）一周前交至各場地管理員室\n\nB. 校內單位：印出場地單→行政簽章→（批價→倩雯核章→）出納組繳費→）一周前交至各場地管理員室\n\n \n\n為什麼有時候某些場地明明顯示尚有空時段卻無法借用？\n\n \n\n可能性一：課外組教室場地內部設定優先學生社團登記借用，教職員無法線上登記借用\n\n可能性二：部分場地如四維堂、風雩樓雲岫廳有時間限制，需於活動日前兩週登記，若超出時間則不予登記\n\n※各場地的詳細規定可以依下列路徑查詢：\n\n到iNCCU校務系統→場地申請登記系統→場地相關資料查詢→場地相關說明欄下「more…」\n\n \n\n課外組經管場地的開放時間？\n\n \n\n※國定假日、期中、期末考課外組經管場地一律不開放。\n\n(1) 四維堂：一～五，8時～22時\n\n(2) 風雩樓：一～五，8時～22時；六，8時～18時\n\n(3) 樂活館：一～五，8時～22時；六～日：9時～21時\n\n(4) 麥側攤位：一～五，10時～16時\n\n(5) 資訊大樓1～2樓（部分教室）：一～五，18時～22時\n\n(6) 綜院南棟1～4樓（部分教室）：一～五，18時～22時；六，8時～17時\n\n※場地開放時間各學期會因學校活動、寒暑假期間而有些許變動，詳細場地開放請見：http://moltke.cc.nccu.edu.tw/formservice_SSO/viewFormDetail.jsp\n\n \n\n其他借用注意事項\n\n \n\n(1) 四維堂：\n\nA. 四維堂2樓因安全考量目前暫不開放，\n\nB. 四位堂場地不開放辦桌。\n\n(2) 樂活館：僅開放參與輪值之社團申請借用\n\n(3) 麥側攤位：\n\nA. 禁止使用大聲公、擴音器材\n\n \n\n如果一張場地單上借用多個時段，但想要取消某個時段，要怎麼辦？\n\n \n\n可以打分機：62237，找倩雯老師。（來電時請說明清楚你是誰，什麼活動，有什麼事，場地單編號是多少，要更改異動什麼內容。）\n\n \n\n課外組場地有哪些需要付費？費用怎麼計算？\n\n \n\n課外組只有下列兩個收費場地：\n\n(1) 四維堂\n\n(2) 風雩樓雲岫廳\n\n※詳細收費標準請參考：http://moltke.cc.nccu.edu.tw/formservice_SSO/viewFormDetail.jsp （四維堂收費標準）、http://moltke.cc.nccu.edu.tw/formservice_SSO/viewFormDetail.jsp （雲岫廳四維堂收費標準）\n\n \n\n如果借用時段非開放時段，要怎麼辦？\n\n \n\n借用非開放時段需場地管理員配合加班，因此需先通知管理員確定可以配合加班（管理員伯伯阿姨僅有少數人力支援，但活動團體眾多，沒有預先告知，伯伯阿姨會很困擾喔！），再至課外組找倩雯老師登記場地。\n\n※找老師登記場地前，請準備好下列資訊：\n\n1.借用人學號／員工號碼\n\n2.社團／單位編號\n\n3.借用場地：建築物名稱─教室號碼，如：綜院415教室\n\n4.借用日期、時間：103/10/08，8～13\n\n5.連絡電話\n\n6.活動說明\n\n \n\n什麼是E化教室，借用E化教室的規定為何？\n\n \n\n(1) E化教室是有E化設備的教室（如：單槍投影機、電動螢幕、微電腦無線電控講桌組…等）\n\n(2) 借用課外組E化教室，需有E化教室使用資格。\n\n(3) E化教室使用資格的獲取：課外組每學期開學前二週會開E化教室使用課程，每學期共兩堂，擇一參加即可。\n\n \n\n請問什麼時候可以申請借用場地？\n\n \n\n(1) 場地預借：請在每學期中（原則上為每年5月及11月下旬至次月10日），依課外組公告作業辦法提出申請。\n\n(2) 一般借用：每學期開學前兩周，可上場地租借系統借用。\n\n \n\n請問可向課外組借用的場地有那些？\n\n \n\n(1) 四維堂（每次借用以二天為限）\n\n(2) 風雩樓（雲岫廳每次借用以二天為限）\n\n(3) 資訊大樓1～2樓（部分教室）（以活動聲音較大的社團使用為主）\n\n(4) 綜院南棟1～4樓（部分教室）（以開會或演講為主的社團使用為主）\n\n(5) 樂活館（樂活館不提供固定社課使用，且僅供參與輪值之社團申請借用）\n\n(6) 麥側攤位（每社團一學期以借用二次為限，一次至多一週，每次限一個攤位）\n\n※詳細場地資訊請見：http://moltke.cc.nccu.edu.tw/formservice_SSO/viewFormDetail.jsp\n\n \n\n申請借用場地需哪些紙本？\n\n \n\n1.場地租借紙本（單）\n\n2.(收費場地)繳費收據影本\n\n \n\n如果想要借用的場地不在課外組的場地列表裡，可以到哪裡詢問？\n\n \n\n(1) 總務處事務組林書廷小姐，分機：62102\n\n(2) 教務處課務組陳世昌先生，分機：62183、林怡璇小姐，分機：62182\n\n(3) 學務處藝文中心楊芬茹小姐，分機：63389\n\n \n\n \n\n獎學金 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n各項獎助學金都有送件，個人成績也不錯，何以未能獲獎？\n\n \n\n根據過去審核處理經驗，將申請獎學金的同學分數雖高，但卻未能獲得\n\n學校推薦的原因概列歸納如下：\n\n(1)申請證件不合或不全\n\n通常多因為未能依據獎學金提供單位的要求，檢送合於規定的相關證明文件或是檢附之證件缺項、不全。\n\n(2)資格不合\n\n多數獎助學金--特別是助學金都會有一定的資格限制，如未能符合申請資格，自然不會得獎或被推薦，例如需檢附低收入戶證明申請時卻只檢附清寒證明。\n\n(3)逾時申請\n\n各獎助學金都有一定的申請期限，但經由學校推薦的，因必須經由一定的審核、篩選、評比及公文簽核發文流程時間，故獎助學金之截止收件日期，必定是要比提供單位的期限要提前個五至七天的作業時間，故如未能在本校規定之截止日期前送件，自然就喪失了申請的機會。\n\n(4)申請同學成績普遍偏高，競爭激烈，可推薦名額有限，粥少僧多，難免有遺珠之憾，如龍山寺獎學金等。\n\n \n\n獎助學金經由學校推薦超過新台幣10,000(含)後是否可以再申請其他獎助學金？\n\n \n\n經由學校發文推薦的獎助學金，凡超過限額後學校即不會再幫同學推薦，須等下學年度才會再推薦，例如：108學年度同學以107學年度的成績申請獎學金，若108學年度上學期被推薦新台幣10,000元，則在108學年度上、下學期均不再推薦，但同學「逕自郵寄申請」的獎助學金不在限制之內，同學可多多申請。\n\n \n\n申請獎助學金，是否每人只能申請乙次？\n\n \n\n同一學年度內，經由學校審查推薦的獎助學金金額達新台幣10,000元(含)者，無論得獎與否，均不得重複申請，但並非每人只可申請乙次，只要同學在〝未被推薦〞之前均可以多次申請。\n\n \n\n如何才能得知申請的獎助學金已經獲得學校推薦或已得獎？\n\n \n\n同學申請的獎助學金是否已經獲得學校推薦或已得獎，可上愛政大平台/校務系統Web入口/學生資訊系統/個人獎助學金查詢查看。\n\n \n\n獎助學金相關資訊哪裡可以取得?\n\n \n\n獎助學金資訊，同學可至教育部圓夢助學網、愛政大平台、生僑組最新消息、各院系所公告欄暨相關網頁瀏覽即可獲知各類獎助學金申請相關訊息。\n\n 教育部圓夢助學網：教育部全球資訊網—師生園地—圓夢助學網—獎助學金搜尋\n\n 愛政大平台：政大首頁－iNCCU－校務系統Web入口－學生資訊系統—獎助學金查詢\n\n 生僑組最新消息：政大首頁—行政單位—學生事務處—生活事務暨僑生輔導組\n\n \n\n \n\n服務資訊 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n我到藝文中心除了看節目還能做什麼？\n\n \n\n(1)除了欣賞節目、看展覽、看電影、聽演講，還可以借用場地。\n\n(2)4樓博雅書房提供閱讀區、借閱圖書功能。\n\n(3)4樓大廳角落設置有政大校園內唯一的郵局，提供便利的存提款、寄信寄包裹服務。\n\n(4)還有萊爾富超商。\n\n \n\n茫茫大樓，我要何處去找相關承辦人？\n\n \n\n(1)藝文中心的辦公區在5樓，大門一進入即是4樓，一般使用者常將入口大廳的樓層誤以為是1樓。\n\n(2)洽公時如果不熟悉辦公室業務區分或所在，只要接洽4樓大廳的服務台即可，值班人員會提供最佳指引或代為電話聯繫。\n\n \n\n藝文中心有熱線嗎？讓我很快找到你？\n\n \n\n(1)若要打電話：只要記住分機「63393」，值班同仁即可提供接線服務。\n\n(2)若習慣上線：只要設定藝中服務帳號 aas@nccu.edu.tw\n\n(3)若喜歡不失真的感覺，那麼請傳真：02-2938-7618\n\n \n\n \n\n【住宿期間】 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n請問預計第一學期交換出國學生如何申請宿舍？如何辦理？\n\n \n\n預計第一學期交換出國之非限制區學生，可於申請時 (約每年4月)依規定上網申請下學年宿舍，若申請到宿舍，請儘速向住宿組辦理保留(註明第一學期交換出國)至第二學期，並繳交「出國交換之證明文件」(如入學許可信、或國外學校之學生證件等)予住宿組學士班宿舍業務承辦人，第2學期進住日期為2月1日後。\n\n若一整學年交換出國之非限制區學生：請於每年4月初，依規定上網申請宿舍，亦可請在台之親友同學代為申請。出國前已申請到宿舍者，不可遞延該住宿資格至次學年。\n\n \n\n \n\n職涯輔導 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n我想要知道企業實習及徵才資訊，該如何獲得?\n\n \n\n(一)職涯中心網站及各院系所均不定期公布有全職、實習、工讀等訊息，同學可親洽各系所辦公室詢問或上職涯中心網站實習與就業專區查詢。\n\n(二)職涯中心提供線上求職求才系統，可供廠商公告最新職缺(包括全職、實習、工讀)訊息，同學可隨時查詢職缺訊息。\n\n(三)職涯中心每年3月舉辦徵才月系列活動，同學可透過參與企業說明會、徵才博覽會及企業參訪活動了解企業徵才等資訊。\n\n(四)為鼓勵學生參與國際實習，針對海外暑期實習提供部份補助，相關申請規定可參閱本校學生國際性實習活動獎助學金辦理原則。\n\n \n\n我不知道如何撰寫一份好的履歷表，也不知道怎樣準備面試，該怎麼辦？\n\n \n\n職涯中心有學生顧問諮詢團隊，由本校具有工作經驗的碩博士班生組成，提供同學有關履歷表撰寫或面試技巧的諮詢。凡有需要這項服務的，可以上職涯中心諮詢系統預約學生顧問的諮詢時間。每年諮詢期間分為兩學期，上半年約從三月起至六月中旬，下半年約從九月起至十二月中旬。每位同學每學期最多可預約三次，必須在諮詢日至少兩天前進行預約。\n\n \n\n我對於未來生涯發展方向茫然，應該怎麼辦？\n\n \n\n職涯中心提供「職涯諮詢服務」，聘有職場經驗豐富的職涯導師提供服務，您只要連接到職涯中心的諮詢系統 (http://moltke.cc.nccu.edu.tw/CCDRegister_SSO/showRegTable.CCDRegister?table=1)，便可以預約職涯導師的諮詢時間。每年諮詢期間分為兩學期，上半年約從三月起至六月中旬，下半年約從九月起至十二月中旬。每位同學每學期最多可預約三次，必須在諮詢日至少兩天前進行預約。\n\n \n\n我想要瞭解自己的職涯興趣或性向，我該怎麼辦？\n\n \n\n職涯中心有提供兩項免費的職涯諮詢系統，一個是「大專職能診斷平臺」(Ucan)，網址為https://ucan.moe.edu.tw/Account/Login.aspx，只要上線去登錄個人資料，取得帳號與密碼，便可以進行線上施測，該測驗包括職涯興趣探索、共通職涯探索及專業職能探索，歡迎同學多加利用。另外，有一個系統是「生涯與就業協助系統」(CVHS)，網址為：http://www.cvhs.fju.edu.tw/cvhs2014/system/aboutUs。同學只要用本校的email帳號與密碼登入，即可進行測驗。但上述兩個測驗，都是中文測驗版本。\n\n \n\n我想要參加職涯講座，該怎麼報名？\n\n \n\n職涯中心舉辦之職涯講座，均會在職涯中心最新消息區公告，同學只要上網站，便可瀏覽該講座訊息，並且依照公告內容所附報名網址，前往報名即可。\n\n \n\n \n\n課外組器材借用 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n課外組有哪些器材提供借用，在哪裡？\n\n \n\n課外組可借用的器材分別在課外組、四維堂、風雩樓。\n\n(1)課外組：\n\nA.單槍投影機：1台\n\nB.數位攝影機：2台，附攝影機腳架：2支\n\nC.對講機：2袋（每袋6台，含對講機*6、背扣*6、耳機*6）\n\n(2)四維堂：\n\nA.喊話器\n\nB.茶桶\n\nC.延長線\n\nD.小型無限擴音機\n\nE.投影布幕\n\n(3)風雩樓：\n\nA.摺疊桌\n\nB.陽傘\n\nC.椅子\n\nD.斜背式看板（僅提供指示方向，且只能放在馬路旁）\n\n \n\n課外組組內器材的借用流程？\n\n \n\n1.課外組預約登記：填寫「課外組外借器材申請單」、預約登記表，並請器材管理人簽章、課外組輔導老師核章。\n\n2.活動日憑單、押證件、領取器材。\n\n3.器材借出前要仔細檢查是否有缺少或損壞\n\n \n\n課外組組內器材借用的注意事項？\n\n \n\n1.需上過課外組開設的「視聽器材講習課程」方可登記使用。（約每學期第二周開課，共兩堂，擇一參加即可。）\n\n2.每日中午12時前借用，隔日10時前歸還\n\n3.每次借用以二日為限\n\n4.每學期至多借用三次\n\n5.器材借出前要仔細檢查是否有缺少或損壞，若歸還時有缺少或損壞，照價賠償。\n\n6.如有違規情況，由課外組組內會議討論懲處\n\n \n\n課外組四維堂器材借用流程？\n\n \n\n1.活動一周前進行預約\n\n2.填寫「四維堂器材申請單」\n\n3.到四維堂管理員室進行器材預約\n\n4.課外組輔導老師核章\n\n5.活動日憑單、押證件、領取器材\n\n6.器材借出前要仔細檢查是否有缺少或損壞，若歸還時有缺少或損壞，照價賠償\n\n \n\n課外組四維堂器材借用注意事項？\n\n \n\n1.風雩樓器材當日借用，隔日10時前歸還\n\n2.器材借出前要仔細檢查是否有缺少或損壞，若歸還時有缺少或損壞，照價賠償\n\n3.如有違規情況，由課外組組內會議討論懲處。\n\n \n\n課外組風雩樓器材借用流程？\n\n \n\n1.活動一周前進行預約\n\n2.填寫「風雩樓器材申請單」\n\n3.到風雩樓管理員室進行器材預約\n\n4.課外組輔導老師核章\n\n5.活動日憑單、押證件、領取器材\n\n6.器材借出前要仔細檢查是否有缺少或損壞，若歸還時有缺少或損壞，照價賠償\n\n \n\n課外組風雩樓器材借用注意事項？\n\n \n\n1.風雩樓器材當日借用，隔日10時前歸還\n\n2.「攤位組合」每日9時30分後可借出，下午17時前歸還\n\n3.器材借出前要仔細檢查是否有缺少或損壞，若歸還時有缺少或損壞，照價賠償\n\n4.如有違規情況，由課外組組內會議討論懲處。\n\n \n\n \n\n導師制 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n學務處是否提供導師輔導資源？如何取得？\n\n \n\n為協助各級導師對導生之輔導，學務處身心健康中心網站建置「導師制」專區，整合校內資源，彙編「導師輔導資源手冊」，提供導師輔導時各項重要資訊及參考資料，請由學務處身心健康中心網頁下載http://osa.nccu.edu.tw/modules/tinyd0/index.php?id=31\n\n \n\n本校導師制辦理的全校性會議及活動有那些？\n\n \n\n每年11月舉辦一次全校導師會議、每年3月舉辦一次導師輔導知能研討會、每年配合新生住宿日舉辦一次大一新生親師座談會。\n\n \n\n導師制的經費有幾種？\n\n \n\n分為導師一般輔導費、特殊輔導費、班(組)活動費、聯合導師活動費及學院導師輔導費。詳細內容請由身心健康中心網頁→導師制業務→資料下載→補助項目及結報方式http://osa.nccu.edu.tw/modules/tinyd0/index.php?id=31\n\n \n\n各系(所)的導師是怎麼決定的？\n\n \n\n經由系(所)務會議聘請本系（或他系）專任講師以上的老師擔任，再請各系所於導師課管理系統開課，並將導師開課清單及導師名冊送身心健康中心，據以呈核發聘；各系(所)可讓同學自行上網選擇導師，也可直接於導師課管理系統灌檔安排導師。「導師課管理系統操作手冊」請由身心健康中心網頁下載http://osa.nccu.edu.tw/modules/tinyd0/index.php?id=31\n\n \n\n每個系(所)可以聘請幾位導師？\n\n \n\n各院、系（所）應考量實際需要安排班（組）導師，其原則如下：\n\n各級學生由各系（所）安排導師，每三十人一組為原則，由各系（所）派置導師一人，原則採多年一貫制導師，但得保留學生之自主選擇權，以強化輔導功能。惟系（所）主管得依實施情況調整之。\n\n \n\n導師如何運用及處理學生輔導資料？\n\n \n\n為使導師得以確切掌握班上導生的個人背景、課業學習情形、入學以來所曾經面臨的狀況等事項，\n\n學務處設置「導生資料查詢系統」，導師進入系統後，可以完整查詢到所屬每一位導生的所有個人\n\n資料，包括照片的影像呈現，與「導師訪談記錄」之功能，期望此一措施更能促進師生間的互動\n\n與瞭解，使得輔導工作更加落實；未來導師輔導記錄亦將作為相關評鑑與導師績效獎勵之參考。\n\n導生資料查詢系統：請由「愛政大」校園個人化入口登入 http://webapp.nccu.edu.tw/SSO2/default.aspx\n\n \n\n \n\n臺北市立聯合醫院附設政大門診部 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n如何知道健康中心一樓臺北市立聯合醫院附設政大門診部門診時間表？\n\n \n\n相關資訊可以上臺北市立聯合醫院仁愛院區政大門診部網頁查詢。政大教職員工生亦可由政大網頁進入實用資訊服務網頁之聯醫門診部網頁查詢。門診部的櫃檯亦提供小單張提供同學索取，或可直接電8237-7441或8237-7444門診部詢問。\n\n \n\n政大衛保組與臺北市立聯合醫院結盟後，與過去提供的服務有何不同？\n\n \n\n98年6月以前衛保組門診醫療由外聘兼任校醫看診，門診時段只有上班時間之日診；臺北市立聯合醫院則為全民健康保險醫療單位，提供整體全面性之社區醫療服務，服務對象包含本校全體師生及社區民眾；必要時提供轉介服務；門診服務時段有日診及晚診共9科17診次。\n\n \n\n如何使用臺北市立聯合醫院附設政大門診部？需要收費嗎？\n\n \n\n學生攜帶學生證、教職員工攜帶服務證及健保卡，至櫃臺辦理掛號即可就診；本校教職員工生在此門診部就醫免費。\n\n \n\n為何現在到門診部就醫還需負擔部分負擔費用？\n\n \n\n門診部教職員工生就醫的掛號費及部分負擔費用是由本校支付，個人就醫時是免費的，但若醫藥費用超出健保給付範圍則需按比率繳交自付額部分！\n\n \n\n衛保組有何種健康檢測儀器可使用？\n\n \n\n1、血壓計\n\n2、體脂計\n\n3、身高、體重及身體質量指數測量計\n\n \n\n \n\n學生兵役 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n我是大一新生，如何辦理兵役緩徵？\n\n \n\n入學前於新生網頁上網填寫修正基本資料時，填妥「兵役狀況」。若未能於期限內上網填寫，應於開學前於新生網頁下載兵役調查表填妥後送學務處生僑組。\n\n \n\n開學時忘記辦理兵役緩徵申請，有補救的機會嗎？還未開學註冊就接到兵單怎麼辦？\n\n \n\n若是及齡役男，學校在確認已完成註冊後會於開學一個月內，主動幫您辦理緩徵申請。萬一已接到兵單（徵集令），您可以儘速至學務處生僑組申請暫緩徵召證明書，再連同兵單送至戶籍地兵役單位註銷當次徵集。\n\n \n\n我已服完兵役，要如何辦理兵役儘後召集？\n\n \n\n入學前於新生網頁上填寫修正基本資料時，填妥「兵役狀況」，確實填寫服役兵種軍階，開學時請將已服兵役證明影本送學務處生僑組即可。\n\n \n\n我因個人因素免服兵役，應如何辦理免服兵役相關手續？\n\n \n\n入學前於新生網頁上網填寫修正基本資料時，填妥「兵役狀況」，確實填寫免服兵役原因。開學時請將免服兵役證明影本送學務處生僑組即可。\n\n \n\n \n\n僑生輔導事宜 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n僑生初抵臺該如何辦理居留證？\n\n \n\n僑生同學請依下列身分，前往內政部移民署服務線上申辦系統辦理居留證，並注意最新相關規定：\n\n1.持外國護照且以「居留簽證」入境者，應於入境後30天內，備妥下列文件，辦理「外僑居留證」：\n\n(1)護照與簽證\n\n(2)最近二年內二吋半身脫帽正面相片(同我國國民身分證相片規格)\n\n(3)分發書\n\n(4)在學證明\n\n(5)住宿證明/租約\n\n(6)核可後線上繳費\n\n2.港、澳、韓等地區在臺無戶籍者，應先至國內公立醫院體檢，備妥下列文件，辦理「臺灣地區居留入出境證」：\n\n(1)香港或澳門永久居民身分證明文件（效期三個月以上護照或永久性居民身份證）。\n\n(2)最近二年內二吋正面彩色脫帽相片(同我國國民身分證相 片規格)，並應與所持之永久性居民身份證、護照等證件 得以辨識為同一人。未依規定檢附者，不予受理。\n\n(3)海外聯招分發通知書或教育部核備自行招生公文書及在臺 就學學校之在學證明。\n\n(4)最近五年內香港或澳門警察紀錄證明書（三個月內有效）。 但未成年者，免附。\n\n(5)健康檢查合格證明（依中央衛生主管機關訂定之居留或定 居健康檢查項目表辦理，三個月內有效）。\n\n(6)經查驗入境之臺灣地區入出境許可證正本。\n\n(7)親自簽名之香港或澳門居民身分確認書。出生地為大陸地 區者，應另檢附大陸地區未設籍證明書或有效之港澳居民 來往內地通行證（回鄉證）或註銷大陸戶籍公證書。\n\n(8)親自簽名之香港澳門居民申請居留定居申報書。\n\n(9)核可後線上繳費。\n\n＊內政部移民署-臺北市服務站\n\n地址：臺北市中正區廣州街15號\n\n網址：http://www.immigration.gov.tw\n\n查詢專線：02-23889393分機3122、3123（外僑居留證）、02-23899983（臺灣地區居留入出境證）\n\n※詳細申請資料請洽詢內政部移民署，或詢問學務處生僑組。\n\n \n\n如果居留證過期忘記辦理延期怎麼辦？\n\n \n\n居留證於到期日前一個月內需至居住地移民署服務站辦理延期手續。\n\n若逾期未辦理，須依以下方式處理：\n\n(1)外僑居留證逾期：逾期一個月內可至居住地移民署服務站按逾期日數繳交罰款(約新台幣2,000元至10,000元不等)後重新辦理。逾期一個月以上須出境並繳交罰款後再重新辦理。\n\n(2)臺灣地區居留入出境證逾期：無論逾期多久，皆須出境後再重新辦理。\n\n※詳細申請資料請洽詢內政部移民署，或詢問學務處生僑組。\n\n \n\n如果居留證上的資料有變更該怎麼辦？\n\n \n\n居留證上如有居住地址或護照號碼有變更，請持下列證明，於１５日內向居住地移民署辦理變更，逾期將有罰款。\n\n(1)變更居住地址：請持學校住宿證明或校外租屋契約辦理。\n\n(2)變更護照號碼：請持新、舊護照辦理。\n\n※詳細申請資料請洽詢內政部移民署，或詢問學務處生僑組。\n\n \n\n應屆畢業僑生畢業離校後，如何辦理離境？如欲留臺覓職，是否可延長居留？\n\n \n\n有關畢業離境，持「外僑居留證」者無須辦理，離境時於機場繳回居留證後直接出境；持「臺灣地區居留入出境證」需以畢業證書至內政部移民署辦理「單次出境證」，辦理需5個工作天，出境證有效期限10天(含假日)。\n\n如欲留臺覓職者可延長居留，以畢業當月加計6個月為延期居留期限，延期屆滿前，有必要者，得再申請延長1次，總延長居留期間最長為1年，需持畢業證書至內政部移民署辦理。\n\n※詳細申請資料請洽詢內政部移民署或詢問學務處生僑組。\n\n \n\n僑生就學期間生病或意外受傷可否申請醫療補助？\n\n \n\n(1)僑生來台未滿6個月者須投保僑生傷病醫療保險(簡稱僑保)，至全民健康保險特約醫療院所看診後，備妥醫療診斷書、醫療收據、居留證影本、存摺封面影本，並填寫理賠申請書送交生僑組向承保公司申請醫療補助。\n\n(2)持居留證滿6個月後(6個月內得出境1次，不超過30天)，生僑組將主動查驗健保投保資格，確認符合資格後將主動協助投保，日後直接以健保IC卡在健保特約醫院或診所看診。就讀僑大先修班分發本校者，若已加入健保，9月1日起轉入本校續保。領有中華民國身分證者，健保須自行投保，本校不辦理。\n\n(3)不符健保資格者，可由校方協助投保外籍生團體健康保險，以保障在臺就醫權益。\n\n(4)意外受傷亦可申請學生平安保險理賠。\n\n \n\n \n\n軍訓教育 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n本校的全民國防教育軍事訓練課程是必修嗎？內容包含那些？\n\n \n\n本校全民國防教育軍事訓練課程是選修的（2學分），課程內容涵蓋「國際局勢、全民國防、國防政策、防衛動員、國防科技」等領域。\n\n是否列計每學期修習最低學分數或畢業學分，請參考教務處註冊組-畢業審查標準，網址如下：（http://aca.nccu.edu.tw/p3-register_graduate.asp）\n\n \n\n選修全民國防教育軍事訓練課程有何限制？\n\n \n\n凡本校學生皆可選修，另台北藝術大學、陽明大學學生亦可跨校選修。\n\n \n\n \n\n校園安全 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n在學校碰到緊急事件如何尋求協助？\n\n \n\n政大軍訓室每日有教官24小時值勤，對於同學突發之急難提供協助。如有需要任何協助，請立即撥打24小時值勤電話（0919-099119或校內分機66119），為便於使用可將值勤電話輸入手機內或抄收於皮夾內以備不時之需。\n\n有關各教官之詳細資料、授課內容及緊急事件應變處理措施，請至軍訓室網頁瀏覽，網址如下：（http://osa.nccu.edu.tw/tw/軍訓室）\n\n \n\n \n\n預官輔考 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n如何參加研發替代役甄選？\n\n \n\n1.申請資格：\n\n役齡男子具備國內或符合教育部採認規定之國外大學校院碩士以上學歷，具有履行兵役義務者，不限於預官（士）資格，不限於理工醫農等相關科系，均得報名甄選服研發替代役。\n\n2.服役期限：\n\n研發替代役役期較常備兵役役期長3年以內。\n\n※行政院核定之研發替代役役期，義務役期與研發替代役役期之對應如下：義務役1年2個月：研發役3年3個月。義務役1年：研發役3年。\n\n可參考https://rdss.nca.gov.tw/MND_NCA/systemFAQQueryAction.do?queryType=17\n\n \n\n入營服役如何折抵役期？\n\n \n\n一、82年次以前折抵說明：選修「軍訓」或「全民國防教育軍事訓練」均可折抵，每門可折4.5天。若僅修一門「軍訓」或「全民國防教育軍事訓練」，僅可折4天；但若各修一門「軍訓」及「全民國防教育軍事訓練」，因兩種課程可合併計算，所以可以折抵9天。\n\n二、83年次以後折抵說明：選修「全民國防教育軍事訓練」或「101學年度之軍訓-國防科技概論國防科技專題--資訊戰、國防科技專題--武器系統、中國兵學概論--孫子兵法、國防報告書」可折抵役期，每門可折2天，最多10天。\n\n三、符合以上申請資格者，請於畢業或服役前，先至教務處註冊組（行政大樓４樓）申請成績單正本乙份，再至學務處軍訓室（行政大樓３樓）驗證蓋章，入營時向服役單位申辦折抵役期。\n\n申請流程可參閱：http://osa.nccu.edu.tw/tw/軍訓室/軍訓教學與服務/役期折抵作業\n\n \n\n \n\n學生社團 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n請問本校目前有哪些社團，要如何參與？\n\n \n\n本校學生社團分為學生自治團體以及學術性、藝術性、服務性、聯誼性、體適能等六大屬性，目前實際運作的有約162個社團。\n\n社團介紹請上網參閱政大學生團體網頁，參加方式可逕與社團負責人聯繫。\n\n網址http://nccuclubs.nccu.edu.tw/xoops/html/modules/tinyd0/\n\n \n\n請問如何申請成立新社團？\n\n \n\n(1)本大學學生三十人以上聯名發起，於每學期開學後三週內備齊發起學生社團申請書、發起人簽名冊、學生社團章程草案等相關書面文件，交由學生事務處課外活動組轉請學生社團評議委員會審核。\n\n(2)經審核通過之學生社團，應於三週內召開成立大會，通過章程、推選學生社團負責人及幹部，並請學生事務處課外活動組派員列席。\n\n(3)成立大會舉行後二週內，應檢具組織章程、幹部及社員名冊、主要活動項目說明書等，向學生事務處課外組辦理設立登記，始得開始活動。\n\n(4)前款所列各項文件有欠缺者，學生事務處課外活動組得令其於二週內補正，逾期不補正者，得拒絕其登記。\n\n \n\n請問如何申請辦理社團活動？\n\n \n\n(1)活動前一週送交活動計劃表、活動經費預算表。\n\n(2)如為校外活動，應同時登錄緊急通聯系統，確認後，由社團輔導老師進行審核，送生僑組彙報學生平安保險承保單位備查。須注意：出席活動的同學，一定要列入名單中。\n\n(3)活動結束七天內，辦理經費結報。若有延遲，將依逾期期間扣減補助款。\n\n \n\n請問如何申請停止社團運作？\n\n \n\n(1)社團運作有實際困難者，經社員大會決議，得申請停止社團活動(以下簡稱停社)或撤銷社團登記；無法召開社員大會時，應由社團導師簽准後，申請停社。\n\n(2)社團有一年以上未實際運作且一年內未至學生事務處課外活動組更新社團資料者，得由學生事務處課外活動組輔導老師提報停社申請案送交學生社團評議委員會議決議。\n\n(3)停社之社團，未於停社後二年內申請恢復社團活動者，撤銷其社團登記。\n\n(4)停社之社團，社團負責人需於學生事務處課外活動組通知後一個月內，清點社團財產併同財產清單交由學生事務處課外活動組代為保管。\n\n社團申請恢復活動經學生事務處課外活動組許可後即可領回前項代管財產。\n\n \n\n請問社團有無指導老師?要聘請校內或校外老師?\n\n \n\n社團應聘請本校專任教職員中富有社團相關知能且熱心輔導者擔任社團指導老師，並得視社團特殊專業需求聘請學有專精之校外指導老師。社團指導老師聘期一學年，由學生事務處課外活動組簽請校長核准後頒發聘書。\n\n \n\n何謂紅紙廊、紅紙廊義工團？\n\n \n\n民國17年政大前身「中央黨務學校」以建鄴路紅紙廊定為永久校址。\n\n民國72年10月8日舉辦社團負責人研習會首度以紅紙廊為名，從此紅紙廊代代相傳，成為培育優秀社團負責人的搖籃。\n\n紅紙廊舉辦的宗旨在於協助社團負責人和幹部提升社團經營能力與服務精神，增進社團交流與合作，帶動社團創新與發展。每一次活動內容都經過多方面的資料蒐集和長期的籌備，研習會中希望透過各種講座、觀摩、實作、討論，為前來的夥伴帶來新的觀念與啟發，成為社團經營最大的助益。\n\n服務與創新是紅紙廊的基本精神，讓我們在紅紙廊中相互學習、彼此激勵，一起開創多元豐富的社團文化，也為在政大的歲月留下多釆多姿的回憶。\n\n參與紅紙廊服務的同學稱為課外組「紅紙廊義工團」，負責籌畫營隊及期中社團經營相關課程(每學期2-3次)，必要時也協助課外組相關活動辦理。\n\n \n\n請問課外組有那些器材可供同學借用？要到那裏去借？\n\n \n\n(1)課外組：單槍投影機、數位攝影機(自備DV錄影帶)、對講機(5支)，請自備3號電池)。\n\n(2)四維堂管理員室：茶桶、喊話器、延長線、活動海報版、擴音機、麥克風。\n\n上述兩類皆須於活動三天前預約登記\n\n(3)風雩樓管理員室：擺攤用的折疊桌、鋁椅、陽傘(週一至週五上午9時至下午5時前)。\n\n \n\n請問器材借用的程序為何？\n\n \n\n(1)課外組的視聽器材可於每個月月初至課外組預約，借用者必須上過視聽器材課程始得借用(每學期初第二週開課)。\n\n(2)四維堂相關器材：填寫器材借用單(課外組網頁表格下載)→輔導老師蓋章→帶證件至四維堂管理員室借用(可先預約)→歸還領回證件。\n\n(3)風雩樓相關器材：填寫器材借用單(課外組網頁表格下載)→輔導老師蓋章→帶證件至風雩樓管理員室借用→歸還器材領回證件。\n\n \n\n請問那些地方張貼海報要到課外組蓋章？有什麼特別規定？\n\n \n\n(1)海報柱\n\n1.本區以張貼學校各單位及社團所主辦或協辦之活動訊息為主。\n\n2.各活動僅可貼兩張海報(不限大小)或宣傳單，為期二週。\n\n3.需張貼者請送至課外組蓋章，即可自行張貼。張貼日到期，請即自行拆除，否則將紀錄，列入社團評鑑評分之考量，並限制其日後使用權限。\n\n(2)行政大樓公車候車處公佈欄 (目前暫停使用)\n\n1.本區以張貼學校單位及社團所主辦或協辦之活動訊息為主。\n\n2.各活動僅可張貼一張海報(A1半開以內)或宣傳單，為期一週。\n\n3.需張貼者請送至課外組蓋章，即可自行張貼。張貼日到期後，請自行拆除，否則將紀錄，列入社團評鑑評分之考量，並限制其日後使用權限。\n\n(3)麥側公佈欄\n\n1.本區可張貼學校各單位及社團所主辦或協辦之活動訊息。\n\n2.各活動僅可貼一張海報(A1半開以內)或宣傳單，為期一週。\n\n3.需張貼者請送至課外組，本組將於每日下午三時三十分派員張貼。\n\n※注意事項\n\n1.自行張貼時，請不要使用雙面膠帶(嚴禁泡棉膠)。\n\n2.麥側海報如果事後要留存，請預先告知課外組承辦。\n\n3.上述三處所若張貼未經本組核准之海報或宣傳，將予以拆除。\n\n \n\n請問風雨走廊海報版可以張貼海報嗎？有什麼特別規定？\n\n \n\n風雨走廊海報版\n\n1、本區可張貼學校各單位及社團所主辦或協辦之活動訊息，無須申請，可自由張貼；不提供校外單位張貼。\n\n2、張貼時間：請於海報「張貼截止日」前，自行撤除，張貼期間以一個月為限。請於張貼截止日前，自行撤除。若未自行撤除，他人可代為撤除，以使用該海報格。若逾截止日後達3日以上之海報，未自行撤除，列入違規紀錄。\n\n3、海報張貼尺寸：限定小於A3直式之海報大小。\n\n4、其他注意事項，請詳見本校「風雨走廊海報版管理規定」及「張貼範例」。\n\n5、若違反相關規定，課外組將逕行拆除，予以紀錄公告，並列入社團評鑑評分之考量；若一學期中，違規達3次，於公告日後6個月內不得再使用。\n\n \n\n學生社團經費預算提出的截止時間為何？\n\n \n\n每學期提出學生團體活動計畫，並提出經費補助申請，原則上，第一學期為10月1日、第二學期為3月1日，當天下午5點前，送達課外組相關輔導老師收。\n\n \n\n請問如何申請社團經費補助?\n\n \n\n每學期初申請一次，各社團依課外組公告時間，繳交學生團體活動計畫彙總表暨活動經費預算表，將期間內所有活動所需經費列出（大型活動與專案活動，需提交企畫書），課外組整理送交學生團體經費審核委員會審核。\n\n \n\n何種活動需列入經費預算？\n\n \n\n只要是各社團預定要舉辦的活動，都應事先規劃所需的各項經費大約實際數字為何，詳細列舉。專案非平時性質的活動，請檢附詳細的活動企劃書（若當學期尚未規劃完成，可以前一次活動成果報告書替代），以利審核委員參考並決定補助的理由與金額。\n\n \n\n請問學校社團經費如何分配?有無評審制度?\n\n \n\n社團經費的審核是由學生團體經費審核委員會共同討論，從92學年度開始實施。審核委員會的委員，除學務長、課外活動組組長、課外活動組六大類型學生團體輔導老師、學生會會長、研究生學會總幹事、六大類型學生團體委員會主席為當然委員外，由學務長敦請學生社團諮詢委員會或評議委員會兩位教師代表擔任，任期一年。審核委員會由學務長擔任召集人。社團經費分為平時活動、大型專案活動、社區服務、品德專案及服務性專案，分別審核；平時活動佔40%、大型專案活動佔10%、社區服務、品德專案及服務性專案共佔50%。\n\n \n\n對於社團經費審查初審結果有疑義時該怎麼辦？\n\n \n\n得於公告後10日內向審核委員會提出複審之請求，但僅限原已提出初審之活動為原則。未提出初審之活動，無論係漏列或新決定舉辦之活動，將歸為15%臨時性活動的補助，由課外組輔導老師共同依職權酌予補助。\n\n \n\n經費審核會議已決議補助之活動，當學期未舉辦時該怎麼辦？\n\n \n\n該社團應提出書面說明，以免影響下學期的經費補助。\n\n \n\n未按時提出結報申請之活動，仍能夠獲得補助嗎？\n\n \n\n若因非可歸責於社團本身之因素且已事先提出延遲結報，仍給予全額補助；若未報備，一個月內以90﹪、二個月內以80﹪、三個月以上70﹪之原補助金額計算。\n\n \n\n比賽活動之補助方式為何？\n\n \n\n若單純為報名費之補助，以兩隊為限，每學期以2次為限，由輔導老師直接提報；若含其他補助項目，必須提課外組組務會議討論。\n\n \n\n各類型社團是否可以辦理「社團聯合活動」？\n\n \n\n各類型社團可以彼此結合辦理「社團聯合活動」，其補助原則為每學期每類型社團之聯合活動，以一次為原則，金額以五千元為上限，但必須繳交成果報告書，做為經驗傳承之用。\n\n \n\n如何申請課外活動證明？\n\n \n\n上課外組網頁下載填寫「課外活動證明申請書」→根據標準規格繕打→根據需要影印份數多加一份→承辦人審核→本組組長簽核→承辦人用印。\n\n說明：（1）社團（系學會）職位或活動請附相關之證明資料；如證明、聘書、參加活動證明、社團通訊錄、刊物等；如無則改附社團（系學會）指導老師、輔導老師或社長簽章之佐證資料。\n\n（2）申請中英文活動證明需預留三個工作日，若有修改，工作日另計。\n\n \n\n請問本校會舉辦社團幹部訓練嗎？\n\n \n\n會，課外組每學期舉辦一次「學生團體負責人研習營」，通稱紅紙廊；\n\n在為期三天二夜的活動中，讓同學習活動企劃、溝通技巧與團隊合作，並於活動中增進對其他社團的認識與瞭解。每學期期初並辦理「行政講習」使同學在借用學校相關場地、器材、海報張貼及經費使用上，有較清楚的概念。另外還有紅紙廊期中課程，加強對社團幹部的訓練。\n\n \n\n學生參與國際活動，有哪些是可以申請學校經費補助？\n\n \n\n本校學生團體(含個人)參與國際性學生活動，包括文化訪問、義工服務、社團交流會議、競技比賽、觀摩訪視、培育訓練，均可依照「國立政治大學學生參與國際性學生活動獎助學金辦理原則」申請補助。本獎助學金適用之國際性學生活動補助範圍包括：本校舉辦或應邀參加之活動、本校推派參加之活動、學生團體舉辦或應邀參加之活動、個人參加之活動。\n\n \n\n學生參與國際活動如何申請補助？\n\n \n\n如果需要申請參與國際活動的獎助學金申請，請必須在活動舉辦日期至少一個月以前，填列「國立政治大學學生參與國際性學生活動獎助金申請表」(詳情請見課外組表格下載。http://osa.nccu.edu.tw/tw/課外活動組/法規表格/表格下載)，並檢附申請表、計畫書、成績單、自傳等，向學務處課外活動組提出申請。本組將邀請校內師長組成審核委員會加以審核，審核結果將通知申請的團體(同學)。\n\n \n\n請問獎助金審核標準如何?如果獲得本校國際活動補助，如何結報？有無相關義務？\n\n \n\n本獎助金以補助機票為主，審核標準包含活動屬性及航程之遠近，以書面審核為主要方式。獎助金額分為部分補助，家境清寒學生得從優補助。\n\n凡獲得本項獎助學金補助者，應於活動結束後兩個星期內，檢附活動心得(含電子檔及紙本)、活動照片、暨相關單據(購票收據、登機證、電子機票)，逾期結報與未繳交資料者，取消其補助。凡獲得補助者，必須參加每學期初的國際活動成果發表會及超政新生營國際分享會，發表個人心得。\n\n \n\n學生團體如何申請成立？\n\n \n\n1.學生社團之設立，應經登記。\n\n2.學生社團申請登記程序如下：\n\n(1)本大學學生三十人以上聯名發起，於每學期開學後三週內備具發起學生社團申請書、發起人簽名冊、學生社團章程草案等相關書面文件，交由學生事務處轉請學生社團評議委員會審核。\n\n(2)經審核通過之學生社團，應於三週內召開成立大會，通過章程、推選學生社團負責人及幹部，並請學生 事務處派員列席輔導。\n\n(3)成立大會舉行後二週內，應檢具組織章程、幹部及社員名冊、主要活動項目說明書等，向學生事務處辦 理設立登記，始得開始活動。\n\n(4)前款所列各項文件有欠缺者，學生事 務處得令其於二週內補正，逾期不補正者，得拒絕其登記。\n\n \n\n學生社團章程應包括哪些內容？\n\n \n\n學生社團章程，應載明下列事項：\n\n1.名稱。\n\n2.宗旨。\n\n3.組織與職掌。\n\n4.社員入社、退社及除名之條件。\n\n5.社員之權利及義務。\n\n6.幹部名額、權限、任期、選任及解任。\n\n7.會議召集及決議方式。\n\n8.經費之運用與管理。\n\n9.章程之修改。\n\n10.訂定章程之年月日。\n\n學生社團章程，應由發起人簽名。\n\n \n\n「學生團體活動緊急通聯系統」適用時機為何？\n\n \n\n學校為確實掌握學生團體辦理校外活動之時間、地點、人員等狀況，於緊急情況下發揮緊急通聯機制，特建置「學生團體活動緊急通聯系統」，因此，凡本校學生團體辦理校外活動，均需登錄「學生團體活動緊急通聯系統」\n\n \n\n「學生團體活動緊急通聯系統」作業流程為何？\n\n \n\n1.學生團體活動負責人：\n\n(1)應於校外活動辦理前1週（例行活動）或前2週（大型活動）進入本校網站，點選「在校學生」、「資訊服務」項下「學生團體活動緊急通聯登錄系統」，登錄活動相關資訊。\n\n(2)列印活動申請單及參加人員名單。\n\n(3)連同學生團體活動計畫表送交輔導單位進行書面審查。\n\n2.輔導單位：\n\n(1)進行書面審查與簽核。\n\n(2)會簽生輔組辦理「學生團保特定意外險核備」事宜。\n\n(3)進入本校「行政管理系統」項下「課外活動組資訊系統」，點選「緊急通聯活動資料」，確認活動審核結果。（首次啟用請先至本校「行政資訊系統」、「系統安裝程式」、「行政管理系統」項下安裝「課外活動組資訊系統」）\n\n(4)寄發Email通知活動負責人及副知軍訓室。\n\n3.軍訓室：\n\n(1)進入本校網站，點選「教職員工」、「資訊服務」項下「學生團體活動緊急通聯聯繫紀錄系統」，以掌握學生團體校外活動之動態情況。\n\n(2)遇緊急情況或必要時應與活動負責人或緊急聯絡人聯繫，並於系統紀錄通聯事項。\n\n \n\n請問學校那裏有鋼琴可以借用練習？\n\n \n\n藝文中心及四維堂都有鋼琴可供借用，四維堂部份：\n\n(1)對象：本大學在校學生(個人)每人每學期以登記每週一節（五十分鐘）為原則。\n\n(2)申請書：請至四維堂填寫。\n\n(3)費用：每學期新台幣貳佰元(登記後，三日內至出納組繳費，收據繳交四維堂管理員室確認)。\n\n(4)練習時間：依課外組公告，每天上午8時至下午5時。\n\n(5)注意事項：\n\n1.練習時請向四維堂管理員押學生證及簽名後，方可使用。\n\n2.申請書：練習登記申請書現場辦理。\n\n3.不借為文化盃練唱(已另安排時段)\n\n \n\n申請借用場地的紙本從何處取得？\n\n \n\n請至政大首頁選取「行政單位」→「學生事務處」→「課外活動組」→ 左方列表點選「表格下載」→ 找「07.場地借用」，即可看到列表如下：\n\n1.四維堂暨雲岫廳活動流程視聽服務需求表\n\n2.課外組外借器材申請表\n\n3.課外組外借器材申請表 (借用摺疊桌、陽傘、椅子)(風雩樓)\n\n4.課外組外借器材申請表 (四維堂)\n\n5.四維堂提供使用收費標準表\n\n6.風雩樓雲岫廳提供使用收費標準表\n\n7.課外活動組場地資訊列表\n\n8.課外活動組各場地可借用時間表\n\n \n\n備妥申請借用場地的紙本表單，如何繳費？\n\n \n\n1.最遲於活動兩週前，以學生團體活動報告表提出借用申請，兩週內完成借用手續。\n\n2.場地借用經核准後於一週前至本校出納組繳交費用。（影印）收據乙份併案辦理。\n\n3.將借用場地紙本（單）及繳費（影印）收據乙份併案辦理送場地管理員確認。\n\n以上即完成借用場地手續。\n\n法令依據：民國九十年五月十六日第五七二次行政會議修正通過\n\n \n\n可供學生活動借用的學校器材可分為哪幾類？\n\n \n\n1.風雩樓外借（折疊桌、陽傘、椅子）等器材。\n\n2.四維堂外借（喊話器、茶桶、校旗、小型無線擴音機、延長線、吉他用音箱）等器材。\n\n3.視聽（單槍投影機、數位攝影機）等器材。\n\n \n\n如何取得外借器材申請表？\n\n \n\n請至政大首頁選取「行政單位」=> 選擇「學生事務處」=>相關連結選取「課外活動組」=> 點選「線上服務」=> 於文件下載找「場地借用」，即可看到列表如下：\n\n場地借用\n\n課外活動輔導組外借器材申請表-四維堂(借據聯)\n\n課外活動輔導組外租(借)器材申請表(借據聯)\n\n課外活動輔導組外借器材申請表-風雩樓(借據聯)\n\n \n\n學生社團如何借用器材？\n\n \n\n1.填寫器材借用單請輔導老師同意蓋章，持借據聯至風雩樓借取器材\n\n2.填寫器材借用單請輔導老師同意蓋章，持借據聯至四維堂借取器材\n\n3.填寫器材借用單請輔導老師同意蓋章，持借據聯至四維堂借取視聽器材\n\n \n\n學生至工友管理員室借用器材時，應注意哪些事項？\n\n \n\n1.借用風雩樓及四維堂器材：\n\n(1)借用器材品時，應提前洽妥領取時間，並預留時間瞭解操作方法。\n\n(2)借用時應仔細檢查並當面測試確認器材功能正常。\n\n(3)器材應愛惜使用，妥為保管，損壞時照價賠償。\n\n(4)器材借用以當日借用，翌日中午前歸還為原則。\n\n(5)逾時未歸還依情節輕重停止借用權限，並列入社團評鑑成績計算。\n\n(6)租借器材請先行至四維堂預約，再至出納組繳費。\n\n(7)領取器材時，需暫押學生證或身份證；器材歸還時，退回證件。\n\n(8)借用折疊桌、陽傘、椅子無須預約，只需押證件借取，其餘事項同上。\n\n2.借用四維堂視聽器材：\n\n(1)借用者須已參加過視聽器材使用講習。\n\n(2)借用器材品時，應提前洽妥領取時間，並預留時間瞭解操作方法。\n\n(3)借用時應仔細檢查並當面測試確認器材功能正常。\n\n(4)器材借用每日算法以當日中午前借翌日中午前歸還為原則，每次借用以二日為限，每一學期以三次為原則。\n\n(5)器材應愛惜使用妥為保管，若使用不當造成損壞須原價賠償。\n\n(6)器材應依時限內歸還，逾時未歸還依情節輕重停止借用權限，並列入社團評鑑成績計算\n\n(7)租借視聽器材請先行至四維堂預約，再至出納組繳費。\n\n(8)領取視聽器材時，需暫押學生證或身份證；器材歸還時，退回證件。\n\n \n\n學生社團評鑑評分的標準及評分的項目為何？\n\n \n\n社團評鑑分「平時評鑑」與「年度評鑑」雙項考評。\n\n(一)、平時評鑑（佔50%），評鑑項目包括：1. 社團活動規劃及執行2. 社團辦公室及器材室之使用與維護3. 活動場地、器材之使用及海報、文宣品之張貼4. 社團幹部出席會議及研習活動5. 社團成員登錄與社團網頁或電子佈告欄使用。\n\n(二)、年度評鑑（佔50%），評鑑項目包括：1. 組織運作(組織章程、年度計畫與管理運作)2.社團資料保存與資訊管理3. 財物管理(經費控管及產物保管)4. 社團活動績效(社團活動及服務學習)。\n\n \n\n學生社團評鑑人員如何組成？\n\n \n\n(一)、平時評鑑：由課外活動輔導組社團輔導人員於學年中依活動事實進行評鑑。\n\n(二)、年度評鑑：由校內外專業人士、社團指導老師代表、學生自治團體代表、各類型學生社團委員會主席共同進行評鑑。\n\n \n\n沒有參加社團評鑑的社團會怎樣？\n\n \n\n依本校社團評鑑暨觀摩實施要點第六條第十款規定，未參加評鑑的社團，提交學生社團評議委員會，視情節予以口頭警告、停止當學期所有經費補助或其他社團權益。\n\n \n\n政大美展有那些類別可以參賽？有何規格限制？\n\n \n\n有西畫組、國畫組(以不超過四尺宣紙全開為限)、攝影組(作品以政大校園及師生活動為主，附近社區風貌為輔，尺寸一律需為12×16吋)、海報設計組(作品以本校校慶為主題，初稿以A3 size參賽，入選校慶海報者，需將校慶海報完稿)，另有書法組(請中文學系辦理，優勝作品一併於政大美展展出)。\n\n \n\n \n\n服務學習 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n何謂認證型服務學習?服務學習修習時數多少?\n\n \n\n本校服務課程名稱為「服務學習與實踐課程」，必修、零學分。課程內容分為課程型及認證型兩類。認證型服務學習是由學務處就學生參與校外服務工作認證之。\n\n大一至大四期間，修習兩學期，每學期總時數不得低於十八小時，同一門科目亦得重覆修習。\n\n \n\n請問如何申請認證型服務學習?是否需要事先提出書面申請?多久前提出?\n\n \n\n1.本校大學部在學學生，得提出申請修習認證型課程，分兩類：\n\n(1)個人申請校外服務者，須經系主任同意。\n\n(2)社團申請校外服務者，須經社團指導老師同意\n\n2.申請方式：選課學生必須先填寫申請書，於規定期限內向學務處課外活動組〈以下簡稱課外組〉提出申請，經「國立政治大學認證型服務學習與實踐課程審議委員會」審議通過後，自行參與服務活動。\n\n3.申請時間\n\n(1)服務時間為暑假及上學期者，每年5 月依公告提出。\n\n(2)服務時間為寒假及下學期者，每年11 月依公告提出。\n\n申請案經委員會議審議通過後，如無正當理由，不得撤回。\n\n4.選課學生應於服務活動結束後檢附「時數證明單」，團體申請者另附「團體服務認證名單」，送課外組提送「國立政治大學認證型服務學習與實踐課程審議委員會」審議。\n\n \n\n請問申請認證型服務學習流程如何?\n\n \n\n提出申請書→本校「國立政治大學認證型服務學習與實踐課程審議委員會」審議→從事服務活動→繳交服務紀錄→提送委員會認證抵免→成績登錄\n\n \n\n \n\n大型活動 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n校慶系列活動的時間多半是安排在什麼時候？學生一定要參加校慶系列活動嗎？\n\n \n\n校慶大會會在每年的5月20日舉辦，校慶蛋糕大賽及音樂會多半會在5月20日前一週舉辦，校慶停課是為了讓大家能更瞭解學校並盡情地在各項活動中享受箇中樂趣，除了課外組主辦的校慶大會、蛋糕大賽、音樂會外，體育室也很用心地舉辦了運動會、啦啦隊競賽等，都有很多學生參與，如果錯過了這些活動，就很可惜。\n\n \n\n政大有那些大型的校內課外活動？\n\n \n\n目前校內的大型活動有:\n\n1.校慶系列活動：\n\n(1)校慶慶祝大會：大會將頒授校內教學、研究特優老師、優秀行政人員及優秀學生等獎項。\n\n(2)校慶蛋糕大賽：全校師生一起裝飾蛋糕，增添校內慶祝氣氛。\n\n(3)校慶音樂會:透過音樂文化交流，增添藝文氣息，慶祝校慶。\n\n2.畢業典禮\n\n3.超政新生定位創意營：為新生所規劃的「預備開學週」，讓新生能更瞭解如何運用校內資源，並及早確立自我的人生規劃方向。\n\n4.文化盃合唱比賽：學唱校歌並凝聚新生對系上的向心力。\n\n \n\n可以報名校慶活動擔任工作人員嗎？\n\n \n\n課外組在每年第二學期都會針對校慶活動開設服務學習課程，招募活動的工作人員，除了能親身參與校慶活動的籌劃與執行外，還可以實際操作課程中的趣味點子喔。\n\n \n\n誰可以在校慶大會上接受頒獎？\n\n \n\n學生獎項的部分有優秀學生及陳百年學術論文獎，前者由課外活動組每年第一學期舉行遴選活動，後者為文學院主辦，上台受獎的同學皆須著正式服裝，並推派代表致詞。\n\n \n\n若我是延畢生，要參加哪一屆的畢業典禮？\n\n \n\n延畢生可自行選擇要參加大四當屆或正式畢業那屆畢業典禮，若是參加正式畢業那屆畢業典禮，要記得告訴系辦助教請其協助保留座位，並請自行至課外活動組領取家長邀請卡。\n\n \n\n請問畢業典禮家長邀請卡何時可以領取？\n\n \n\n學士班大四應屆畢業生由課外組統一郵寄給家長，延畢生、碩班生、博班生部分，每年約在5月20日後送至各系(所)，由系(所)協助轉送所屬畢業生。\n\n \n\n請問畢業典禮家長開車，是否可停在校內？家長觀禮人數有無限制？\n\n \n\n畢業典禮當天開放家長車輛入校停放，停放位置為山上及環山停車場，需搭乘校內接駁車至山下參加典禮。因校內車位有限，建議家長多利用大眾運輸工具，以避免停車位不足，造成困擾。參與人數部分原則上沒有限制，歡迎家長到場觀禮。\n\n \n\n畢業典禮會場內，家長可以跟畢業生坐在一起嗎？\n\n \n\n畢業典禮會場一樓為畢業生座位區，觀禮家長則安排於二樓觀禮區就坐，謝謝。\n\n \n\n畢業典禮會場有無門禁管控？\n\n \n\n為使典禮進行順暢，避免干擾，典禮開始後會實施只出不進之門禁管制，以維持會場秩序，敬請觀禮家長配合於典禮開始前進場入坐。\n\n \n\n上台接受校長授予畢業證書之各系人選，如何產生？\n\n \n\n1.學、碩士班：由各系各推薦1名畢業學生，代表上台接受校長授予畢業證書。\n\n2.博士班：畢業之博士生皆可經由系(所)推薦，上台接受校長授予畢業證書。\n\n \n\n畢業生致詞代表及感恩禮代表如何產生？\n\n \n\n1.致詞代表：上、下午場畢典由全校公開甄選各一名應屆畢業生代表致詞，相關甄選訊息會於課外組網頁公告。\n\n2.感恩禮代表：由學生會與畢委會各推薦一名學生分別於上、下午場畢典代表行感恩禮。\n\n \n\n超政新生定位創意營甚麼時候舉辦？我一定要參加超政新生定位創意營嗎？\n\n \n\n超政新生定位創意營是政大大一新生的入學預備週，舉辦時間就是新學年開學的前一週。\n\n相當於正式大學生涯學習的開始，所以每一位新生都有權利也應該要參加。\n\n \n\n超政新生定位創意營的目的是甚麼？\n\n \n\n大學教育並不只是高中教育的延續，大學要培養的是未來社會的中堅。超政新生定位創意營希望讓參與的新生們迅速地掌握校內外資源，並為自己描繪未來的願景，進而能擁有充實愉快的大學生涯。\n\n \n\n超政新生定位創意營可以請假嗎？參加超政新生定位創意營要繳錢嗎？\n\n \n\n如果有正當理由及證明就可以請假。超政營期間會發放學生證、辦理體檢、進行院系輔導等，沒有參加營隊的人必須另外找時間自行辦理。超政的課程、活動及場地等開支均由學校負擔，參加的學員僅需負擔自己的餐食及日常生活費用。\n\n \n\n文化盃合唱比賽甚麼時候舉辦？參加者是誰？\n\n \n\n文化盃合唱比賽於每年12月的第二個週六，下午13時至19時舉行。\n\n是以系所為單位組隊參加，每系組成一隊，所以只要你是系上的一份子，請向系上學長姐報名，就可以參加合唱，為系爭光。\n\n \n\n文化盃合唱比賽的練場場地何時開放借用？\n\n \n\n由於文化盃合唱比賽練唱場地需求相當大，山下校區練唱場地將由主辦單位統一借用，於第二學期開學後公告借用方式及使用時間，請各系負責人注意公告，並於期限內至課外組借用。各系請勿以各種名義借用山下校區教室練唱，以免妨礙夜間教學及其他社團權益。\n\n \n\n文化盃合唱比賽要怎麼報名？\n\n \n\n1.課外組於每年第二學期開學前會請各系辦公室回報文化盃負責人的聯絡資料，並於開學後將文化盃報名方法及練唱場地借用辦法公告於課外組網頁，會寄電子信件至各系負責人信箱。\n\n2.開學後兩週內（9月下旬前）會召開各系協調會，會中將討論有關比賽之重大事項，請各系負責人務必出席。\n\n \n\n \n\n性別平等 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n什麼是校園性侵害或性騷擾事件?\n\n \n\n校園性騷擾事件：指性侵害或性騷擾事件之一方是學校校長、教師、職員、工友、或學生，他方為學生者（不論是否同校）。\n\n \n\n性騷擾事件常見的類型？\n\n \n\n常見的校園性騷擾的類型有：\n\n1.言語的騷擾\n\n2.肢體上騷擾\n\n3.視覺的騷擾\n\n4.不受歡迎的性追求或性要求\n\n \n\n性騷擾或性侵害事件有沒有申訴期限？\n\n \n\n校園性侵害或性騷擾事件無申訴期之限制，畢業後仍可以提出申訴，惟經過的時間久遠，要進行調查或訪談證人較為困難。\n\n在一般場所或公共場合遭受到性騷擾(性騷擾防治法)：需於事件發生後一年內提出。\n\n \n\n提出校園性侵害或騷擾事件調查申請後，學校會不會循私不處理?\n\n \n\n只要申請人或檢舉人提出調查申請書（不論親自申請或檢舉，書面或 言詞均需親自簽名），「性別平等教育委員會」依法會召開性平會決議是否受理；如有調查必要時，就會組成調查小組。\n\n \n\n在調查過程中，學校可以協助的項目？\n\n \n\n學校會依當事人需要，提供下列相關協助：\n\n1 心理諮商輔導\n\n2 法律諮詢管道\n\n3 課業協助\n\n4 經濟協助\n\n5 其他經性別平等教育委員會認為必要之協助。\n\n \n\n提出調查申請後，多久才會知道調查結果？\n\n \n\n向性平會提出申請後，依性別平等教育法，二個月內需完成調查，但必要時得延長一個月至二個月。但如果性平會對被調查人有懲處建議時，性平會就必須將懲處建議案移送權責單位議處。性平會收到懲處單位的懲處結果後，會通知雙方當事人調查結果。\n\n \n\n我沒有具體的性騷擾證據，申訴有用嗎?\n\n \n\n如果有各種相關的書面、錄音、或是網路資訊（如e-mail）等直接證據當然可以成為具體佐證。如果沒有具體的證據，調查小組也會由事件發生的經過，再訪談知悉的相關證人後，多方面加以研判。\n\n \n\n萬一不幸遭到性侵害了，該怎麼辦？\n\n \n\n萬一真遇到不幸，請務必先以己身安全為首要，然後：\n\n1.相信自己並沒有犯錯。\n\n2.找個安全的地方待著。\n\n3. 找信任的人陪伴並尋求協助(如家人、學校心理諮商中心、教官、導 師或警衛隊等學校相關單位，或撥「全國婦幼保護專線-113」，或向警方報案。\n\n4. 不要洗澡，也別換衣服，保存相關證據，盡快就醫，協助警方蒐集線索及採證。\n\n5.如果是陌生強暴，請牢記歹徒各項特徵。並且保留現場完整，不要移動或觸摸現場任何器物。\n\n6.向學校性別平等教育委員會申請調查。\n\n \n\n若對於懲處的結果不服，我可以救濟嗎？\n\n \n\n可以於收到書面通知次日起20日內，以書面具明理由向學校提出申復，以一次為限。如果發現調查程序有重大瑕疵，或有足以影響原調查認定之新事實、新證據時，得要求性平會重新調查。\n\n \n\n性侵害或性騷擾事件的申訴窗口?\n\n \n\n校園事件：向學生事務處學務長室李小姐(分機62263)。\n\n在一般場所或公共場合遭受到性騷擾：知道加害人有所屬單位者，可依據性騷擾防治法向加害人所屬單位或直轄市、縣（市）政府提出申訴。\n\n本校職場性騷擾(性別工作平等法)之申訴窗口：人事室二組組長(分機63310)。\n\n \n\n \n\n學生申訴 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n學生申訴之範圍？受理申訴的對象？\n\n \n\n一、申訴範圍：\n\n必須是對於本校之懲處、其他措施或決議，認為行政處分有違法或不當，致損害其權益者，方為申訴範圍。\n\n二、受理對象：\n\n1.學生：本校對其處分時，具有學生身分者為限。\n\n2.學生自治組織：指系學會、學生會、研究生學會等組織。行使提案權時須經過其系會員大會、學生議會、研究生代表會等會議提案通過，並檢具相關佐證資料。\n\n \n\n對本校相關單位有不滿或建議，可以申訴嗎？\n\n \n\n學生申訴制度屬學生權益救濟性質，應以學生個人權益受損為前提。以陳情、建議、檢舉以及其他方式表示意見者，不適用申訴處理辦法之規定。如要表示意見，請向主管業務的單位提出。\n\n \n\n學生申訴評議委員會怎麼組成的? 有幾位委員？\n\n \n\n申評會由9位學院教師代表、1位法律專長教師代表、1位心理專長教師代表、教務處、學務處、總務處代表，以及4位學生代表共同組成，現任委員18位。\n\n \n\n提出申訴有期限嗎?向哪個單位提出申請？需要準備什麼文件?\n\n \n\n一、提出申訴期限：\n\n收到本校之懲處、措施或決議後，如有不服，應於次日起20日內提出申訴。但因天災或其他不應歸責申訴人之事由，而致延誤申訴期限者，於延誤原因消滅後10日內，得向申評會聲明理由，請求受理。但延誤申訴期間已超過一年者，不得申請。\n\n二、收件單位：\n\n　　向學務處學務長室提出申訴。諮詢電話，校內分機62202。\n\n三、應備文件：\n\n1.申訴書\n\n2.檢附行政處分及相關佐證資料。\n\n3.相關之法令規章、處理流程以及申訴表單，請參閱學務處網頁 (http://osa.nccu.edu.tw/學務長室/學生相關/學生申訴)。\n\n \n\n因退學或開除學籍提出申訴，在未作成評議決定前，可否繼續留在學校上課？\n\n \n\n一、退學或開除學籍之學生提出申訴者，得向學校(教務處)提出繼續在校肄業之書面申請。\n\n二、學校接到在校肄業申請後，會徵詢申評會之意見，並衡酌當事學生的生活、學習狀況，於7日內書面答覆，並載明學籍相關之權利與義務。\n\n三、依上述申訴管道經本校同意在校肄業者，學校除不得授給畢業證書外，其他修課、成績考核、獎懲得比照在校生處理。\n\n \n\n提出申訴多久才知道評議結果?\n\n \n\n一、申訴提起後除有中止評議之情形外，申評會應於收到申訴書次日起30日內完成評議，並作成評議決定書。\n\n二、申訴評議期限，必要時得延長，最長不得逾二個月。但涉及退學與開除學籍之申訴案件不得延長。\n\n \n\n提出申訴後可以撤案嗎?如何申請?\n\n \n\n一、只要在申評會未作成評議決定書之前，都可以撤回。\n\n二、書面敘明原因、簽名，送學務處學務長室即可撤案。撤案申請書範例請參閱學務處網頁。\n\n \n\n向學校提出申訴後，仍然未獲得救濟，還有什麼救濟途徑？\n\n \n\n對於本校之行政處分，經向申評會提出申訴仍未獲救濟者，得於收到評議書之次日起30日內，繕具訴願書並檢附評議書，經由本校(學務處學務長室收件)向教育部提起訴願。訴願書範例請參閱學務處網頁。\n\n \n\n \n\n \n\n宿舍設備及請修 《[回類型列表](https://osa.nccu.edu.tw/tw/faq#TOP)》\n\n \n\n \n\n學生宿舍冷氣卡何處可購買?\n\n \n\n冷氣電費計費IC卡片面額為五百元，同學可至員生消費合作社購買使用。\n\n \n\n學生宿舍電話如何申請內線外撥?\n\n \n\n寢室分機要撥打外線，須向中華電信申請「099隨身碼」，請洽中華電信木柵服務中心查詢，連絡電話：(02)29368444或0800-080123。\n\n學務處意見信箱： nccuosa@nccu.edu.tw 總機電話：02-29393091 緊急事件通聯窗口（24小時） 學安、校安中心 0919099119, 校內分機 66119 駐警隊 02-29387129, 校內分機 66110 地址：台北市文山區指南路二段64號 行政大樓三樓 Copyright © 2019 國立政治大學學務處. All Rights Reserved.", "counted": true}, {"index": 3, "role": "HumanMessage", "tool": null, "title": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]", "chars": 4341, "text": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]\n\nget_form 取得表單 離宿暨退還保證金申請表-學期中/末搬離宿舍(中文.English) Application for Leaving the Dorm/Deposit Return\n[live:src status=snapshot kind=form checked= snap=2026-08 tls=0 url=https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-M03-01-05]\n\n全文：\n表單編號：QP-M03-01-05\n保存年限：1年\n致：住宿輔導組 □學士班宿舍 □碩博士班宿舍\nTO : Student Housing Service Section Undergraduate Dorm Graduate Dorm\n離宿流程：宿舍區管理人員檢查寢室➔三天內至住宿組辦理退費(持本表及宿費收據)\nProcedure for moving out of the dorms：Resident Hall service counter (to inspect the room) ➔Student Housing Service Section\n(within 3 days of inspection, bring your receipt for dorm payment to process your exit record, P-T01-03-08)", "sources": [{"kind": "snapshot", "as_of": "2026-08（output/ 快照）", "url": "https://aca.nccu.edu.tw/zh/服務項目/雙主修-輔系-學程/碩博士班雙修輔系"}, {"kind": "live", "as_of": "2026-11-13（現場）", "url": "https://aca.nccu.edu.tw/zh/服務項目/雙主修-輔系-學程/碩博士班雙修輔系"}], "keypoints": ["K20"], "found": true}]}, "prediction": {"content": "碩士班申請雙主修或輔系，要經過**三段連續審核**，依序是：\n\n1. **所屬（就讀）學系所**：先同意所屬學生申請（承辦人、單位主管核章）。\n2. **申請學系所**（招收修讀雙主修或輔系的學系所）：收到就讀學系所核章的申請書後審查，決定准予或不准修讀（承辦人、單位主管）。\n3. **教務處註冊組**：審查基本資格並維護資料（承辦人、組長）。聯絡人：註冊組組長王揚忠（分機 63273），註冊組在行政大樓四樓。\n\n各學系所審核完畢後會在網頁公告核准名單；名單送教務處後，教務處仍會審查基本資格，不符資格會取消錄取。\n\n申請規定：\n- 對象是碩、博士班學生，碩士在職專班不開放；要自註冊在學第二學期起至第四學期止申請。\n- 申請前要先確認哪些學系所有開辦（教務處公告的碩、博士班雙主修輔系開辦資訊）。\n- 申請時間是每年四月下旬至五月上旬（依學校行事曆公告為準）；填紙本申請書，要在截止日前送達申請學系，逾期不受理。\n- 額度：同級雙主修及同級或向下一級輔系，各以一個學系所為限；碩士班學生可申請碩士班雙主修，及碩士班輔系或學士班輔系。\n- 同時申請同一學系的雙主修與輔系，已符合雙主修資格時，以雙主修錄取。\n- 輔系原則上不得修習前已取得學位的學系所；經核定修讀後如重新申請其他學系所，會自動放棄原有資格，不得回復。\n- 申請表是「碩、博士班學生修讀雙主修／輔系申請表」，表單編號 QP-T01-03-08，下載連結：https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-08", "references": [{"index": 1, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 1076 字，標題: 碩博士班雙修輔系，subdomain: aca", "chars": 1272, "text": "get_page 取得 1076 字，標題: 碩博士班雙修輔系，subdomain: aca\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://aca.nccu.edu.tw/zh/服務項目/雙主修-輔系-學程/碩博士班雙修輔系]\n[偵測到表單編號: QP-T01-03-08]\n\n全文：\n碩博士班雙主修輔系\t\t\t\n\n申請對象\n\n本校碩、博士班學生，自註冊在學第二學期起至第四學期止，經就讀學系所（學程）同意，得向招收修讀雙主修或輔系學系所（學程）提出申請。\n\n開辦資訊\n\n[碩、博士班雙主修輔系開辦資訊](https://aca.nccu.edu.tw/db/upload/%E7%A2%A9%E3%80%81%E5%8D%9A%E5%A3%AB%E7%8F%AD%E9%9B%99%E4%B8%BB%E4%BF%AE%E8%BC%94%E7%B3%BB%E9%96%8B%E8%BE%A6%E8%B3%87%E8%A8%8A.pdf)\n\n申請時間\n\n每年四月下旬至五月上旬期間（依本校行事曆公告為準）。\n\n申請方式\n\n於上列公告申請時間內填寫紙本申請書申請。\n\n經就讀學系所核章後，併同其他申請資料送申請雙輔學系所審查。\n\n申請相關事項\n\n一、修讀同級雙主修及同級或向下一級輔系，各以一學系所（學程）為限。\n\n二、碩士在職專班不開放學生申請雙主修或輔系。\n\n三、同時申請同一學系為雙主修及輔系，經學系審查已符合雙主修修讀資格時，即以雙主修錄取。\n\n四、申請修讀輔系，以不得修習前已取得學位之學系所（學程）為原則，但經申請修讀學系所（學程）同意者，不在此限。\n\n五、學生經核定修讀雙主修或輔系，如符合申請資格，得重新申請修讀其他學系所（學程）雙主修或輔系，經核定同意後即自動放棄原有之雙主修或輔系修讀資格，且不得再申請回復。\n\n六、學生不得以雙主修學系所（學程）轉為主修學系畢業。\n\n修課規定\n\n學生修讀雙主修或輔系，應依核准開始修讀學年度該學系之修課及學分採計規定辦理。\n\n一、修讀博、碩士班雙主修，至少應修習該學系所（學程）四分 之三之最低畢業學分數。\n\n二、修讀博、碩士班輔系，至少應修習該學系所（學程） 三分之二最低畢業學分數。\n\n三、修讀學士班輔系則依輔系科目表規定辦理。\n\n放棄修讀\n\n自114學年度開始，每學期得於學期三分之二基準日前，申請放棄雙主修或輔系。\n\n相關法規\n\n[國立政治大學碩博士班學生修讀雙主修、輔系辦法](https://aca.nccu.edu.tw/download/rulesdata/law131A.pdf)\n\n申請表下載 \n\n[國立政治大學碩、博士班學生修讀雙主修輔系申請表](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-08)\n\n116011台北市文山區指南路二段64號 行政大樓四樓 聯絡我們", "counted": true}, {"index": 2, "role": "HumanMessage", "tool": null, "title": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]", "chars": 1483, "text": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]\n\nget_form 取得表單 國立政治大學碩、博士班學生修讀雙主修輔系申請表\n[live:src status=snapshot kind=form checked= snap=2026-08 tls=0 url=https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-03-08]\n\n全文：\nQP-T01-03-08\n保存年限: 學生畢業\n國立政治大學碩、博士班學生修讀雙主修/輔系申請表\n申請相關說明：\n1. 學生提出申請前，請務必至教務處網頁查看學校目前有開放碩、博士班學生申請雙主修/輔系的教學單位，再向該單\n位提出申請。\n2. 碩、博士班學生自註冊在學第二學期起至第四學期止可申請修讀雙主修/輔系。碩士在職專班學生不開放申請。\n3. 申請日程依校訂行事曆公告為準，請於申請截止日前將申請表及相關申請資料紙本送達申請學系，逾期不予受理。\n4. 申請額度以一個同級雙主修及一個同級或向下一級輔系為限。博士班學生可申請修讀博士班雙主修及博士班輔系或\n碩士班輔系；碩士班學生可申請修讀碩士班雙主修及碩士班輔系或學士班輔系。\n同時申請同一學系為雙主修及輔系，經學系審查已符合雙主修修讀資格時，即以雙主修錄取。\n5. 各學系所於審核完畢後單位網頁公告核准修讀名單，請自行前往查詢。名單送交教務處後，仍會就說明一及說明三\n審查基本資格；如未符資格，將取消錄取。\n製表日期：20250425\n\n| 學號 |  | 姓名 |\n| --- | --- | --- |\n| 學系 | ______________________系(所) □博士班 □碩士班 |  |\n| 聯絡電話 |  | 電子郵件 |\n| 申請學系 | ______________________系(所) |  |\n| 申請項目 | □博士班雙主修(限博士班學生申請) □博士班輔系(限博士班學生申請) □碩士班雙主修(限碩士班學生申請) □碩士班輔系 □學士班輔系 (限碩士班學生申請) |  |\n| 雙主修/輔系 修讀情形 | □現無修讀雙主修 □現無修讀輔系 |  |\n|  | □雙主修______________________系(所) □輔系______________________系(所) |  |\n| 本人已知悉： 1. 申請學系所訂定之應修科目學分、修業規定，並已詳閱本校碩博士班學生修讀雙主修、輔系辦法與下列 說明事項，願確實遵守修課及其他相關規範。 2. 本次申請之雙主修/輔系如經核定修讀，視同自願放棄原有之雙主修或輔系資格，且不得再申請回復。 申請人簽名：_____________________ 申請日期：______年______月______日 |  |  |\n\n|  |  |  |  |\n| --- | --- | --- | --- |\n| 簽 核 流 程 |  |  |  |\n|  |  |  |  |\n| 所屬學系(所) tion": {"content": "出國交換回國後要辦理學分抵免，體育、一般通識、外文通識分別由不同單位審查，整體流程如下：\n\n**1. 申請書與送件**\n- 申請表是「國內／出國交換選課學分抵免申請表」，表單編號 QP-T01-04-05，下載連結：https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-04-05\n- 在出國選課學年期的次學期三分之一基準日前辦理。\n- 填好申請表，連同出國學年期成績單正本與課程大綱等相關文件，送到就讀系所辦公室。\n\n**2. 各類科目由哪個單位審查**（科目如須校內相關開課單位審查，要先行送審）：\n- **體育** → **體育室**審查。體育必修課程的抵免以四門為限。\n- **一般通識**（含書院通識）→ **通識教育中心**審查。核心通識不得抵免；向通識中心申請的國外成績證明，要先到系所或國合處蓋「與正本相符」戳記。\n- **外文通識** → **外文中心**審查。\n- 其他科目是否抵免、列入畢業學分，由就讀系所審查認定。\n\n**3. 審核後的程序**：體育室、通識教育中心、外文中心審核後，再送教務處註冊組複查，簽請教務長核定，核定後抵免的科目登錄在學生的成績總表。\n\n**聯絡窗口**\n- 教務處註冊組：組長王揚忠，分機 63273；註冊組在行政大樓四樓。\n- 通識教育中心：吳睿芸，分機 63872；通識教育中心在行政大樓四樓。\n- 體育室：吳鴻傑，分機 62198。\n- 外文中心：吳沛瀅，分機 62396；辦公室在國際大樓五樓。", "references": [{"index": 1, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 3153 字，標題: 學分抵免（含新生及出國）-整合，subdomain: aca", "chars": 3401, "text": "get_page 取得 3153 字，標題: 學分抵免（含新生及出國）-整合，subdomain: aca\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://aca.nccu.edu.tw/zh/服務項目/成績-抵免/學分抵免（含新生及出國）-整合]\n[偵測到表單編號: QP-T01-04-01, QP-T01-04-02, QP-T01-04-05, QP-T01-04-19]\n\n全文：\n抵免學分\t\t\t\n\n \n\n辦理對象\n\n各學制新生、轉學生。\n\n辦理時間\n\n每年八月上旬至中旬（依本校行事曆公告為準）。\n\n辦理方式\n\n於公告之申請時間內，填具本校抵免學分申請表，併同原修讀校中文成績單正本乙份及課程大綱等相關證明文件，逕至各系所辦公室送件申請，逾期不再受理。\n\n例假日及非上班時間不受理收件。\n\n申請表下載及相關事項說明\n\n[學分抵免申請相關事項公告](https://aca.nccu.edu.tw/download/Rgr_file/credit%20exemption/115學年新生扺免申請相關事項(網路公告)-中英文版.pdf)\n\n[學士班新生抵免學分申請表](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-04-01)\n\n[碩博士班新生抵免學分申請表](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-04-02)\n\n相關法規\n\n[國立政治大學學則](https://aca.nccu.edu.tw/download/rulesdata/law01A.pdf)\n\n[國立政治大學學生抵免學分辦法](https://aca.nccu.edu.tw/download/rulesdata/law06A.pdf)\n\n \n\n辦理對象\n\n碩、博士班甄試提前入學新生。\n\n辦理時間\n\n甄試提前入學新生：提前入學申請截止日後兩週內（日期依各學年公告為準）。\n\n如未及辦理或學系另有規定，請於當年度八月碩、博士班新生抵免申請時程提出申請（依本校行事曆公告為準）。\n\n辦理方式\n\n於公告之申請時間內，填具本校抵免學分申請表，併同原修讀校中文成績單正本乙份及課程大綱等相關證明文件，逕至各系所辦公室送件申請，逾期不再受理。\n\n例假日及非上班時間不受理收件。\n\n申請表下載及相關事項說明\n\n[碩博士班甄試提前入學學生抵免學分申請表](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-04-19) \n\n相關法規\n\n[國立政治大學學則](https://aca.nccu.edu.tw/download/rulesdata/law01A.pdf)\n\n[國立政治大學學生抵免學分辦法](https://aca.nccu.edu.tw/download/rulesdata/law06A.pdf)\n\n \n\n辦理對象\n\n本校赴國外大學選修課程（出國交換）學生。\n\n辦理時間\n\n申請出國選課學年期之次學期三分之一基準日前辦理。\n\n辦理方式\n\n一、學生於出國學期結束後，應提出國外大學所修習之正式成績單或成績證明書，於前項申請時間內，填具本校出國選課抵免學分申請表，併同出國學年期成績單正本乙份及課程大綱等相關文件，逕至各系所辦公室送件申請，逾期不再受理。\n\n二、例假日及非上班時間不受理收件。\n\n三、擬申請抵免科目如須校內相關開課單位審查（如中文通識、外文通識、體育、一般通識及雙主修輔系課程），應先行送審。\n\n申請表下載\n\n[國內/出國交換選課學分抵免申請表](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-04-05) \n\n逾期未辦理抵免學分之處理\n\n一、學士班及碩士班學生於出國期間，每學期至少應於國外大學修習一門課程。出國選課申請期間結束後，如無意願申請抵免學分，亦須提交修課證明文件憑辦不抵免學分切結。\n\n二、未於規定期限內辦理學分抵免申請，將於成績總表註記「出國選課期間未符修課規定，不予抵免學分」。\n\n相關法規\n\n[國立政治大學學生出國選修課程實施辦法](https://aca.nccu.edu.tw/download/rulesdata/law05A.pdf)\n\n[國立政治大學學生抵免學分辦法](https://aca.nccu.edu.tw/download/rulesdata/law06A.pdf)\n\n \n\n作業依據\n\n比照96.3.27.柏克萊大學暑期進修協調會議決議事項辦理。\n\n辦理對象\n\n本校國際合作事務處或其他教學單位於每學年暑期辦理學生至國外大學進行暑期交換學習，同學經國合處或其他教學單位暑期專案薦送者，得於回國後申請學分抵免。\n\n辦理時間\n\n申請出國選課當年度十月三十一日前申請辦理。\n\n辦理方式\n\n一、學生於出國期間結束後，應提出國外大學所修習之正式成績單或成績證明書，於前項申請時間內，填具本校出國選課抵免學分申請表，併同成績單正本乙份及課程大綱等相關文件，逕至各系所辦公室送件申請，逾期不再受理。\n\n二、例假日及非上班時間不受理收件。\n\n三、擬申請抵免科目如須校內相關開課單位審查（如中文通識、外文通識、體育、一般通識及雙主修輔系課程），應先行送審。\n\n申請表下載及相關事項說明\n\n[國內/出國交換選課學分抵免申請表](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-04-05) \n\n出國選課學期（第二學期）如達畢業標準，則暑期出國選課結束返國後，不得再提出抵免學分申請。\n\n逾期未辦理抵免學分之處理\n\n逾期不再受理抵免申請，並同時於系統刪除出國選課紀錄。\n\n相關法規\n\n[國立政治大學學生出國選修課程實施辦法](https://aca.nccu.edu.tw/download/rulesdata/law05A.pdf)\n\n[國立政治大學學生抵免學分辦法](https://aca.nccu.edu.tw/download/rulesdata/law06A.pdf)\n\n \n\n辦理對象\n\n本校赴臺北藝術大學、台聯大各校交換選修課程（全時選讀）學生。\n\n辦理時間\n\n申請國內交換選課學年期之次學期三分之一基準日前辦理。\n\n辦理方式\n\n一、學生於國內交換學期結束後，應提出交換學校所修習之正式成績單或成績證明書，於前項申請時間內，填具本校出國選課抵免學分申請表，併同國內交換學年期成績單正本乙份及課程大綱等相關文件，逕至各系所辦公室送件申請，逾期不再受理。\n\n二、例假日及非上班時間不受理收件。\n\n三、擬申請抵免科目如須校內相關開課單位審查（如中文通識、外文通識、體育、一般通識及雙主修輔系課程），應先行送審。\n\n申請表下載\n\n[國內/出國交換選課學分抵免申請表](https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-04-05) \n\n逾期未辦理抵免學分之處理\n\n一、學士班及碩士班學生於交換學習期間，每學期至少應於交換學校修習一門課程。交換學習申請期間結束後，如無意願申請抵免學分，亦須提交修課證明文件憑辦不抵免學分切結。\n\n二、未於規定期限內辦理學分抵免申請，將於成績總表註記「國內選課期間未符修課規定，不予抵免學分」。\n\n相關法規\n\n[政治大學學生赴國内簽約學校交換學習實施作業要點](https://aca.nccu.edu.tw/download/rulesdata/law72A.pdf)\n\n[國立政治大學學生抵免學分辦法](https://aca.nccu.edu.tw/download/rulesdata/law06A.pdf)\n\n116011台北市文山區指南路二段64號 行政大樓四樓 聯絡我們", "counted": true}, {"index": 2, "role": "HumanMessage", "tool": null, "title": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]", "chars": 18347, "text": "[表單全文，系統偵測到表單編號後自動抓取，請直接引用其中的流程/站點/費用等細節]\n\nget_form 取得表單 115學年度學士班新生抵免學分申請表 / Application for Undergraduate Credit Exemption of Academic Year 2026-2027\n[live:src status=snapshot kind=form checked= snap=2026-08 tls=0 url=https://moltke.nccu.edu.tw/formservice_SSO/link.jsp?viewdetail=QP-T01-04-01]\n\n全文：\n首 表單編號：QP-T01-04-01\n政治大學一一五學年度 學士班新生 抵免學分申請表\n頁 保存年限：1 年~學生畢業\n申請日期： 年 月 日 全_____頁第___1__頁 (本頁填畢請填續頁以便簽名核章)\n＊本申請表請以單面列印，以便審查。\n＊科目填寫順序，即為當核定同意抵免學分逾規定上限，學校依據同學排定之抵免類別次序，進\n行超過抵免學分數刪除課程時，優先保留之排序，請同學審慎填寫。\n\n| 學號 | 姓名 | 學系 | 身份別 | 聯絡方式 |\n| --- | --- | --- | --- | --- |\n|  |  | 系 | □大一新生 □轉學生(二年級以上) 年級：＿＿＿（必填） | E-MAIL： 手機： |\n\n| 原校及格科目、學分 |  | 擬抵免本校科目、學分 |  |  |  |  | 開課單位審查意見 |  |  |  |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 原科目名稱 | 學分 | 科目中文名稱/ 科目代碼 |  |  | 學 |  | （請逐欄勾選意見並簽章） |  |  |  |\n|  |  |  |  |  | 分 |  | 上學期 |  | 下學期 | 審核人員簽章 |\n| ＊本校109學年度（含）以後入學學生，如原修習體育課為0學分課程，在符合18小時1學分之條件下（本校1 學分體育每週授課2小時），得依所適用之共同科目修習規定，申請抵免本校體育必修1學分課程。 |  |  |  |  |  |  |  |  |  |  |\n|  |  | 體育 | F00165-001 大一體育 | 1 |  | □同意抵免 □不准抵免 |  | ---- |  |  |\n|  |  |  | F00165-002 大一體育 | 1 |  | ---- |  | □同意抵免 □不准抵免 |  |  |\n|  |  |  | F00165-011 大二體育 | 1 |  | □同意抵免 □不准抵免 |  | ---- |  |  |\n|  |  |  | F00165-012 大二體育 | 1 |  | ---- |  | □同意抵免 □不准抵免 |  |  |\n|  |  | 中文 通識 | 031001-011 | 3 |  | □不准抵免 □同意抵免_______學分 |  | ---- |  |  |\n|  |  |  | 031019-011 | 3 |  | ________________________\n 提出申請抵免之已修科目及擬抵免本校科目，以近十年課程為原則。擬抵免科目，請於本校課程查詢系統查詢（政大首頁/全校課程查詢），\n如有疑問可洽詢學系所助教協助。申請抵免碩、博士班課程，請填寫開課學制為碩、博士班之科目名稱及代碼；申請抵免學士班課程（如先\n修科目），請填學士班科目名稱及代碼。\n 抵免學分之科目、代碼以本系所開課程為原則；本系未開者，請查詢相關學系之科目、代號。並請務必詳細填寫。\n 入學前所修課程可否抵免、或列入畢業最低學分總數內計算，由各系所基於其專業能力認定。抵免學分數除學系所另有規定外，以各學系所\n規定畢業學分數二分之一為限。\n 同意抵免但不計入畢業學分：指學系所規定之學士班先修科目，或指定應修但不計入畢業學分之課程。\n\n| 學號 |  | 姓名 |  |  | 系所 |  |  |  |  |  | 身份別 |  | 聯絡方式 |  |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n|  |  |  |  |  | 系/ 研究所 |  |  |  |  |  | □碩士班 □碩士在職專班 □博士班 |  | E-MAIL： 手機： |  |\n|  | 原校及格科目、 |  | 擬申請抵免本校科目、學分 |  |  |  |  | 系所審查意見 |  |  |  |  |  |  |\n|  | 學分 |  |  |  |  |  |  | （請逐欄勾選意見並確認代碼無誤後簽章） |  |  |  |  |  |  |\n| 原科目名稱 |  | 學 分 |  | 科目中文名稱 |  | 學 分 | 請 圈 選 |  |  | 抵免 |  | 審查結果 |  | 審核人員 簽章 |\n|  |  |  |  | (請至全校課程查詢) |  |  |  |  |  | 學期 |  |  |  |  |\n|  |  |  |  | 科目代碼 |  |  |  |  | 上 |  | 下 |  |  |  |\n|  |  |  |  | (共9碼，請系所協助) |  |  |  |  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  | 必 群 選 |  |  |  |  | □同意抵免_______學分 □不准抵免 □同意抵免但不計入畢業學分 (含學士班課程)_______學分 |  |  |\n|  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  | 必 群 選 |  |  |  |  | □同意抵免_______學分 □不准抵免 □同意抵免但不計入畢業學分 (含學士班課程)_______學分 |  |  |\n|  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  | 必 群 選 |  |  |  |  | □同意抵免_______學分 □不准抵免 □同意抵免但不計入畢業學分 (含學士班課程)_______學分 |  |  |\n|  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  | 必 群 選 |  |  |  |  | □同意抵免_______學分 □不准抵免 □同意抵免但不計入畢業學分 (含學士班課程)_______學分 |  |  |\n|  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  | 必 群 選 |  |  |  |  | □同意抵免_______學分 □不准抵免 □同意抵免但不計入畢業學分 (含學士班課程)_______學分 |  |  |\n|  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  | 必 群 選 |  |  |  |  | □同意抵免_______學分 □不准抵免 □同意抵免但不計入畢業學分 (含學士班課程)_______學分 |  |  |\n|  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |\n\n| 請 |\n| --- |\n| 圈 |\n| 選 |\n\n| 學 |\n| --- |\n| 分 |\n\n| 學 |\n| --- |\n| 分 |\n\n| 審 議修正通過\n第2條、第3條及第4條\n民國95年6月5日本校94學年度第2學期第2次教務會議修正通過\n第2條、第3條、第11條、第12條\n民國96年6月4日本校95學年度第2學期第2次教務會議修正通過\n第2條、第2條之1、第3條、第11條、第12條、第13條\n民國100年12月12日本校100學年度第1學期第2次教務會議修正通過\n第2條、第2之1條、第3條、第4條、第5條、第6條、第11條、第12條、第13條及刪除第8條\n民國101年2月9日政教字第1010002760號函發佈\n民國111年12月19日本校111學年度第1學期第2次教務會議修正通過\n第2條、第3條、第4條、第5條、第6條、第7條、第8條、第9條、第10條及刪除第2之1條\n民國112年3月20日本校111學年度第2學期第1次教務會議修正通過\n第5條、第7條\n民國112年5月9日政教字第1120013198號函發布\n民國115年6月1日114學年度第2學期第2次教務會議修正通過第4條、第10條\n民國115年7月30日政教字第1152800227號函發布\n第一條 為辦理學生學分抵免事宜，依據本校學則規定，訂定本辦法。\n第二條 本校學生符合下列條件之一者，得申請抵免學分：\n一、 各學制入學一年級新生。\n二、 轉學生（含台灣聯合大學系統學校轉校生）\n三、 以香港副學士（或高級文憑）資格入學就讀本校學士班。\n四、 經校際合作至本校修讀雙聯學位。\n五、 經本校核准出國修課或薦送至國內、外大學交換及台灣聯合大學系統學校全時\n選讀。\n六、 在學期間經核准修習本校開設之學分班。\n第三條 學生得申請已修習及格科目及學分辦理抵免，惟有下列情形之一者，不得抵免：\n一、 已計入為其他授予學位畢業學分之科目。\n二、 入學本校前修習及格之科目，已超過十年者。惟學系所得視學門知識發展，自\n訂相關規範。\n三、 五專畢業生一年級至三年級所修習之科目及四、五年級重補修三年級（含）以\n前科目。\n四、 學生入學後，除符合第二條第六款規定外，所修習之各類學分班科目。\n五、 碩、博士班一年級新生於修讀學、碩士學位期間，修習碩、博士班課程成績未\n達七十分（或等第制B-）以上之科目。\n第四條 學生抵免學分數與轉（編）入年級之規定如下：\n1\n\n一、 學士班一年級新生抵免學分總數以二十學分為限。各學系得審酌學生抵免必修\n科目情形及抵免學分數多寡辦理提高編級申請，惟編入年級至多以學生原校修\n習年級提高一個年級為限，且至少應註冊在學兩學期始可畢業。提高編級者抵\n免學分上限依第二款規定辦理。\n二、 轉學生轉入本校學士班一年級第二學期者，其抵免學分總數以二十學分為限；\n轉入二年級者（含台灣聯合大學系統學校轉校生），其抵免學分總數以四十學分\n為限；轉入三年級者（含台灣聯合大學系統學校轉校生），其抵免學分總數以八\n十學分為限。轉學生如有特殊情形，學系得專案申請不受本款抵免學分上限之\n限制。\n轉學生應依原錄取年級入學。轉入一年級下學期，不得申請提高編級，其餘學\n生有以下情形之一者，得申請提高編級：\n(一) 轉入之學系未辦理三年級轉學生招生且與原修習年級相當。\n(二) 原為本校退學重新入學學生，得提高編級至原修習相當之年級。\n三、 以香港副學士（或高級文憑）資格入學就讀本校學士班者，依第一款規定抵免\n學分及提高編級，惟至多得提高編級至三年級。\n四、 碩、博士班一年級新生（含台灣聯合大學系統學校轉校生）除學系所另有規定\n外，以各學系所規定畢業學分數二分之一為限。學系所另有規定抵免學分上限\n時，至多不得逾畢業學分數三分之二。\n五、 雙聯學位學生依簽訂之合約規定辦理抵免學分，至多不得逾學系所畢業學分數\n三分之二。\n六、 第二條第五款學生抵免學分數依本校「國立政治大學學生出國選修課程實施辦\n法」及「本校學生赴國內簽約學校交換學習實施作業要點」規定辦理。\n七、 第二條第六款學生抵免學分以十二學分為上限。\n學生以修習推廣教育學分班取得學分辦理抵免後，在校修業不得少於該學制修業期\n限及畢業應修學分數二分之一，且不得少於一年。\n學生以遠距教學方式取得之推廣教育學分申請學分抵免，其科目學分數已超過畢業\n總學分數之三分之一者，該學系所應專案報請教務處，由教務處造冊報教育部備查。\n第五條 本校科目得申請抵免學分之範圍：\n一、 專業課程為各學系所必（群）修及選修科目。\n二、 共同必修課程為本校學士班通識科目及體育科目。\n(一) 語文通識、一般通識及書院通識得申請抵免。一般通識抵免以原就讀學校\n所修習之通識課程為限。書院通識及核心通識抵免限本校開設之書院及核\n心通識課程。\n(二) 體育必修課程得申請抵免，以四門為限。一Ｏ九學年度（含）以後入學學\n生，如原修習體育課為零學分課程，在符合十八小時一學分之條件下，得\n依所適用之共同科目修習規定，申請抵免本校體育必修一學分課程。\n第六條 抵免科目及學分數應符合下列規定：\n一、 抵免科目審核原則如下：\n2\n\n(一) 名稱及內容均相同。\n(二) 名稱不同而內容相同。\n(三) 名稱及內容雖不同而性質相同。\n二、 抵免學分數核定原則如下：\n(一) 以較多抵免較少學分者，抵免後以較少學分登記。\n(二) 以較少抵免較多學分者，不得抵免。除就讀學系所及相關教學單位以指定\n科目補足所差學分，方得辦理。抵免後以較少學分登記。\n第七條 新生應於入學當學年度依學校公告日程一次辦理抵免學分；第二條第五款學生於交\n換或全時選讀學期結束後，依「國立政治大學學生出國選修課程實施辦法」及「本\n校學生赴國內簽約學校交換學習實施作業要點」規定辦理抵免學分；第二條第六款\n學生除學分班另有規定外，應於修業結束後一個月內辦理抵免學分。\n本校申請抵免學分程序如下：\n一、 學生應填寫相關學分抵免申請表（書）並附中文成績單正本或足資證明修課科\n目、成績及學分數之中文成績證明文件辦理；持國外大學核發成績證明文件，\n以英文為原則。學生送交辦理抵免學分文件不予退還。\n二、 新生抵免學分作業，專業課程由學生就讀學系所審查；中文通識由中文系審查；\n外文通識由外文中心審查；一般通識及書院通識由通識教育中心審查；體育課\n程由體育室審查。教育學程科目抵免學分由師資培育中心受理申請及審查。各\n審查單位得要求學生檢附課程大綱，始予受理。\n第二條第五款學生抵免作業，雙主修或輔系專業課程由相關學系所審查，其他\n課程依前目規定辦理。\n第二條第六款學生抵免作業，由學生就讀學系所審查。\n三、 本項各類抵免學分經相關單位審核後，送交教務處註冊組複查，簽請教務長核\n定後，於學生學業成績總表登錄。成績分數欄以EX字樣呈現，不登錄原始修課\n成績。\n抵免科目除學生在學期間國內、外交換（全時選讀）登錄於學生交換（全時選\n讀）當學期外，其餘均登錄於學業成績總表入學年度前一欄位。\n第八條 抵免學分作業完成經審核登錄後，學生得自成績查詢系統查詢結果。科目學分經抵\n免登錄後，不得更換抵免其他科目學分。如對抵免結果有疑義時，應於申請抵免學\n分當學期之學期結束日前，向教務處註冊組提出複查申請。\n第九條 其他有關抵免學分未盡事項，悉依本校學則及相關規定辦理。\n第十條 本辦法經教務會議通過後發布施行，並報請教育部備查，修正時亦同。\n3", "counted": true}, {"index": 4, "role": "ToolMessage", "tool": "get_page_tool", "title": "get_page 取得 2107 字，標題: credits-from-overseas-exchange-programs，subdomain: gecenter", "chars": 2364, "text": "get_page 取得 2107 字，標題: credits-from-overseas-exchange-programs，subdomain: gecenter\n[live:src status=snapshot kind=page checked= snap=2026-08 tls=0 url=https://gecenter.nccu.edu.tw/student-zone/gec-credit-waiver/credits-from-overseas-exchange-programs]\n\n全文：\nRegulations\n\n    通識學分認抵  \n\n      國外交換學分認抵本校一般通識學分    \n\n                          01                        \n                                            申請資格                    \n\n依《國立政治大學學生出國選修課程實施辦法》申請出國交換之學士班學生。\n\n                          02                        \n                                            辦理期間                    \n\n交換回國次學期三分之一基準日前（確切時間請參看各學期行事曆）。\n\n                          03                        \n                                            認抵說明                    \n\n出國期間，學士班學生每學期至少應於國外大學修習一門課程。若日後欲進行抵免，需先行留存交換學校課程大綱，以利申請。\n\n學生於出國學期結束後，應備齊申請文件，於次學期三分之一基準日前洽通識教育中心辦理。\n\n                          04                        \n                                            繳交資料                    \n\n(1) 出國交換/選課抵免學分申請表\n\n(2) 國外學校含有及格成績之成績證明，回國後須至系所或國合處蓋「與正本相符」戳記。\n\n(3) 交換學校課程大綱。須包含：每週教學內容、授課教師姓名、學年期、學分數。若為外語，需翻譯為中文或英文。\n\n(4) 欲抵免之政大課程大綱，須為近十年內開設之一般通識課程（核心通識不得抵免）。\n\n                          05                        \n                                            認抵原則                    \n\n須以本校課程內容相近的一般通識課程進行認抵（核心通識不得抵免）。本中心將就課綱近似程度進行抵免審查。課綱審核原則如下 ：\n\n一、名稱及內容相同。二、名稱不同而內容相同。三、名稱及內容不同而性質相同。\n\n抵免學分數核定原則如下：以較多抵免較少學分者，抵免後以較少學分登記；以較少學分抵免較多學分者，不得抵免。\n\n除就讀系所及相關教學單位以指定科目補足所差學分，方得辦理。抵免後以較少學分登記。\n\n                          06                        \n                                            學分規定                    \n\n出國選課學分數之抵免，學士班以不超過畢業最低學分總數三分之一；碩、博士班以不超過畢業最低學分總數二分之一為限。出國修讀雙聯學位學分抵免以不超過畢業最低學分總數三分之一為限。\n\n關於國外學分轉換為政大學分之計算方式，請參考「[國立政治大學學生成績作業要點](https://aca.nccu.edu.tw/download/rulesdata/law07A.pdf)」第八條。\n\n                          07                        \n                                            注意事項                    \n\n未於規定期限內提出學分抵免申請，除因特殊事由經專案簽核准外，均不得再申請抵免，並由教務處於成績總表註記「出國選課期間未符修課規定，不予抵免學分」。碩、博士生亦可申請抵免，惟不計入畢業學分。\n\n      文件下載    \n\n[政治大學學生出國/國內交換選課抵免學分申請表](https://gecenter.nccu.edu.tw/wp-content/uploads/05-出國選課抵免學分申請表.pdf)\n\n[國立政治大學學生出國選修課程實施辦法](https://oic.nccu.edu.tw/Upload/FileManager/4fd69618-9214-4e09-8d0d-fedd22618293.pdf)\n\n[國立政治大學學生成績作業要點](https://gecenter.nccu.edu.tw/wp-content/uploads/國立政治大學學生成績作業要點-1.pdf)\n\n[國立政治大學學生抵免學分辦法](https://aca.nccu.edu.tw/download/rulesdata/law06A.pdf)", "counted": true}, {"index": 5, "role": "HumanMessage", "tool": null, "title": "[辦公室聯絡資訊，以下是內容中提及的全部 4 個辦公室（註冊組、體育室、通識教育中心、外文中心），未經相關性篩選——這是完整清單，不代表每一個都跟這題直接相關。是否每個都要寫進最終", "chars": 1468, "text": "[辦公室聯絡資訊，以下是內容中提及的全部 4 個辦公室（註冊組、體育室、通識教育中心、外文中心），未經相關性篩選——這是完整清單，不代表每一個都跟這題直接相關。是否
